:root{
  --bg:#eef6f6; --card:rgba(255,255,255,.72); --card2:rgba(255,255,255,.94);
  --border:rgba(12,74,84,.11); --border2:rgba(12,74,84,.19);
  --text:#123239; --text2:#41626a; --muted:#6d8a90;
  --accent:#0b93a4; --accent2:#12ab84; --accent-dim:#9ed6dc;
  --grad:linear-gradient(135deg,#0aa2b4 0%,#14bd8e 100%);
  --push:#d9611f; --pull:#2d7bd4; --legs:#128d60;
  --good:#0f9d6d; --warn:#ad7407; --bad:#d45555;
  --r:20px; --rc:14px; --tap:48px;
  --shadow:0 14px 34px rgba(10,84,94,.13);
  --fig:#1d434c; --glassbr:rgba(255,255,255,.85);
}
html[data-theme=dark]{
  --bg:#0a1215; --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.15);
  --text:#edf6f6; --text2:#a7bdbd; --muted:#78908f;
  --accent:#2ec6d1; --accent2:#2dd6aa; --accent-dim:#135e66;
  --grad:linear-gradient(135deg,#17b2c2 0%,#22cf9d 100%);
  --push:#e97e45; --pull:#4f96e8; --legs:#25b57f;
  --good:#24c08b; --warn:#e8a13c; --bad:#e57373;
  --shadow:0 14px 34px rgba(0,0,0,.45);
  --fig:#dff2f2; --glassbr:rgba(255,255,255,.14);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; height:100%; overscroll-behavior-y:none;
  background:var(--bg);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px; line-height:1.45; color:var(--text)}
body::before{content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(56% 38% at 10% -6%, rgba(14,178,196,.16), transparent 62%),
    radial-gradient(48% 32% at 106% 10%, rgba(34,207,157,.13), transparent 62%),
    radial-gradient(64% 44% at 50% 116%, rgba(125,216,232,.12), transparent 66%),
    var(--bg)}
html[data-theme=dark] body::before{background:
    radial-gradient(56% 38% at 10% -6%, rgba(23,178,194,.13), transparent 62%),
    radial-gradient(48% 32% at 106% 10%, rgba(34,207,157,.09), transparent 62%),
    var(--bg)}
::-webkit-scrollbar{width:0; height:0}
#app{display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto}
/* ---------- шапка ---------- */
header{padding:calc(14px + env(safe-area-inset-top)) 18px 10px; flex:none}
header h1{font-size:21px; margin:0; font-weight:800; letter-spacing:-.4px}
header .sub{color:var(--text2); font-size:13px; margin-top:3px; font-weight:500}
#hd-prog{height:5px; border-radius:6px; background:rgba(12,74,84,.09); margin-top:12px; overflow:hidden}
html[data-theme=dark] #hd-prog{background:rgba(255,255,255,.07)}
#hd-prog i{display:block; height:100%; border-radius:6px; background:var(--grad); transition:width .6s cubic-bezier(.2,.8,.2,1)}
main{flex:1; overflow-y:auto; padding:2px 14px 26px; -webkit-overflow-scrolling:touch}
/* ---------- навигация ---------- */
nav{flex:none; display:flex; margin:6px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.78); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border); border-radius:24px; box-shadow:var(--shadow); padding:4px}
nav button{flex:1; position:relative; background:none; border:none; color:var(--muted); font:inherit;
  font-size:10.5px; font-weight:700; letter-spacing:.2px; padding:8px 0 7px; min-height:54px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px; border-radius:18px;
  transition:color .2s}
nav button svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round; position:relative; z-index:1}
nav button.on{color:#0b5560}
html[data-theme=dark] nav{background:rgba(16,26,29,.82)}
html[data-theme=dark] nav button.on{color:#e5feff}
nav button.on::before{content:''; position:absolute; top:4px; left:50%; transform:translateX(-50%);
  width:48px; height:30px; border-radius:999px; background:var(--grad); opacity:.28; filter:blur(2px)}
/* ---------- карточки ---------- */
.card{background:var(--card); border-top:1px solid var(--glassbr);
  border:1px solid var(--border); border-radius:var(--r); padding:16px; margin:12px 0;
  box-shadow:0 8px 24px rgba(10,84,94,.09)}
html[data-theme=dark] .card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.028)); box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card h3{margin:0 0 10px; font-size:11.5px; color:var(--muted); font-weight:800;
  text-transform:uppercase; letter-spacing:1.4px}
.row{display:flex; align-items:center; gap:10px}
.row .grow{flex:1}
.big{font-size:28px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums}
.small{font-size:13.5px; color:var(--text2)}
.tiny{font-size:12px; color:var(--muted); line-height:1.5}
.divider{height:1px; background:var(--border); margin:12px -16px}
.section-t{font-size:12px; font-weight:800; margin:20px 4px 6px; color:var(--muted);
  text-transform:uppercase; letter-spacing:1.4px; display:flex; align-items:center; gap:8px}
.section-t::before{content:''; width:14px; height:3px; border-radius:2px; background:var(--grad)}
/* ---------- кнопки ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--grad); color:#fff; border:none; border-radius:var(--rc);
  font:inherit; font-weight:800; font-size:15px; letter-spacing:.2px; padding:0 18px;
  min-height:var(--tap); cursor:pointer; box-shadow:0 8px 22px rgba(64,110,235,.32);
  transition:transform .12s, box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn.sec{background:var(--card2); color:var(--text); border:1px solid var(--border2); box-shadow:none}
.btn.ghost{background:none; color:var(--accent); border:none; min-height:42px; box-shadow:none}
.btn.danger{background:none; border:1px solid rgba(230,103,103,.5); color:var(--bad); box-shadow:none}
.btn.full{width:100%}
.btn.sm{min-height:38px; font-size:13.5px; padding:0 13px; border-radius:11px}
.btn:disabled{opacity:.4}
/* ---------- формы ---------- */
input[type=number],input[type=text],select{background:rgba(255,255,255,.9); border:1px solid var(--border2);
  color:var(--text); font:inherit; font-size:17px; font-weight:600; border-radius:12px; padding:10px 13px;
  min-height:var(--tap); width:100%}
input::placeholder{color:#6a6a64; font-weight:500}
input:focus,select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(57,135,229,.22)}
.wlab{font-size:12px; color:var(--text2); margin:10px 2px 5px; font-weight:700}
.stepper{display:flex; align-items:center; gap:8px; margin:12px 0}
.stepper button{background:var(--card2); border:1px solid var(--border2); color:var(--text);
  font-size:22px; font-weight:800; border-radius:var(--rc); min-width:56px; min-height:54px; cursor:pointer;
  transition:transform .1s}
.stepper button:active{transform:scale(.93)}
.stepper input{text-align:center; font-size:24px; font-weight:800; min-height:54px; font-variant-numeric:tabular-nums}
.stepper .lbl{width:64px; flex:none; font-size:12.5px; color:var(--text2); font-weight:700}
.seg{display:flex; background:rgba(12,74,84,.07); border:1px solid var(--border); border-radius:999px;
  padding:4px; gap:4px; margin:8px 0}
.seg button{flex:1; border:none; background:none; color:var(--text2); font:inherit; font-size:13.5px;
  font-weight:700; padding:9px 4px; border-radius:999px; cursor:pointer; min-height:42px; transition:all .2s}
.seg button.on{background:var(--grad); color:#fff; box-shadow:0 4px 14px rgba(64,110,235,.35)}
/* ---------- бейджи и статусы ---------- */
.badge{display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:999px;
  font-size:12.5px; font-weight:800; letter-spacing:.3px}
.badge::before{content:''; width:7px; height:7px; border-radius:50%; background:currentColor;
  box-shadow:0 0 8px currentColor}
.b-push{background:rgba(217,97,31,.13); color:#b64d14}
.b-pull{background:rgba(45,123,212,.13); color:#2461ad}
.b-legs{background:rgba(18,141,96,.13); color:#0e7350}
.b-rest{background:rgba(110,138,144,.14); color:var(--text2)}
.b-deload{background:rgba(173,116,7,.13); color:#8f6206}
html[data-theme=dark] .b-push{background:rgba(233,126,69,.14); color:#f0955f}
html[data-theme=dark] .b-pull{background:rgba(79,150,232,.14); color:#7fb3f0}
html[data-theme=dark] .b-legs{background:rgba(37,181,127,.14); color:#4bcd9b}
html[data-theme=dark] .b-deload{background:rgba(232,161,60,.14); color:#f2b53d}
.c-good{color:var(--good)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-mut{color:var(--muted)}
.num{text-align:right; font-variant-numeric:tabular-nums}
/* ---------- прогресс-бары ---------- */
.bar{height:10px; border-radius:8px; background:rgba(12,74,84,.09); overflow:hidden; margin-top:6px;
  border:1px solid rgba(12,74,84,.05)}
html[data-theme=dark] input[type=number],html[data-theme=dark] input[type=text],html[data-theme=dark] select,html[data-theme=dark] textarea{background:rgba(0,0,0,.28)}
html[data-theme=dark] .seg{background:rgba(0,0,0,.3)}
html[data-theme=dark] .bar{background:rgba(0,0,0,.32); border-color:rgba(255,255,255,.05)}
.bar i{display:block; height:100%; border-radius:8px; background:var(--grad);
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar i.over{background:linear-gradient(135deg,#eda100,#e07020)}
.bar i.good{background:linear-gradient(135deg,#1baf7a,#0f8f74)}
:root{--ringtrack:rgba(12,74,84,.09)}
html[data-theme=dark]{--ringtrack:rgba(255,255,255,.08)}
/* — разблокируемые темы (прокачка) — */
html[data-theme=neon]{
  --bg:#0b0f14; --card:rgba(183,242,77,.055); --card2:rgba(183,242,77,.1);
  --border:rgba(183,242,77,.12); --border2:rgba(183,242,77,.22);
  --text:#eef6e6; --text2:#b9c9a8; --muted:#84957a;
  --accent:#b7f24d; --accent2:#d3f24d; --accent-dim:#5a7a1e;
  --grad:linear-gradient(135deg,#9ad82f 0%,#d3f24d 100%);
  --push:#ff8a4d; --pull:#5aa9ff; --legs:#b7f24d;
  --good:#a5e63d; --warn:#ffb347; --bad:#ff6b6b;
  --shadow:0 14px 34px rgba(0,0,0,.5); --ringtrack:rgba(183,242,77,.1);
}
html[data-theme=gold]{
  --bg:#0f0d0a; --card:rgba(232,193,90,.06); --card2:rgba(232,193,90,.11);
  --border:rgba(232,193,90,.13); --border2:rgba(232,193,90,.24);
  --text:#f6f0e2; --text2:#cbbf9e; --muted:#96896c;
  --accent:#e8c15a; --accent2:#f2d488; --accent-dim:#8a6f2a;
  --grad:linear-gradient(135deg,#d4a940 0%,#f2d488 100%);
  --push:#e8845a; --pull:#7aa0d4; --legs:#a8c46a;
  --good:#b7cf6a; --warn:#e8a13c; --bad:#e57373;
  --shadow:0 14px 34px rgba(0,0,0,.55); --ringtrack:rgba(232,193,90,.1);
}
html[data-theme=neon] body, html[data-theme=gold] body{background:var(--bg)}
.ringrow{display:flex; align-items:center; gap:16px}
.ringrow .rside{flex:1; min-width:0}
@keyframes cfall{to{transform:translateY(108vh) rotate(720deg); opacity:.95}}
.chip.pop{animation:chippop .5s cubic-bezier(.3,1.7,.4,1)}
@keyframes chippop{0%{transform:scale(.55)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.minibar{margin-top:8px}
.minibar .kv{margin-top:0; font-size:12.5px}
.minibar .bar{height:7px; margin-top:3px}
.kv{display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px;
  color:var(--text2); margin-top:3px; gap:10px}
.kv b{color:var(--text); font-variant-numeric:tabular-nums}
/* ---------- плитки ---------- */
.hero{display:flex; gap:10px; margin:12px 0}
.tile{flex:1; background:var(--card); border-top:1px solid var(--glassbr);
  border:1px solid var(--border); border-radius:18px; padding:13px 12px; box-shadow:0 8px 24px rgba(10,84,94,.09)}
html[data-theme=dark] .tile{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.028)); box-shadow:0 8px 24px rgba(0,0,0,.22)}
.tile .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:800}
.tile .v{font-size:23px; font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums; letter-spacing:-.5px}
.hero .tile:first-child .v{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.tile .d{font-size:11.5px; margin-top:2px; font-weight:600}
/* ---------- таблицы ---------- */
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{color:var(--muted); font-weight:800; font-size:10.5px; text-transform:uppercase; letter-spacing:.8px;
  text-align:left; padding:7px 4px; border-bottom:1px solid var(--border2)}
td{padding:9px 4px; border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.plan-table td:first-child{color:var(--text2); font-weight:700; white-space:nowrap}
/* ---------- тренировка ---------- */
.exname{font-weight:800; font-size:16px; letter-spacing:-.2px}
.exmeta{font-size:12.5px; color:var(--text2); margin-top:2px}
.exhint{font-size:12.5px; color:var(--warn); margin-top:4px; font-weight:700}
.exhist{font-size:12px; color:var(--muted); margin-top:4px}
.exdone{opacity:.62}
.exdone .exname{color:var(--text2)}
.sets{display:flex; flex-wrap:wrap; gap:9px; margin-top:11px}
.chip{display:inline-flex; align-items:center; justify-content:center; min-width:68px;
  min-height:48px; padding:4px 12px; border-radius:13px; background:rgba(12,74,84,.06);
  border:1.5px dashed var(--border2); color:var(--muted); font-size:15px; font-weight:700;
  cursor:pointer; font-variant-numeric:tabular-nums; transition:all .15s}
.chip:active{transform:scale(.94)}
.chip.done{border-style:solid; border-color:rgba(11,147,164,.55);
  background:linear-gradient(135deg,rgba(10,162,180,.16),rgba(20,189,142,.13)); color:#0b5560}
html[data-theme=dark] .chip{background:rgba(0,0,0,.26)}
html[data-theme=dark] .chip.done{color:#e5feff; border-color:rgba(46,198,209,.55); background:linear-gradient(135deg,rgba(23,178,194,.22),rgba(34,207,157,.16))}
.chip.add{min-width:48px; border-style:solid}
.chip.ban{border-style:solid; border-color:rgba(212,85,85,.55); color:#b23b3b; background:rgba(212,85,85,.08)}
html[data-theme=dark] .chip.ban{color:#f0908f; border-color:rgba(230,103,103,.6); background:rgba(230,103,103,.1)}
.qbtn{background:var(--card2); border:1px solid var(--border2); color:var(--accent);
  border-radius:13px; min-width:46px; min-height:46px; font-size:17px; font-weight:800; cursor:pointer; flex:none}
.swapbtn{background:var(--card2); border:1px solid var(--border2); color:var(--text2);
  border-radius:13px; min-width:46px; min-height:46px; font-size:19px; cursor:pointer; flex:none}
.rpe{display:flex; gap:7px; margin-top:10px}
.rpe button{flex:1; min-height:42px; border-radius:11px; border:1px solid var(--border);
  background:rgba(12,74,84,.06); color:var(--text2); font:inherit; font-weight:800; cursor:pointer; transition:all .15s}
.rpe button.on{background:var(--grad); border-color:transparent; color:#fff; box-shadow:0 4px 14px rgba(64,110,235,.35)}
/* ---------- еда ---------- */
.mods{display:flex; flex-wrap:wrap; gap:9px}
.mod{background:var(--card); border-top:1px solid var(--glassbr);
  border:1px solid var(--border); border-radius:14px; padding:9px 13px;
  font-size:13.5px; cursor:pointer; min-height:48px; display:flex; flex-direction:column;
  justify-content:center; transition:transform .12s}
.mod:active{transform:scale(.95)}
.mod b{font-size:13.5px; font-weight:800}
.mod span{font-size:11.5px; color:var(--muted)}
.loglist .row{padding:9px 0; border-bottom:1px solid var(--border)}
.loglist .row:last-child{border-bottom:none}
.x{background:none; border:none; color:var(--muted); font-size:20px; min-width:44px; min-height:44px; cursor:pointer}
/* ---------- аналитика ---------- */
.insight{border-left:3px solid var(--accent); padding:12px 14px;
  background:var(--card);
  border-top:1px solid var(--border); border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  border-radius:4px 16px 16px 4px; margin:10px 0}
.insight.good{border-left-color:var(--good)} .insight.warn{border-left-color:var(--warn)} .insight.bad{border-left-color:var(--bad)}
.insight b{font-size:14.5px; font-weight:800}
.insight p{margin:5px 0 0; font-size:13.5px; color:var(--text2)}
.insight .btn{margin-top:10px}
/* ---------- техника ---------- */
.tech-steps{margin:6px 0 0; padding-left:22px}
.tech-steps li{margin:8px 0; font-size:14.5px; color:var(--text)}
.tech-err{display:flex; gap:9px; margin:9px 0; font-size:14px; color:var(--text2)}
.tech-err b{color:var(--bad); flex:none; font-size:14px}
.tech-note{background:rgba(11,147,164,.09); border:1px solid rgba(11,147,164,.32); color:#0b6a77;
  border-radius:12px; padding:9px 12px; font-size:13px; margin-top:8px}
html[data-theme=dark] .insight{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.026))}
html[data-theme=dark] .tech-note{background:rgba(46,198,209,.1); border-color:rgba(46,198,209,.32); color:#9fe4ea}
.varrow{display:flex; flex-direction:column; gap:1px; width:100%; text-align:left;
  background:rgba(255,255,255,.8); border:1.5px solid var(--border2); border-radius:14px;
  color:var(--text); font:inherit; padding:11px 13px; margin:7px 0; cursor:pointer; font-weight:700}
.varrow span{font-size:12px; color:var(--muted); font-weight:500}
.varrow.on{border-color:var(--accent); background:linear-gradient(135deg,rgba(10,162,180,.13),rgba(20,189,142,.10))}
html[data-theme=dark] .varrow{background:rgba(0,0,0,.24)}
html[data-theme=dark] .varrow.on{background:linear-gradient(135deg,rgba(23,178,194,.18),rgba(34,207,157,.13))}
html[data-theme=dark] .mod{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.026))}
html[data-theme=dark] .stepper button{background:var(--card2)}
html[data-theme=dark] .x, html[data-theme=dark] .qbtn, html[data-theme=dark] .swapbtn{}
.animbox{background:linear-gradient(180deg,rgba(10,162,180,.07),rgba(20,189,142,.05)); border:1px solid var(--border); border-radius:16px; margin:10px 0 4px; overflow:hidden}
.vidbox{position:relative; margin:10px 0 0; border-radius:16px; overflow:hidden; aspect-ratio:16/9; background:#0c1517; cursor:pointer; border:1px solid var(--border)}
.vidbox img{width:100%; height:100%; object-fit:cover; display:block; opacity:.88}
.vidbox iframe{width:100%; height:100%; border:0; display:block}
.vidbox.playing{cursor:default}
.vidplay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center}
.vidplay span{width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; background:rgba(10,162,180,.85); backdrop-filter:blur(6px); box-shadow:0 6px 24px rgba(0,0,0,.35); padding-left:5px}
.vidcap{position:absolute; left:10px; bottom:8px; color:#fff; font-size:12px; font-weight:600; text-shadow:0 1px 6px rgba(0,0,0,.7)}
.vidext{display:block; text-align:center; margin:6px 0 0; font-size:12.5px; font-weight:600; color:var(--accent); text-decoration:none}
.pl{display:inline-block; background:var(--accent2); color:#fff; border-radius:7px; padding:2.5px 8px; font-weight:800; font-size:12.5px; margin:2px 3px 2px 0}
.abone{stroke:var(--fig)} .ahead{fill:var(--fig)} .afar{opacity:.32}
.aprop{fill:rgba(12,74,84,.20); stroke:none}
.afloor{stroke:rgba(12,74,84,.30); stroke-width:2.5}
.aline{stroke:rgba(12,74,84,.34); fill:none; stroke-linecap:round}
.atool{fill:var(--accent)} .atool2{fill:var(--bg); stroke:none}
.aplate{fill:rgba(11,147,164,.22); stroke:var(--accent); stroke-width:2.5}
.acable{stroke:rgba(12,74,84,.55); stroke-width:2; fill:none}
.aband{stroke:var(--bad); stroke-width:3; fill:none}
.afill{fill:var(--fig); stroke:none} .afillm{fill:var(--accent2); stroke:none} .amusfill{fill:var(--accent2)}
.aoutl{stroke:var(--bg); stroke-width:1.1; paint-order:stroke}
.atrace{stroke:rgba(11,147,164,.45); stroke-width:2; stroke-dasharray:4 4; fill:none}
.atracehead{stroke:var(--accent); stroke-width:2.2; fill:none}
html[data-theme=dark] .atrace{stroke:rgba(46,198,209,.4)}
.mm-wrap{display:flex; gap:18px; justify-content:center; margin-top:4px}
.mm-side svg{width:104px; display:block}
.mbody{fill:var(--fig); opacity:.10}
.mz{fill:var(--fig); opacity:.13; stroke:var(--bg); stroke-width:.7}
.mz.on{fill:var(--accent2); opacity:.95}
html[data-theme=dark] .mbody{opacity:.16}
html[data-theme=dark] .mz{opacity:.2}
html[data-theme=dark] .aprop{fill:rgba(255,255,255,.16)}
html[data-theme=dark] .afloor{stroke:rgba(255,255,255,.25)}
html[data-theme=dark] .aline{stroke:rgba(255,255,255,.3)}
html[data-theme=dark] .acable{stroke:rgba(255,255,255,.45)}
html[data-theme=dark] .aplate{fill:rgba(46,198,209,.18)}
.animbox.photo{position:relative; background:#e8f2f2}
html[data-theme=dark] .animbox.photo{background:#0a0a0c}
.tphoto{width:100%; display:block; transition:opacity .45s ease}
.tphoto.over{position:absolute; left:0; top:0}
.ptag{position:absolute; left:10px; bottom:10px; background:rgba(10,10,14,.7); backdrop-filter:blur(6px);
  color:#fff; font-size:12px; font-weight:700; padding:5px 11px; border-radius:999px; pointer-events:none}
/* ---------- график ---------- */
svg.chart{width:100%; display:block; touch-action:pan-y}
.legend{display:flex; gap:16px; font-size:12.5px; color:var(--text2); margin-top:8px; font-weight:600}
.legend i{display:inline-block; width:16px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px}
.week-note{font-size:12px; color:var(--muted); margin-top:9px; line-height:1.5}
/* ---------- таймер ---------- */
#timerbar{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(86px + env(safe-area-inset-bottom)); width:min(92%,520px);
  background:rgba(255,255,255,.93); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(11,147,164,.4); border-radius:18px;
  padding:12px 16px 15px; display:none; align-items:center; gap:12px; z-index:60;
  box-shadow:0 14px 40px rgba(0,0,0,.55); overflow:hidden}
#timerbar.show{display:flex}
#timerbar .t{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; min-width:74px; letter-spacing:-.5px}
#timer-line{position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(12,74,84,.08)}
html[data-theme=dark] #timerbar{background:rgba(16,26,29,.92); border-color:rgba(46,198,209,.4)}
html[data-theme=dark] #timer-line{background:rgba(255,255,255,.06)}
#timer-line i{display:block; height:100%; background:var(--grad); transition:width .25s linear}
/* ---------- тост и модалка ---------- */
#toast{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(150px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.95); backdrop-filter:blur(14px); border:1px solid var(--border2);
  color:var(--text); padding:11px 20px; border-radius:999px; font-size:14px; font-weight:600;
  opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:70;
  max-width:90%; text-align:center; box-shadow:var(--shadow)}
#toast.show{opacity:1}
html[data-theme=dark] #toast{background:rgba(16,26,29,.94)}
.modal-wrap{position:fixed; inset:0; background:rgba(16,50,57,.4);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:none; z-index:80; align-items:flex-end; justify-content:center}
.modal-wrap.show{display:flex}
.modal{background:#f2f9f9; border:1px solid var(--border); border-bottom:none;
  border-radius:26px 26px 0 0; padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  width:100%; max-width:560px; max-height:88dvh; overflow-y:auto; box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.modal::before{content:''; display:block; width:38px; height:4px; border-radius:3px;
  background:rgba(12,74,84,.2); margin:4px auto 14px}
html[data-theme=dark] .modal-wrap{background:rgba(3,8,9,.66)}
html[data-theme=dark] .modal{background:#101a1d}
html[data-theme=dark] .modal::before{background:rgba(255,255,255,.18)}
.modal h2{margin:0 0 4px; font-size:18px; font-weight:800; letter-spacing:-.3px}
/* ---------- прочее ---------- */
.storage-warn{background:rgba(173,116,7,.09); border:1px solid rgba(173,116,7,.35); color:#8f6206;
  border-radius:14px; padding:11px 13px; font-size:13px; margin:10px 0; display:none}
.fade-list > *{animation:fin .28s cubic-bezier(.2,.8,.2,1) backwards}
.fade-list > *:nth-child(2){animation-delay:.03s}
.fade-list > *:nth-child(3){animation-delay:.06s}
.fade-list > *:nth-child(4){animation-delay:.09s}
.fade-list > *:nth-child(5){animation-delay:.12s}
@keyframes fin{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@keyframes cpulse{0%{opacity:.7; transform:scale(1)} 70%{opacity:0; transform:scale(2.6)} 100%{opacity:0; transform:scale(2.6)}}
.cpulse{transform-box:fill-box; transform-origin:center; animation:cpulse 2.2s ease-out infinite}
a{color:#6da7ec}
/* — дизайн-система 4.7 — */
.ic{display:inline-flex; width:20px; height:20px; vertical-align:-4px}
.ic svg{width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.ic svg [fill]:not([fill="none"]){stroke:none}
.qbtn .ic, .swapbtn .ic{vertical-align:-3px}
.rpe-row{display:flex; align-items:center; gap:10px; margin-top:10px}
.rpe-lab{font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:5px; flex:none}
.hbtn{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--border2); background:var(--card);
  color:var(--muted); font-size:11.5px; font-weight:800; line-height:1; cursor:pointer; padding:0}
.rpe-row .rpe{display:flex; gap:5px; margin:0}
.rpe-row .rpe button{min-height:32px; padding:0; flex:1; font-size:13.5px}
.coach{display:flex; gap:9px; align-items:flex-start; margin-top:9px; padding:9px 11px; border-radius:12px;
  background:var(--accent-soft, rgba(11,147,164,.07)); border:1px solid rgba(11,147,164,.18); font-size:13px; line-height:1.45}
.coach .ic{flex:none; color:var(--accent2); margin-top:1px}
.coach b{color:var(--text)}
html[data-theme=dark] .coach{background:rgba(46,198,209,.08); border-color:rgba(46,198,209,.22)}
/* сториз */
#stories{display:flex; gap:12px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none}
#stories::-webkit-scrollbar{display:none}
.sto{flex:none; width:64px; background:none; border:none; padding:0; cursor:pointer; text-align:center}

.sto.seen .ring{background:var(--border2)}
.sto .inn{width:100%; height:100%; border-radius:50%; background:var(--card); display:grid; place-items:center; font-size:22px; border:2.5px solid var(--bg)}
.sto .lb{font-size:10px; color:var(--muted); font-weight:700; margin-top:4px; line-height:1.15; height:23px; overflow:hidden}
#story-view{position:fixed; inset:0; z-index:130; background:#0d1517; display:none; flex-direction:column; color:#eef6f6}
#story-view.show{display:flex}
#story-bars{display:flex; gap:5px; padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
#story-bars i{flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.25); overflow:hidden; display:block; position:relative}
#story-bars i b{position:absolute; inset:0; width:0; background:#fff; border-radius:2px}
#story-body{flex:1; display:flex; flex-direction:column; justify-content:center; padding:26px 26px 40px; position:relative}

#story-body h2{font-size:26px; line-height:1.25; margin:0 0 14px; letter-spacing:-.3px}
#story-body .stxt{font-size:16.5px; line-height:1.6; color:rgba(238,246,246,.85)}
#story-body .ssrc{margin-top:18px; font-size:13px}

#story-x{position:absolute; top:calc(16px + env(safe-area-inset-top)); right:14px; width:38px; height:38px; border-radius:50%;

.stat-big{font-size:38px; font-weight:800; letter-spacing:-1px; font-variant-numeric:tabular-nums}
.srow{display:flex; gap:14px; margin-top:16px}

<script>
"use strict";
/* ============ 1. ПРОГРАММА (данные) ============ */
/* Профиль: у Егора — исходная программа (миграция), у новых — анкета первого запуска */
const EGOR = {
  name:'Егор', sex:'m', age:31, height:180, startWeight:127,
  w1:'2026-08-24', legacyWeek0:true, weeks:12, place:'gym',
  startsText:{bench:'50 кг', leg:'120 кг', thrust:'90–100 кг'},
  targets:{0:127.0,1:125.1,2:124.1,3:123.1,4:122.2,5:121.3,6:120.5,7:119.9,8:119.0,9:118.2,10:117.5,11:116.7,12:116.0},
};
let PROF = null;
let W1 = null, PROG_END = null, TARGETS = null, CHECKPOINTS = null, SESSIONS = null;
const WEEKS = () => (PROF && PROF.weeks) || 12;
const deloadWeeks = () => { const n = WEEKS(); return n>=16 ? [7,13] : n>=10 ? [7] : []; };
const STEP_BASE = {low:[6000,7500,9000], mid:[7000,8500,10000], high:[8000,10000,12000]};
const STEP_GOAL = w => {
  const b = STEP_BASE[(PROF && PROF.activity) || 'mid'] || STEP_BASE.mid;
  return w<=2 ? b[0] : (w <= (WEEKS()>=16?9:WEEKS()>=10?7:4) ? b[1] : b[2]);
};
/* Расчёт плана по анкете: Миффлин—Сан-Жеор + правила программы */
const ACT_MULT = {low:1.35, mid:1.45, high:1.6};
function calcPlan(p){
  const bmr = 10*p.startWeight + 6.25*p.height - 5*p.age + (p.sex==='m'?5:-161);
  const bmi = p.startWeight/Math.pow(p.height/100,2);
  const defPct = bmi>=30?0.22 : bmi>=25?0.18 : 0.15;
  const mult = ACT_MULT[p.activity||'mid'] || 1.45;
  const kcal = Math.max(p.sex==='m'?1800:1500, Math.round(bmr*mult*(1-defPct)/50)*50);
  const prot = p.sex==='f'
    ? Math.min(160, Math.max(90, Math.round(p.startWeight*1.25/5)*5))
    : Math.min(200, Math.max(110, Math.round(p.startWeight*1.4/5)*5));
  const rate = bmi>=30?0.0075 : bmi>=25?0.0055 : 0.004;
  const weeks = p.weeks || 12;
  const targets = {0: Math.round(p.startWeight*10)/10};
  for (let w=1; w<=weeks; w++){
    const prev = targets[w-1];
    targets[w] = Math.round((prev - prev*rate*(w===1?2:1))*10)/10;
  }
  return {kcal, prot, targets, maint: Math.round(bmr*mult/50)*50};
}
function checkpointsFor(p){
  const weeks = p.weeks || 12;
  const pts = []; for (let w=4; w<=weeks; w+=4) pts.push(w);
  return pts.map(w => ({
    week:w,
    wmin: Math.round((p.targets[w]-0.6)*10)/10,
    wmax: Math.round((p.targets[w]+(w===weeks?2:1.2))*10)/10,
  }));
}

/* ---- подстройка программы: травмы, пол, вес ---- */
const INJ_MAP = {
 'Выпады':['knee'],'Выпады с гантелями':['knee'],'Болгарские сплит-приседы':['knee'],
 'Зашагивания на тумбу':['knee'],'Зашагивания на низкую ступеньку':['knee'],'Гакк-машина':['knee'],'Присед в Смите':['knee'],
 'Гоблет-присед':['knee'],'Гоблет-присед с гантелью':['knee'],'Плие-присед с гантелью':['knee'],
 'Разгибания ног':['knee'],'Приседания с паузой':['knee'],
 'Румынская тяга со штангой':['back'],'Румынская тяга с гантелями':['back'],
 'Наклоны с резинкой (доброе утро)':['back'],'Гиперэкстензия с весом':['back'],
 'Тяга штанги в наклоне':['back'],'Тяга Т-грифа':['back'],'Тяга двух гантелей в наклоне':['back'],
 'Жим штанги сидя':['shoulder'],'Жим гантелей сидя':['shoulder'],'Жим гантелей сидя/стоя':['shoulder'],
 'Жим в тренажёре (плечи)':['shoulder'],'Жим Арнольда':['shoulder'],'Брусья / гравитрон':['shoulder'],
 'Разгибания из-за головы на блоке':['shoulder'],'Отжимания с ногами на возвышении':['shoulder'],
 'Пиковые отжимания («домиком»)':['shoulder'],
};
const EASY_SET = new Set(['Отжимания от опоры','Отжимания с колен','Отжимания от стены','Австралийские подтягивания (стол)','Присед на стул (ограниченная глубина)','Подъёмы бутылок/гантелей в стороны','Отжимания узким хватом от опоры','Тяга бутылок в наклоне','Зашагивания на низкую ступеньку']);
const HARD_SET = new Set(['Отжимания от пола','Отжимания с ногами на возвышении','Подтягивания','Пиковые отжимания («домиком»)']);
function tuneProgram(ex, alts){
  const inj = PROF.inj || {};
  const bmi = PROF.startWeight/Math.pow(PROF.height/100,2);
  const easyMode = PROF.sex==='f' || bmi>=33;
  for (const t in ex){
    const nx = [], na = [];
    ex[t].forEach((base, i) => {
      const altList = (alts[t][i] && alts[t][i].a) || [];
      let cands = [{n:base.n, inc:base.inc, bw:base.bw||0}, ...altList.map(a=>({n:a.n, inc:a.inc, bw:a.bw||0}))];
      cands = cands.filter(c => !(INJ_MAP[c.n]||[]).some(k=>inj[k]));
      if (!cands.length) return;
      if (easyMode && HARD_SET.has(cands[0].n)){
        const ei_ = cands.findIndex(c=>EASY_SET.has(c.n));
        if (ei_ > 0) cands.unshift(cands.splice(ei_,1)[0]);
        else if (!cands.some(c=>!HARD_SET.has(c.n))) return;
      }
      const c = cands[0];
      const entry = {...base, n:c.n, inc:c.inc!=null?c.inc:base.inc, bw:c.bw?1:0,
        sub: cands[1] ? cands[1].n : '—'};
      if (c.n !== base.n) entry.start = entry.bw ? 'вес тела' : 'подбор';
      nx.push(entry);
      na.push({m:(alts[t][i]&&alts[t][i].m)||'', a:cands.slice(1)});
    });
    ex[t] = nx; alts[t] = na;
  }
  if ((PROF.level||'some') === 'new'){
    for (const t in ex) ex[t].forEach(e => {
      for (const ph of ['p1','p2'])
        if (e[ph] && e[ph][0] > 2) e[ph] = [e[ph][0]-1, e[ph][1], e[ph][2], e[ph][3]];
    });
  }
}
function addFemaleSlots(ex, alts){
  if (PROF.sex !== 'f') return;
  const gym = PROF.place !== 'home';
  const slotEx = gym
    ? {n:'Отведения в тренажёре', rest:75, inc:5, bw:0, start:'подбор', sub:'Махи в кроссовере назад',
       p0:[2,'15–20',15,20], p1:[3,'15–20',15,20], p2:[3,'15–20',15,20]}
    : {n:'Ягодичные махи на четвереньках', rest:60, inc:0, bw:1, start:'вес тела', sub:'Плие-присед с гантелью',
       p0:[2,'12–18',12,18], p1:[3,'15–20',15,20], p2:[3,'15–20',15,20]};
  const slotAlt = gym
    ? {m:'Ягодицы (изоляция)', a:[{n:'Махи в кроссовере назад',inc:2.5},{n:'Ягодичные махи на четвереньках',inc:0,bw:1},{n:'Отведение ноги в кроссовере в сторону',inc:2.5},{n:'Разведения ног в тренажёре',inc:5}]}
    : {m:'Ягодицы (изоляция)', a:[{n:'Плие-присед с гантелью',inc:2},{n:'Пожарный гидрант',inc:0,bw:1},{n:'Ракушка с резинкой',inc:0,bw:1},{n:'Мост с резинкой на коленях',inc:0,bw:1}]};
  const t = ex.Legs ? 'Legs' : 'B';
  const pos = Math.min(2, ex[t].length);
  ex[t].splice(pos, 0, {...slotEx});
  alts[t].splice(pos, 0, {m:slotAlt.m, a:slotAlt.a.map(a=>({...a}))});
}
/* ---- каталог всех упражнений: замена на что угодно ---- */
const CATALOG_EXTRA = [
 {n:'Кроссовер (сведения на блоке)', m:'Грудь', g:'Push', inc:2.5},
 {n:'Бабочка (пек-дек)', m:'Грудь', g:'Push', inc:5},
 {n:'Пуловер с гантелью', m:'Грудь + широчайшие', g:'Push', inc:2},
 {n:'Подъёмы перед собой (гантели)', m:'Передняя дельта', g:'Push', inc:2},
 {n:'Отжимания на брусьях', m:'Грудь + трицепс', g:'Push', inc:5, bw:1},
 {n:'Разгибания на блоке (прямая рукоять)', m:'Трицепс', g:'Push', inc:2.5},
 {n:'Кик-бэк с гантелью', m:'Трицепс', g:'Push', inc:1},
 {n:'Жим Смита сидя (плечи)', m:'Плечи', g:'Push', inc:2.5},
 {n:'Тяга верхнего блока узким хватом', m:'Широчайшие', g:'Pull', inc:5},
 {n:'Пуловер на верхнем блоке', m:'Широчайшие', g:'Pull', inc:2.5},
 {n:'Тяга гири в наклоне', m:'Середина спины', g:'Pull', inc:4},
 {n:'Шраги с гантелями', m:'Трапеции', g:'Pull', inc:2},
 {n:'Шраги со штангой', m:'Трапеции', g:'Pull', inc:5},
 {n:'Гиперэкстензия', m:'Поясница + ягодицы', g:'Pull', inc:2.5, bw:1},
 {n:'Сгибания Зоттмана', m:'Бицепс + предплечья', g:'Pull', inc:1},
 {n:'Концентрированные сгибания', m:'Бицепс', g:'Pull', inc:1},
 {n:'Приседания со штангой', m:'Квадрицепс + ягодицы', g:'Legs', inc:2.5},
 {n:'Фронтальный присед', m:'Квадрицепс', g:'Legs', inc:2.5},
 {n:'Становая тяга (классика)', m:'Вся задняя цепь', g:'Legs', inc:5},
 {n:'Сумо-тяга', m:'Ягодицы + бёдра', g:'Legs', inc:5},
 {n:'Сведения ног в тренажёре', m:'Приводящие', g:'Legs', inc:5},
 {n:'Разведения ног в тренажёре', m:'Средняя ягодичная', g:'Legs', inc:5},
 {n:'Отведение ноги на блоке', m:'Ягодицы', g:'Legs', inc:2.5},
 {n:'Ходьба выпадами', m:'Квадрицепс + ягодицы', g:'Legs', inc:2},
 {n:'Прыжки на тумбу', m:'Взрывная сила ног', g:'Legs', inc:0, bw:1},
 {n:'Планка', m:'Пресс (статика)', g:'Legs', inc:0, bw:1},
 {n:'Ролик для пресса', m:'Пресс', g:'Legs', inc:0, bw:1},
 {n:'Русские скручивания', m:'Косые мышцы', g:'Legs', inc:1},
 {n:'Подъём ног в висе', m:'Пресс', g:'Legs', inc:0, bw:1},
 {n:'Жим узким хватом в Смите', m:'Трицепс + грудь', g:'Push', inc:2.5},
 {n:'Отжимания от скамьи сзади', m:'Трицепс', g:'Push', inc:2.5, bw:1},
 {n:'Разгибание одной рукой из-за головы', m:'Трицепс', g:'Push', inc:1},
 {n:'Подъёмы в стороны сидя', m:'Средняя дельта', g:'Push', inc:2},
 {n:'Тяга гантелей с упором грудью', m:'Середина спины', g:'Pull', inc:2},
 {n:'Сгибания на скамье Скотта', m:'Бицепс', g:'Pull', inc:2.5},
 {n:'Сгибания на наклонной скамье', m:'Бицепс', g:'Pull', inc:2},
 {n:'Прогулка фермера', m:'Предплечья + кор', g:'Pull', inc:4},

 {n:'Сплит-присед в Смите', m:'Квадрицепс + ягодицы', g:'Legs', inc:2.5},

 {n:'Доброе утро со штангой', m:'Задняя цепь', g:'Legs', inc:2.5},
 {n:'Икры стоя с гантелью одной ногой', m:'Икры', g:'Legs', inc:2},
 {n:'Ракушка с резинкой', m:'Средняя ягодичная', g:'Legs', inc:0, bw:1},
 {n:'Пожарный гидрант', m:'Ягодицы', g:'Legs', inc:0, bw:1},
 {n:'Мост с резинкой на коленях', m:'Ягодицы', g:'Legs', inc:0, bw:1},
 {n:'Отведение ноги лёжа на боку', m:'Средняя ягодичная', g:'Legs', inc:0, bw:1},

 {n:'Дэд-баг', m:'Кор', g:'Legs', inc:0, bw:1},
 {n:'Скалолаз', m:'Кор + кардио', g:'Legs', inc:0, bw:1},
 {n:'Паллоф-пресс с резинкой', m:'Кор (антиротация)', g:'Legs', inc:0, bw:1},
];
let CATALOG = null;
function catalog(){
  if (CATALOG) return CATALOG;
  const seen = {}, out = [];
  const put = (n, m, g, inc, bw) => { const k = n.toLowerCase(); if (seen[k]) return; seen[k] = 1; out.push({n, m: m||'', g, inc: inc==null?2.5:inc, bw: bw?1:0}); };
  for (const g of ['Push','Pull','Legs']){
    GYM_EXDB[g].forEach((e,i) => put(e.n, (GYM_ALTS[g][i]||{}).m, g, e.inc, e.bw));
    GYM_ALTS[g].forEach(sl => sl.a.forEach(a => put(a.n, sl.m, g, a.inc, a.bw)));
    (HOME_SLOTS[g]||[]).forEach(sl => sl.v.forEach(v => put(v.n, sl.m.replace(' · якорь',''), g, v.inc, v.bw)));
  }
  CATALOG_EXTRA.forEach(e => put(e.n, e.m, e.g, e.inc, e.bw));
  out.sort((a,b)=>a.n.localeCompare(b.n,'ru'));
  return CATALOG = out;
}
function buildProgram(){
  W1 = fromKey(PROF.w1);
  PROG_END = new Date(W1.getTime() + (WEEKS()*7-1)*864e5);
  TARGETS = PROF.targets;
  CHECKPOINTS = checkpointsFor(PROF).map(c => ({...c, date: key(new Date(W1.getTime() + (c.week*7-1)*864e5))}));
  const stx = PROF.startsText || {};
  if (PROF.split === 'fb'){
    const fb = PROF.place === 'home' ? buildHomeFB(PROF.equip || {}, stx) : buildFbGym(stx);
    EXDB = fb.ex; ALTS = fb.alts;
  } else if (PROF.place === 'home'){
    const hb = buildHomeDB(PROF.equip || {}, stx);
    EXDB = hb.ex; ALTS = hb.alts;
  } else {
    EXDB = JSON.parse(JSON.stringify(GYM_EXDB));

function musSeg2(A, B, t0, t1, off){

  const P = t => [A[0]+dx*t + nx*off, A[1]+dy*t + ny*off];
  return [P(t0), P(t1)];
}
function musHighlight2(anim, F){

      delts:    [[...musSeg2(F.sh, F.a1.el, 0, .3, 0), 10]],
      traps:    [[...musSeg2(F.pelvis, F.neck, .82, 1, -6), 8]],
      lats:     [[...musSeg2(F.pelvis, F.neck, .35, .8, -7), 8]],
      erectors: [[...musSeg2(F.pelvis, F.neck, .05, .45, -6), 7]],
      abs:      [[...musSeg2(F.pelvis, F.neck, .15, .6, 7), 8]],

function tracePath(anim){

  const pts = [];
  for (let i = 0; i <= 20; i++){
    const F = fk2(anim, lerpPose2(anim.frames[0], anim.frames[1] || anim.frames[0], i/20));
    pts.push(pick(F));
  }
  const span = Math.hypot(pts[20][0]-pts[0][0], pts[20][1]-pts[0][1]);
  if (span < 14) return '';
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (const p of pts.slice(1)) d += `L${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  const A = pts[13], B = pts[15];
  const ang = Math.atan2(B[1]-A[1], B[0]-A[0]);
  const tip = pts[15], L = 7;
  const w1 = [tip[0]-L*Math.cos(ang-0.5), tip[1]-L*Math.sin(ang-0.5)];

}
function renderFrame2(anim, pose, tGlob){
  const F = fk2(anim, pose);
  let h = drawProps2(anim.props, pose, 0, F);
  h += tracePath(anim);
  const tags = anim.mus ? (Array.isArray(anim.mus) ? anim.mus : [anim.mus]) : [];
  const has = t => tags.includes(t);
  const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const legsDiffer = dist(F.l1.an, F.l2.an) > 12 || dist(F.l1.kn, F.l2.kn) > 12;
  const armsDiffer = dist(F.a1.wr, F.a2.wr) > 11 || dist(F.a1.el, F.a2.el) > 11;
  const thighMus = has('quad') || has('ham') || has('adductor');
  const drawLeg = (L, far) => {

    let g = far ? '<g class="afar">' : '';

    g += polySeg(L.kn, L.an, 5.2*k, 3.6*k, has('calf') && !far ? 'afillm' : 'afill');
    g += polySeg(L.an, L.toe, 3.2*k, 2.6*k, 'afill');

      g += `<circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="8" class="afillm"/>`;
    }
    if (far) g += '</g>';
    return g;
  };
  const drawArm = (A, far) => {
    const k = far ? .88 : 1;
    let g = far ? '<g class="afar">' : '';
    g += polySeg(F.sh, A.el, 5.4*k, 4.2*k, ((has('biceps')||has('triceps')) && !far ? 'afillm' : 'afill') + ' aoutl');
    g += polySeg(A.el, A.wr, 4*k, 3*k, (has('forearm') && !far ? 'afillm' : 'afill') + ' aoutl');
    if (has('delts') && !far)
      g += `<circle cx="${F.sh[0].toFixed(1)}" cy="${F.sh[1].toFixed(1)}" r="7.5" class="afillm"/>`;
    if (far) g += '</g>';
    return g;
  };
  /* торс с формой: таз → талия → грудь → плечи */
  const axis = t => [F.pelvis[0] + (F.neck[0]-F.pelvis[0])*t, F.pelvis[1] + (F.neck[1]-F.pelvis[1])*t];
  const halfW = t => t < .45 ? 10.5 + (8-10.5)*(t/.45)
                   : t < .8  ? 8 + (11.5-8)*((t-.45)/.35)
                   : 11.5 + (10-11.5)*((t-.8)/.2);
  const strip = (t0, t1, cls) => polySeg(axis(t0), axis(t1), halfW(t0), halfW(t1), cls);
  if (legsDiffer) h += drawLeg(F.l2, true);
  if (armsDiffer) h += drawArm(F.a2, true);
  h += strip(0, .45, 'afill') + strip(.45, .8, 'afill') + strip(.8, 1, 'afill');
  if (has('chest'))    h += strip(.55, .97, 'afillm');
  if (has('lats'))     h += strip(.3, .8, 'afillm');
  if (has('abs') || has('core')) h += strip(.15, .6, 'afillm');
  if (has('erectors')) h += strip(.03, .45, 'afillm');
  if (has('traps'))    h += strip(.8, 1, 'afillm');
  h += polySeg(F.neck, [F.neck[0]+(F.headC[0]-F.neck[0])*.5, F.neck[1]+(F.headC[1]-F.neck[1])*.5], 4.2, 3.6, 'afill');
  h += `<circle cx="${F.headC[0].toFixed(1)}" cy="${F.headC[1].toFixed(1)}" r="${BODY.head}" class="ahead"/>`;
  h += drawLeg(F.l1, false);
  h += drawArm(F.a1, false);

}

function playAnim(anim, svgId){
  stopAnim();

  const t0 = performance.now();
  const dur = anim.dur || 1500;
  const loop = (now) => {
    if (!el.isConnected){ stopAnim(); return; }
    const t = now - t0;
    let ph = (t % (dur*2)) / dur;
    if (ph > 1) ph = 2 - ph;
    const e = ph < .5 ? 2*ph*ph : 1 - Math.pow(-2*ph + 2, 2)/2;

  };

гибания «молот»","Alternate_Hammer_Curl","biceps","forearm",0,"d","s","Стоя, гантели вдоль тела нейтральным хватом.;Согни одну руку к плечу, не разворачивая кисть.;Опусти подконтрольно, повтори другой рукой."],["Косые скручивания к пяткам","Alternate_Heel_Touchers","abs","",0,"w","s","Ляг, колени согнуты, руки вдоль тела.;Приподними лопатки и тянись рукой к одноимённой пятке.;Вернись и повтори в другую сторону."],["Попеременные сгибания на наклонной скамье","Alternate_Incline_Dumbbell_Curl","biceps","forearm",0,"d","s","Сядь на наклонную скамью, руки с гантелями свисают.;Согни одну руку, супинируя кисть, плечо неподвижно.;Медленно опусти, повтори другой рукой."],["Диагональные прыжки на одной ноге","Alternate_Leg_Diagonal_Bound","quad","glute,adductor,calf,ham",0,"n","p","Встань на одну ногу.;Прыгай по диагонали вперёд-вбок, мягко приземляясь на другую ногу.;Держи колено над стопой, корпус собран."],["Попеременный жим на блоке","Alternating_Cable_Shoulder_Press","delts","triceps",0,"c","s","Встань между стойками кроссовера, рукояти у плеч.;Выжимай одну рукоять вверх до выпрямления руки.;Опусти подконтрольно, повтори другой рукой."],["Попеременные подъёмы гантелей перед собой/в сторону","Alternating_Deltoid_Raise","delts","",0,"d","s","Стоя, гантели у бёдер.;Подними одну руку перед собой до уровня плеч, опусти.;Вторую подними через сторону; чередуй направления без рывков."],["Попеременный жим гирь лёжа на полу","Alternating_Floor_Press","chest","abs,delts,triceps",0,"k","s","Ляг на пол, гири у плеч.;Выжми одну гирю вверх до выпрямления руки.;Опусти локоть до пола и повтори другой рукой."],["Попеременный подъём гири на грудь","Alternating_Hang_Clean","ham","biceps,calf,forearm,glute,erectors,traps",1,"k","s","Гиря между ног, спина прямая.;Взрывным разгибанием ног и таза подними гирю на плечо.;Опусти и повтори другой рукой."],["Попеременный жим гирь стоя","Alternating_Kettlebell_Press","delts","triceps",1,"k","s","Две гири на груди.;Выжми одну гирю вверх, не отклоняя корпус.;Опусти на грудь, выжми другую."],["Попеременная тяга гирь в наклоне","Alternating_Kettlebell_Row","lats","biceps,lats",1,"k","s","Наклонись с прямой спиной, гири в руках.;Тяни одну гирю к поясу, сводя лопатку.;Опусти и тяни другую."],["Тяга ренегата (попеременная)","Alternating_Renegade_Row","lats","abs,biceps,chest,lats,triceps",2,"k","s","Прими упор лёжа на гирях/гантелях.;Не разворачивая таз, тяни один снаряд к поясу.;Поставь и тяни другой; корпус жёсткий."],["Круги стопой","Ankle_Circles","calf","",0,"n","t","Сидя или стоя, приподними стопу.;Вращай стопой по кругу 10-15 раз.;Смени направление и ногу."],["Растяжка ягодиц «лодыжка на колене»","Ankle_On_The_Knee","glute","",0,"n","t","Сидя или лёжа, положи лодыжку на колено другой ноги.;Мягко потяни опорное бедро к груди.;Держи 20-30 секунд, смени сторону."],["Передняя большеберцовая на ролле","Anterior_Tibialis-SMR","calf","",1,"x","t","Встань на четвереньки, ролл под передней частью голени.;Прокатывай голень от колена до стопы.;Задержись на жёстких точках."],["Жим штанги из-за головы сидя (антигравитационный)","Anti-Gravity_Press","delts","lats,traps,triceps",0,"b","s","Сядь, штанга за головой на уровне плеч.;Выжми штангу вверх до выпрямления рук.;Опусти подконтрольно, не ударяя шею."],["Круги руками","Arm_Circles","delts","traps",0,"n","t","Встань прямо, руки в стороны.;Делай круги руками, постепенно увеличивая амплитуду.;Смени направление."],["Жим Арнольда","Arnold_Dumbbell_Press","delts","triceps",1,"d","s","Сядь, гантели перед плечами, ладони к себе.;Выжимая вверх, разверни ладони вперёд.;Опусти с обратным разворотом."],["«Вокруг света» с гантелями","Around_The_Worlds","chest","delts",1,"d","s","Ляг на скамью, гантели у бёдер ладонями вверх.;По широкой дуге через стороны переведи гантели за голову.;Вернись той же дугой, локти чуть согнуты."],["Подъём атласного камня на тумбу (тренировочный)","Atlas_Stone_Trainer","erectors","biceps,forearm,glute,ham,quad",1,"x","g","Обхвати камень/сэндбэг у пола.;Разги и бицепса бедра."],["Протяжка резины между ног (пул-тру)","Band_Good_Morning_Pull_Through","ham","glute,erectors",0,"r","l","Встань спиной к точке крепления, резина между ног.;Наклонись, отводя таз, затем мощно разогнись вперёд.;Сжимай ягодицы в верхней точке."],["Приведение бедра с резиной","Band_Hip_Adductions","adductor","",0,"r","s","Закрепи резину сбоку, петля на ближней лодыжке.;Приводи ногу внутрь через сопротивление.;Медленно вернись, корпус неподвижен."],["Растягивание резины перед собой","Band_Pull_Apart","delts","lats,traps",0,"r","s","Держи резину перед собой на прямых руках на ширине плеч.;Разведи руки в стороны до касания резиной груди.;Своди лопатки, вернись медленно."],["Французский жим с резиной","Band_Skull_Crusher","triceps","",0,"r","s","Закрепи резину сзади внизу, локти подняты у головы.;Разгибай предплечья вперёд-вверх.;Локти неподвижны, вернись подконтрольно."],["Выкат со штангой стоя","Barbell_Ab_Rollout","abs","erectors,delts",1,"b","s","Штанга с блинами на полу, наклонись и возьмись за гриф.;Кати штангу вперёд, вытягиваясь в линию.;Вернись усилием пресса, спина без прогиба."],["Выкат со штангой с колен","Barbell_Ab_Rollout_-_On_Knees","abs","erectors,delts",2,"b","s","Встань на колени, штанга перед собой.;Кати гриф вперёд до вытяжения, корпус жёсткий.;Вернись усилием пресса и широчайших."],["Жим штанги лёжа средним хватом","Barbell_Bench_Press_-_Medium_Grip","chest","delts,triceps",0,"b","s","Ляг, лопатки сведены, хват чуть шире плеч.;Опусти гриф к низу груди, локти ~45°.;Мощно выжми вверх, не отрывая таз."],["Сгибания рук со штангой","Barbell_Curl","biceps","forearm",0,"b","s","Стоя, хват снизу на ширине плеч.;Согни руки к плечам, локти прижаты.;Опусти подконтрольно, не раскачивайся."],["Сгибания со штангой лёжа грудью на наклонной скамье","Barbell_Curls_Lying_Against_An_Incline","biceps","",0,"b","s","Ляг грудью на наклонную скамью, руки свисают со штангой.;Согни руки к плечам, плечи неподвижны.;Медленно выпрями."],["Становая тяга со штангой","Barbell_Deadlift","erectors","calf,forearm,glute,ham,lats,quad,traps",1,"b","s","Гриф над серединой стопы, хват на ширине плеч.;С прямой спиной разгибай ноги и таз, гриф скользит по ногам.;Встань полностью, опусти подконтрольно."],["Глубокий присед со штангой","Barbell_Full_Squat","quad","calf,glute,ham,erectors",1,"b","s","Штанга на трапециях, стопы чуть шире плеч.;Присядь ниже параллели, колени по носкам.;Встань, не заваливая корпус вперёд."],["Ягодичный мост со штангой","Barbell_Glute_Bridge","glute","calf,ham",1,"b","l","Ляг на пол, штанга на тазу, колени согнуты.;Подними таз до прямой линии колени-плечи.;Сожми ягодицы вверху, опусти медленно."],["Жим «гильотина»","Barbell_Guillotine_Bench_Press","chest","delts,triceps",1,"b","s","Ляг, хват шире плеч.;Опусти гриф к шее/верху груди, локти в стороны.;Выжми вверх; вес умеренный, движение подконтрольное."],["Гакк-приседания со штангой (за спиной)","Barbell_Hack_Squat","quad","calf,forearm,ham",1,"b","s","Штанга за спиной в опущенных руках.;Присядь, держа корпус вертикально, гриф скользит вдоль ног.;Встань, разгибая ноги."],["Ягодичный мост со штангой на скамье (хип-траст)","Barbell_Hip_Thrust","glute","calf,ham",1,"b","l","Лопатки на скамье, штанга на тазу.;Подними таз до линии колени-плечи, подбородок к груди.;Пауза вверху, сжав ягодицы, опусти."],["Жим штанги на наклонной скамье средним хватом","Barbell_Incline_Bench_Press_-_Medium_Grip","chest","delts,triceps",0,"b","s","Ляг на скамью 30-45°, хват чуть шире плеч.;Опусти гриф к верху груди.;Выжми вверх над ключицами."],["Подъём плеч со штангой на наклонной скамье","Barbell_Incline_Shoulder_Raise","delts","chest",0,"b","s","Ляг спиной на наклонную скамью, штанга на прямых руках.;Не сгибая локти, подними плечи вперёд-вверх (протракция).;Вернись подконтрольно."],["Выпады со штангой","Barbell_Lunge","quad","calf,glute,ham",1,"b","s","Штанга на трапециях.;Шагни вперёд и опустись до угла 90° в обоих коленях.;Оттолкнись передней ногой и вернись."],["Тяга штанги к г function muscleMap(tags){
  tags = (tags || []).flatMap(t => MZ_ALIAS[t] || [t]);
  const side = (nm, label) => {
    let z = '';
    for (const id in MZONES[nm])
      z += `<path d="${MZONES[nm][id]}" class="mz ${tags.includes(id)?'on':''}"/>`;
    return `<div class="mm-side"><svg viewBox="0 0 90 196">${MBODY}${z}</svg><div class="tiny" style="text-align:center;margin-top:2px">${label}</div></div>`;
  };
  const names = [...new Set(tags.map(t => MUS_RU[t]).filter(Boolean))];
  return `<div class="mm-wrap">${side('front','спереди')}${side('back','сзади')}</div>
    <div class="small" style="text-align:center;margin-top:6px"><b>Работают:</b> ${names.join(' · ')}</div>`;
}

'Зашагивания на низкую ступеньку':{s:['Ступенька 15–25 см, вся стопа на опоре.','Поднимайся усилием передней ноги, не отталкиваясь задней.','Вверху выпрямись полностью, спускайся медленно той же ногой.','Все повторы одной ногой, потом смена.'],e:['Толчок задней ногой — работает не та нога.','Колено заваливается внутрь.','Спуск «падением».']},
'Бабочка (пек-дек)':{s:['Сиденье так, чтобы рукояти были на уровне середины груди, локти чуть ниже плеч.','Спина и затылок прижаты к спинке, лопатки сведены.','Своди рукояти по дуге до лёгкого касания, грудь в пике сжимай 1 секунду.','Разводи медленно до комфортной растяжки, не дальше линии плеч.'],e:['Развод слишком глубоко назад — риск для плеча.','Плечи поднимаются к ушам.','Рывок в начале движения.']},

'Пуловер с гантелью':{s:['Ляг поперёк или вдоль скамьи, гантель обеими руками над грудью.','Локти слегка согнуты и держат этот угол.','Опускай гантель по дуге за голову до растяжения груди и широчайших.','Возвращай по той же дуге до уровня груди, таз не поднимай.'],e:['Слишком глубокое опускание — боль в плечах.','Локти расходятся в стороны.','Таз задирается вверх — теряется растяжка.']},
'Шраги с гантелями':{s:['Стоя, гантели по бокам, руки прямые, корпус ровный.','Поднимай плечи строго вверх к ушам — как «пожимаешь плечами».','В верхней точке задержись на 1 секунду.','Опускай медленно до полной растяжки трапеций.'],e:['Вращение плечами по кругу — травмоопасно и бесполезно, только вверх-вниз.','Помощь бицепсами — руки остаются прямыми.','Подбородок прижимается к груди.']},
'Шраги со штангой':{base:'Шраги с гантелями',note:'Штанга спереди на прямых руках. Хват чуть шире плеч, гриф скользит вдоль бёдер.'},

'Сгибания на наклонной скамье':{base:'Сгибания с гантелями',note:'Спинка 45–60°, руки висят за корпусом — растянутая позиция бицепса. Вес меньше, амплитуда полная.'},
'Прогулка фермера':{s:['Возьми тяжёлые гантели, встань ровно: плечи опущены и отведены назад.','Иди короткими быстрыми шагами 20–40 метров.','Корпус жёсткий, пресс включён, взгляд вперёд.','Отдых — и ещё 2–4 отрезка.'],e:['Плечи заваливаются вперёд.','Наклон корпуса в сторону.','Слишком лёгкий вес — это упражнение про «тяжело держать».']},
'Сгибания запястий со штангой':{s:['Сидя, предплечья на бёдрах или скамье, кисти свисают с края.','Опусти гриф, раскрыв пальцы — растяжка предплечий.','Сожми и подними кистями вверх до максимума.','Медленно вниз, 15–20 повторов.'],e:['Работа локтями вместо запястий.','Слишком большой вес — короткая амплитуда.']},
'Разгибания одной ногой':{base:'Разгибания ног',note:'Одной ногой: вес вдвое меньше, следи, чтобы таз не крутился. Хорошо выравнивает разницу ног.'},
'Сплит-присед в Смите':{s:['Одна нога впереди под грифом, задняя на носке позади или на скамье.','Гриф на верхе спины, корпус слегка наклонён вперёд.','Опускайся вертикально до бедра параллельно полу.','Толкайся пяткой передней ноги.'],e:['Колено уезжает далеко за носок с отрывом пятки.','Слишком короткий шаг — колено бьётся в раму.','Перекос таза.']},
'Отведение ноги в кроссовере в сторону':{s:['Манжета на щиколотке рабочей ноги, встань боком к блоку.','Держись за раму, корпус ровный.','Отводи прямую ногу строго в сторону усилием ягодицы.','Задержка вверху 1 секунда, возврат подконтрольно.'],e:['Наклон корпуса в сторону — крадёт всю работу.','Мах по инерции.','Носок разворачивается вверх — держи его вперёд.']},
'Доброе утро со штангой':{s:['Гриф на верхе спины как в приседе, ноги на ширине плеч, колени мягкие.','Наклоняйся тазом назад, спина прямая как доска.','До ощутимой растяжки бицепса бедра (корпус ~45°).','Вставай усилием ягодиц, проталкивая таз вперёд.'],e:['Круглая спина — категорически нельзя.','Слишком большой вес: начинай с пустого грифа.','Колени полностью прямые — держи их мягкими.']},
'Икры стоя с гантелью одной ногой':{base:'Икры стоя на возвышении',note:'Одной ногой с гантелью в той же руке, второй держись за опору. Двойная нагрузка на икру — рост быстрее.'},
'Ракушка с резинкой':{s:['Ляг на бок, колени согнуты 90°, резинка выше коленей.','Стопы вместе, таз зафиксирован, не заваливай его назад.','Раскрывай верхнее колено как ракушку до максимума.','Медленно закрывай, сохраняя натяжение резинки.'],e:['Таз откатывается назад вместе с коленом.','Слишком быстрый темп без контроля.','Стопы отрываются друг от друга.']},
'Пожарный гидрант':{s:['Встань на четвереньки, спина ровная, пресс включён.','Отводи согнутую ногу строго в сторону до уровня таза.','Держи угол в колене 90° всю амплитуду.','Верни подконтрольно, не касаясь коленом пола между повторами.'],e:['Перекос корпуса в противоположную сторону.','Прогиб поясницы.','Мах по инерции.']},
'Мост с резинкой на коленях':{base:'Ягодичный мост на полу',note:'Резинка выше коленей: на всём подъёме разводи колени наружу против резинки — включается средняя ягодичная.'},
'Отведение ноги лёжа на боку':{s:['Ляг на бок ровной линией, нижняя рука под головой.','Верхнюю ногу держи прямой, носок вперёд.','Поднимай ногу до ~45° усилием боковой части ягодицы.','Опускай медленно, не кладя ногу до конца подхода.'],e:['Корпус заваливается назад.','Носок смотрит вверх — работа уходит с ягодицы.','Слишком высокий мах с рывком.']},
'Боковая планка':{s:['Ляг на бок, локоть строго под плечом, стопы друг на друге или одна перед другой.','Подними таз: тело — прямая линия от макушки до пяток.','Держи 20–45 секунд, пресс и ягодицы сжаты.','Повтори на другую сторону.'],e:['Таз провисает вниз.','Плечо «вжато в ухо» — выталкивайся из пола.','Задержка дыхания.']},
'Велосипед (пресс)':{s:['Лёжа на спине, поясница прижата, руки за головой, ноги подняты.','Тянись локтем к противоположному колену, вторую ногу выпрямляй.','Меняй стороны плавно, скручивание — грудью, не шеей.','Темп средний, дыхание ровное.'],e:['Тяга руками за голову — шея страдает.','Поясница отрывается от пола.','Слишком быстрый темп без скручивания.']},
'Дэд-баг':{s:['Лёжа на спине, руки вертикально вверх, колени над тазом под 90°.','Прижми поясницу к полу — это главное условие.','Медленно опусти противоположные руку и ногу почти до пола.','Вернись и поменяй стороны. Движение медленное и полностью подконтрольное.'],e:['Поясница отрывается от пола — уменьшай амплитуду.','Обе ноги одновременно.','Задержка дыхания.']},
'Скалолаз':{s:['Упор лёжа, ладони под плечами, тело — прямая линия.','Поочерёдно подтягивай колени к груди в беговом темпе.','Таз держи на уровне плеч, не задирай.','30–45 секунд в подходе.'],e:['Таз задирается вверх домиком.','Плечи уходят назад от ладоней.','Стук ногами — приземляй мягко.']},
'Паллоф-пресс с резинкой':{s:['Закрепи резинку на уровне груди, встань боком к точке крепления.','Держи резинку двумя руками у груди, натяжение ощутимое.','Выжми руки вперёд и держи 2–3 секунды: корпус не даёт себя развернуть.','Верни к груди. Это анти-вращение: тело неподвижно.'],e:['Корпус разворачивает в сторону резинки — встань ближе.','Плечи поднимаются.','Слишком слабое натяжение.']},
'Подъёмы перед собой (гантели)':{s:['Стоя, гантели перед бёдрами, локти слегка согнуты.','Поднимай прямые руки перед собой до уровня плеч.','Без раскачки корпусом, в верхней точке — пауза.','Опускай медленнее, чем поднимал.'],e:['Раскачка корпусом.','Подъём выше плеч.','Рывок в старте.']},
'Отжимания на брусьях':{base:'Брусья / гравитрон',note:'Без противовеса: если меньше 8 чистых повторов — вернись в гравитрон или добавь резинку под колени.'},
'Разгибания на блоке (прямая рукоять)':{base:'Разгибания на блоке (канат)',note:'Прямая рукоять: хват сверху на ширине плеч, внизу полное разгибание без разведения.'},
'Кик-бэк с гантелью':{s:['Наклон корпуса почти до параллели, опора рукой о скамью.','Плечо прижато к корпусу параллельно полу — фиксируй его.','Разгибай локоть до прямой руки, пауза 1 секунда.','Опускай подконтрольно до угла 90°.'],e:['Плечо гуляет вниз — теряется вся работа.','Раскачка гантели по инерции.','Корпус разворачивается.']},
'Жим Смита сидя (плечи)':{base:'Жим гантелей сидя',note:'Смит фиксирует траекторию: гриф опускается перед лицом до подбородка. Скамью поставь так, чтобы гриф не цеплял нос.'},
'Тяга верхнего блока узким хватом':{base:'Тяга верхнего блока к груди',note:'Узкая нейтральная рукоять: локти идут вдоль корпуса, тяни к низу груди — сильнее растяжение широчайших.'},
'Пуловер на верхнем блоке':{s:['Встань лицом к верхнему блоку, возьми прямую рукоять хватом сверху.','Корпус слегка наклонён, руки почти прямые.','Тяни рукоять по дуге вниз к бёдрам только широчайшими.','Вверх — подконтрольно до растяжения спины.'],e:['Сгибание локтей — превращается в разгибание на трицепс.','Раскачка корпусом.','Плечи поднимаются к ушам.']},
'Тяга гири в наклоне':{base:'Тяга штанги в наклоне',note:'Гиря вместо штанги: тяни к поясу, хват нейтральный. Удобно дома и для одной руки поочерёдно.'},
'Гиперэкстензия':{s:['Передние подушки под тазом (не под животом), стопы закреплены.','Опускайся с прямой спиной до растяжения бицепса бедра.','Поднимайся до прямой линии корпуса — без переразгибания вверх.','Руки на груди, темп медленный.'],e:['Переразгибание в верхней точке — поясница страдает.','Круглая спина внизу.','Рывки.']},
'Сгибания Зоттмана':{base:'Сгибания с гантелями',note:'Вверх — ладонями к себе (бицепс), в верхней точке разворот ладоней вниз и медленный негатив (предплечья). Двойная польза.'},
'Концентрированные сгибания':{base:'Сгибания с гантелями',note:'Сидя, локоть упирается во внутреннюю часть бедра — читинг невозможен. Максимальная изоляция бицепса, вес меньше.'},
'Приседания со штангой':{s:['Гриф на трапециях, лопатки сведены, хват уже — жёстче спина.','Стопы на ширине плеч, носки слегка наружу.','Садись тазом назад-вниз до параллели бедра, колени по линии носков.','Вставай, проталкивая пол пятками, спина всё время прямая.'],e:['Колени сводятся внутрь.','Отрыв пяток — поставь блины под пятки или работай над голеностопом.','Круглая поясница внизу («клевок» тазом) — ограничь глубину.']},
'Фронтальный присед':{base:'Приседания со штангой',note:'Гриф на передних дельтах, локти высоко вперёд. Корпус вертикальнее, акцент на квадрицепс. Вес заметно меньше.'},
'Становая тяга (классика)':{s:['Гриф над серединой стопы, хват чуть шире ног.','Спина прямая, грудь вперёд, таз выше колен.','Тяни, отталкивая пол ногами: гриф скользит вдоль голеней.','Дотяни до полного выпрямления, вниз — тазом назад, подконтрольно.'],e:['Круглая спина — главная и самая опасная ошибка.','Гриф далеко от голеней — перегруз поясницы.','Рывок с пола и «отбив» вниз.']},
'Сумо-тяга':{base:'Становая тяга (классика)',note:'Широкая постановка ног, носки наружу, хват внутри колен. Корпус вертикальнее — меньше нагрузка на поясницу, больше на ягодицы и приводящие.'},
'Отведение ноги на блоке':{base:'Отведение ноги в кроссовере в сторону',note:'То же с отведением назад: манжета на щиколотке, отводи прямую ногу назад-вверх усилием ягодицы, корпус неподвижен.'},
'Ходьба выпадами':{base:'Выпады с гантелями',note:'Шагай вперёд, чередуя ноги: колено задней почти касается пола, корпус вертикальный. 10–12 шагов на ногу.'},
'Прыжки на тумбу':{s:['Тумба устойчивая, старт в полуприседе с замахом руками.','Прыгай на центр тумбы, приземляйся мягко в полуприсед на всю стопу.','Сходи вниз шагом, не спрыгивай.','Качество важнее высоты.'],e:['Спрыгивание вниз — риск для ахилла.','Приземление на прямые ноги.','Пятки свисают с края.']},
'Планка':{s:['Локти строго под плечами, тело — прямая линия от макушки до пяток.','Пресс и ягодицы сжаты, поясница не провисает.','Дыши ровно, держи 30–60 секунд.','Стало легко — усложняй: нога вверх или планка с касанием плеч.'],e:['Таз задран вверх или провис вниз.','Голова запрокинута.','Задержка дыхания.']},
'Русские скручивания':{s:['Сидя, корпус отклонён назад ~45°, ноги согнуты, пятки на полу или на весу.','Руки вместе перед грудью (или с весом).','Поворачивай корпус в стороны, касаясь руками пола у бедра.','Поворот — грудью, а не только руками.'],e:['Круглая спина с заваливанием.','Вращение только руками, корпус неподвижен.','Слишком быстрый темп.']},
'Подъём ног в висе':{base:'Подъём ног в упоре',note:'В висе на турнике: сложнее версия — корпус не раскачивается, ноги (или колени) поднимаются подконтрольно, опускаются медленно.'},
'Жим штанги лёжа':{img:'barbell-bench-press-medium-grip',s:['Лопатки сведены и прижаты к скамье, лёгкий прогиб в пояснице, стопы жёстко в пол.','Хват чуть шире плеч, гриф над серединой груди.','Опускай 2 секунды до касания груди, локти под 45–60° к корпусу.','Жми мощно вверх, не отрывая таз и лопатки от скамьи.'],e:['Локти разведены на 90° — опасно для плеч: держи 45–60°.','Отбив грифа от груди — опускай подконтрольно.','Таз отрывается от скамьи — значит вес пока велик.']},
'Жим гантелей на наклонной 30°':{img:'incline-dumbbell-press',s:['Наклон 30° — не больше, иначе работа уходит в плечи.','Гантели по бокам груди, предплечья вертикальны.','Жми вверх и слегка внутрь, вверху гантели не стукаются.','Вниз 2 секунды — до лёгкой растяжки груди.'],e:['Слишком крутой наклон спинки.','Провал гантелей слишком глубоко — растяжение, а не боль.','Отрыв поясницы от спинки.']},
'Жим гантелей сидя':{img:'seated-dumbbell-press',s:['Спинка почти вертикальная, поясница прижата.','Старт: гантели на уровне ушей, предплечья вертикальны.','Жми вверх до почти прямых локтей, без жёсткого «замка».','Опускай подконтрольно до уровня ушей.'],e:['Сильный прогиб поясницы — жим превращается в наклонный: прижмись к спинке.','Локти гуляют вперёд-назад.','Помощь ногами и рывки.']},
'Разведения гантелей в стороны':{img:'side-lateral-raise',s:['Слегка согни локти и зафиксируй этот угол.','Поднимай через стороны, ведя движение локтями, до горизонтали.','В верхней точке мизинец чуть выше большого пальца.','Опускай медленнее, чем поднимал.'],e:['Раскачка корпусом — если качаешься, вес велик.','Подъём выше уровня плеч — работу забирает трапеция.','Полностью прямые руки — держи мягкие локти.']},
'Разгибания на блоке (канат)':{img:'triceps-pushdown-rope-attachment',s:['Локти прижаты к корпусу и неподвижны всю амплитуду.','Разгибай до полного выпрямления, внизу разведи концы каната.','Вверх — подконтрольно, предплечья чуть выше параллели.','Корпус слегка наклонён, пресс собран.'],e:['Локти уходят вперёд — работает уже не трицепс.','Давишь весом всего корпуса.','Обрезанная амплитуда вверху.']},
'Брусья / гравитрон':{img:'dips-triceps-version',s:['Противовес такой, чтобы выходило 8–12 чистых повторов.','Небольшой наклон вперёд, локти идут назад, не в стороны.','Вниз — до плеч чуть ниже локтей, без провала.','Вверх — до почти прямых рук.'],e:['Слишком глубокий провал — боль в передней дельте.','Плечи «вжаты в уши» — тяни лопатки вниз.','Раскачивание ногами.']},
'Жим гантелей лёжа':{base:'Жим штанги лёжа',a:'bench',note:'Гантели дают свободную траекторию: опускай по бокам груди и слегка своди вверху. Не проваливайся глубже комфортной растяжки.'},
'Жим в Смите лёжа':{base:'Жим штанги лёжа',a:'bench',note:'Траектория фиксирована — поставь скамью так, чтобы гриф опускался ровно на середину груди.'},
'Жим в тренажёре (грудь)':{img:'machine-bench-press',s:['Отрегулируй сиденье: рукояти на уровне середины груди.','Лопатки сведены и прижаты к спинке.','Жми вперёд до почти прямых рук, плечи не выкатывай.','Возврат медленный, плитки не стукаются.'],e:['Плечи уходят вперёд в конце жима — держи лопатки.','Работа в половину амплитуды.']},
'Жим в Смите на наклонной':{base:'Жим гантелей на наклонной 30°',a:'incline',note:'Смит фиксирует траекторию — точка касания: верх груди.'},
'Жим в тренажёре на наклонной':{base:'Жим гантелей на наклонной 30°',a:'chestpress',note:'Сиденье так, чтобы рукояти были на уровне верха груди.'},
'Жим штанги сидя':{base:'Жим гантелей сидя',a:'ohp',note:'Гриф опускается до подбородка или ключиц спереди — не за голову.'},
'Жим в тренажёре (плечи)':{base:'Жим гантелей сидя',a:'ohp',note:'Тренажёр стабилизирует вес — можно смелее прогрессировать.'},
'Жим Арнольда':{base:'Жим гантелей сидя',a:'ohp',note:'Старт ладонями к себе, по ходу подъёма разворот наружу. Вес меньше обычного жима.'},
'Махи в кроссовере':{base:'Разведения гантелей в стороны',a:'latraise',note:'Трос проходит за спиной — натяжение есть даже внизу, работай чисто.'},
'Разведения в тренажёре':{base:'Разведения гантелей в стороны',a:'latraise',note:'Локти прижаты к подушкам, амплитуда до горизонтали.'},
'Французский жим с гантелью':{img:'seated-triceps-press',s:['Гантель двумя руками за головой, локти близко к ушам.','Локти неподвижны — двигаются только предплечья.','Разгибай до прямых рук, опускай на 2 счёта.','Пресс собран, поясницу не прогибай.'],e:['Локти разъезжаются в стороны.','Слишком большой вес — рывки и помощь корпусом.']},

'Отжимания от пола':{img:'pushups',s:['Планка: тело — прямая линия от макушки до пят.','Ладони чуть шире плеч, локти назад под 45°.','Грудью почти до пола, вверх до прямых рук.','Тяжело — делай с колен или с руками на лавке.'],e:['Провисший таз или «горб».','Голова клюёт вниз первой.','Половина амплитуды.']},
'Жим лёжа узким хватом':{base:'Жим штанги лёжа',a:'bench',note:'Хват на ширине плеч, локти вдоль корпуса — акцент уходит в трицепс.'},
'Тяга верхнего блока к груди':{img:'wide-grip-lat-pulldown',s:['Хват шире плеч, корпус отклонён на 10–15° и зафиксирован.','Начни с опускания лопаток, затем тяни локти вниз-назад.','Рукоять к верху груди, секундная пауза.','Вверх — медленно, до полного растяжения широчайших.'],e:['Раскачка корпусом на каждом повторе.','Тянешь руками: думай «локти к полу», а не «кисти к себе».','Тяга за голову — не нужна и рискованна.']},
'Тяга горизонтального блока':{img:'seated-cable-rows',s:['Колени слегка согнуты, спина прямая.','Тяни рукоять к низу живота, локти вдоль корпуса.','В конце сведи лопатки, пауза на счёт.','Возврат с прямой спиной, растягивая широчайшие.'],e:['Круглая поясница при наклоне вперёд.','Корпус-маятник: допустимо не больше 10–15° хода.','Плечи поднимаются к ушам.']},
'Тяга гантели одной рукой':{img:'one-arm-dumbbell-row',s:['Колено и рука на скамье, спина параллельна полу.','Тяни гантель к поясу, локоть вдоль корпуса.','Вверху пауза — доведи лопатку назад.','Внизу растяжение: плечо чуть «выпускается» вперёд.'],e:['Корпус вращается вслед за гантелью.','Тяга к груди с локтем в сторону.','Рывки.']},
'Тяга каната к лицу (face pull)':{img:'face-pull',s:['Трос на уровне лица.','Тяни концы каната к ушам, разводя их в стороны.','Локти держи высоко, на уровне плеч.','В конце кисти выше локтей — наружное вращение плеча.'],e:['Локти проваливаются вниз — получается тяга к груди.','Большой вес: это упражнение здоровья плеч, 12–15 чистых.']},
'Сгибания на бицепс (штанга/EZ)':{img:'barbell-curl',s:['Локти прижаты к корпусу и неподвижны.','Поднимай до пикового сокращения бицепса.','Опускай 2–3 секунды до почти прямых рук.','Плечи не поднимаются, запястья нейтральны.'],e:['Читинг корпусом — качаешься, значит вес велик.','Локти уезжают вперёд — включается дельта.','Сброс вниз без контроля: негатив — половина результата.']},
'«Молотки» с гантелями':{base:'Сгибания на бицепс (штанга/EZ)',a:'curl',note:'Нейтральный хват (ладони друг к другу) — акцент на брахиалис и предплечья.'},
'Подтягивания в гравитроне':{img:'band-assisted-pull-up',s:['Противовес — чтобы выходило 8–12 повторов.','Старт с опускания лопаток вниз.','Тяни грудь к перекладине, локти к полу.','Внизу выпрямляйся полностью, но не «висни» на связках.'],e:['Подбородок тянется вверх раньше груди.','Обрезанная амплитуда внизу.','Противовес не уменьшается месяцами — прогрессируй.']},
'Тяга верхнего блока обратным хватом':{base:'Тяга верхнего блока к груди',a:'pulldown',note:'Хват уже и снизу — сильнее работают низ широчайших и бицепс.'},
'Тяга штанги в наклоне':{img:'bent-over-barbell-row',s:['Наклон 30–45°, спина прямая, колени мягкие.','Тяни гриф к низу живота.','Локти вдоль корпуса, в конце сведи лопатки.','Наклон зафиксирован — корпус не подбрасывает вес.'],e:['Круглая спина — главный риск: держи «гордую грудь».','Раскачка корпусом.','Тяга к груди вместо живота.']},
'Рычажная тяга в тренажёре':{base:'Тяга горизонтального блока',a:'cablerow',note:'Грудь уперта в подушку — поясница выключена, можно смело прогрессировать.'},

'Обратные разведения в тренажёре':{img:'reverse-machine-flyes',s:['Грудь прижата к подушке, руки чуть согнуты.','Разводи назад до линии корпуса, ведя локтями.','Пауза в задней точке.','Медленный возврат без стука плит.'],e:['Слишком большой вес — включается трапеция и рывки.','Жёсткий «замок» в локтях.']},
'Обратные разведения с гантелями':{base:'Обратные разведения в тренажёре',a:'revfly',note:'В наклоне 45° и глубже, спина прямая, взгляд в пол.'},

'Ягодичный мост со штангой':{img:'barbell-hip-thrust',s:['Лопатки на скамье, гриф с мягкой накладкой на тазу.','Стопы так, чтобы вверху голень была вертикальной.','Подбородок к груди, взгляд вперёд.','Вверху полное разгибание таза + пауза 1 сек, сжимая ягодицы.'],e:['Прогиб поясницей вместо разгибания тазом — держи рёбра «вниз».','Нет паузы вверху — главная часть теряется.','Стопы слишком далеко или близко.']},
'Румынская тяга со штангой':{img:'romanian-deadlift',s:['Движение = таз назад, а не наклон вниз. Гриф скользит по бёдрам.','Колени слегка согнуты и почти неподвижны.','Спина прямая всю амплитуду, лопатки собраны.','Глубина — до растяжения задней поверхности (середина голени), вверх — тазом.'],e:['Круглая спина — стоп-сигнал: снижай вес или глубину.','Колени ходят — получается присед.','Гриф уходит вперёд от ног.']},
'Сгибания ног лёжа':{img:'lying-leg-curls',s:['Валик на нижней трети голени, колено за краем скамьи.','Сгибай до касания валиком ягодиц.','Опускай 2–3 секунды.','Таз прижат к скамье всё время.'],e:['Таз подпрыгивает — вес велик.','Рывок в старте.','Сброс вниз без негатива.']},
'Разгибания ног':{img:'leg-extensions',s:['Отрегулируй спинку: колено на оси вращения тренажёра.','Разгибай до прямой ноги, пауза 1 сек вверху.','Опускай медленно, плитки не стукаются.','Работай в комфортном для колена секторе.'],e:['Рывки тазом с отрывом от сиденья.','Быстрый сброс вниз.']},
'Икры стоя в тренажёре':{img:'standing-calf-raises',s:['Носки на краю платформы, пятки свободны.','Вниз — глубокая растяжка на 2 счёта.','Вверх — на максимум и пауза 2 сек.','Колени прямые, но не в «замке».'],e:['Пружинишь в отбив — икры любят паузы.','Обрезанная растяжка внизу.','Слишком быстрый темп.']},
'Скручивания на верхнем блоке':{img:'cable-crunch',s:['Встань на колени, канат держи у висков.','Скручивай корпус: рёбра к тазу, спина округляется.','Таз неподвижен — тянет пресс, а не руки.','Возврат подконтрольный, до растяжения пресса.'],e:['Тянешь руками вниз.','Складываешься в тазобедренном суставе вместо скручивания.','Слишком большой вес.']},
'Гакк-машина':{base:'Жим ногами',a:'legpress',note:'Спина плотно прижата, глубина — до комфортной, пятки не отрываются от платформы.'},
'Присед в Смите':{img:'smith-machine-squat',s:['Стопы чуть впереди линии грифа, гриф на трапеции.','Таз назад-вниз до бедра параллельно полу.','Колени вдоль носков, пятки прижаты.','Вверх без «замка» коленей.'],e:['Стопы ровно под грифом — колени перегружаются.','Отрыв пяток.','Круглая поясница в нижней точке.']},

'Выпады с гантелями':{img:'dumbbell-lunges',s:['Шаг вперёд, корпус вертикален.','Вниз — колено задней ноги почти к полу.','Переднее колено вдоль носка, вес на пятке передней.','Вверх — толчком передней ноги.'],e:['Колено уезжает за носок с отрывом пятки.','Слишком короткий шаг.','Заваливание корпуса вбок.']},
'Подъём ног в упоре':{img:'hanging-leg-raise',s:['Предплечья на подушках, плечи тяни вниз от ушей.','Поднимай ноги с лёгким сгибом коленей до горизонтали.','В конце слегка подкрути таз вверх — это и есть пресс.','Внизу гаси маятник, не раскачивайся.'],e:['Раскачка.','Подъём только ногами без подкрутки таза.','Задержка дыхания.']},

    const B = TECH[T.base];
    return {img: T.img || B.img, s: B.s, e: B.e, note: T.note, baseName: T.base};
  }
  return T;
}

function buildHomeDB(eq, stx){
  const ex = {}, alts = {};
  for (const t in HOME_SLOTS){
    ex[t] = []; alts[t] = [];
    const used = new Set();
    for (const slot of HOME_SLOTS[t]){
      const ok = slot.v.filter(v => (!v.need || eq[v.need]) && !used.has(v.n));
      if (!ok.length) continue;
      let c = ok[0];
      if (PROF && (PROF.level||'some')==='new' && c.bw){ const ez = ok.find(v=>v.e); if (ez) c = ez; }
      used.add(c.n);
      const rest_ = ok.filter(v=>v!==c);
      const entry = {n:c.n, rest:c.rest, inc:c.inc||0, bw:c.bw?1:0,
        start: c.bw ? 'вес тела' : ((c.st && stx && stx[c.st]) ? stx[c.st] : 'подбор'),
        sub: rest_[0] ? rest_[0].n : '—'};
      for (const ph of ['p0','p1','p2']) if (c[ph]) entry[ph] = c[ph];
      ex[t].push(entry);
      alts[t].push({m:slot.m, a: rest_.map(v=>({n:v.n, inc:v.inc||0, bw:v.bw?1:0}))});
    }
  }
  return {ex, alts};
}

const FB_HOME_PLAN = {
  A: [['Push',0],['Pull',0],['Legs',0],['Push',1],['Legs',2],['Legs',6]],
  B: [['Pull',0],['Push',2],['Legs',1],['Legs',3],['Pull',3],['Legs',5]],
};
function buildHomeFB(eq, stx){
  const ex = {}, alts = {};
  for (const day in FB_HOME_PLAN){
    ex[day] = []; alts[day] = [];
    const used = new Set();
    for (const [t, si] of FB_HOME_PLAN[day]){
      const slot = HOME_SLOTS[t][si];
      if (!slot) continue;
      const ok = slot.v.filter(v => (!v.need || eq[v.need]) && !used.has(v.n));
      if (!ok.length) continue;
      let c = ok[0];
      if (PROF && (PROF.level||'some')==='new' && c.bw){ const ez = ok.find(v=>v.e); if (ez) c = ez; }
      used.add(c.n);
      const rest_ = ok.filter(v=>v!==c);
      const entry = {n:c.n, rest:c.rest, inc:c.inc||0, bw:c.bw?1:0,
        start: c.bw ? 'вес тела' : ((c.st && stx && stx[c.st]) ? stx[c.st] : 'подбор'),
        sub: rest_[0] ? rest_[0].n : '—'};
      for (const ph of ['p0','p1','p2']) if (c[ph]) entry[ph] = c[ph];
      ex[day].push(entry);
      alts[day].push({m:slot.m, a: rest_.map(v=>({n:v.n, inc:v.inc||0, bw:v.bw?1:0}))});
    }
  }
  return {ex, alts};
}
function phaseOf(w){
  if (w<=2) return 'p0';
  if (deloadWeeks().includes(w)) return 'deload';
  return w <= (WEEKS()>=10?6:5) ? 'p1' : 'p2';
}
const PHASE_NAME = {p0:'Возвращение', p1:'Разгон', deload:'Разгрузка', p2:'Новая территория'};
// тренировки: очередь по порядку (пропустил — делаешь следующую, даты — ориентир)
function buildSessions(){
  const list = [];
  if (PROF.legacyWeek0){
    list.push({w:0, d:new Date(2026,7,18), t:'Push'},
              {w:0, d:new Date(2026,7,20), t:'Pull'},
              {w:0, d:new Date(2026,7,22), t:'Legs'});
  }
  const fb = PROF.split === 'fb';
  const rot = fb ? ['A','B'] : ['Push','Pull','Legs'];
  const dows = (PROF.days && PROF.days.length) ? PROF.days : (fb ? [0,2,4] : [0,1,3,5]);
  let i = 0;
  for (let w = 0; w < WEEKS(); w++)
    for (const dow of dows) {
      const d = new Date(W1); d.setDate(d.getDate() + w*7 + dow);
      list.push({w:w+1, d, t:rot[i++ % rot.length]});
    }
  return list.map((s, idx) => {
    const ph = phaseOf(s.w);
    const base = ph==='deload' ? 'p1' : ph;
    const exs = EXDB[s.t].map((e,ei)=>({...e, ei})).filter(e => e[base]).map(e => {
      const [sets, reps, lo, hi] = e[base];
      return ph==='deload'
        ? {ei:e.ei, n:e.n, sets:2, reps:reps.split(' ·')[0]+' · RPE≤6', lo, hi, rest:e.rest, inc:e.inc, bw:e.bw||0, hint:e.bw?'−30–40% повторов':'−30% от рабочего', sub:e.sub, deload:true}
        : {ei:e.ei, n:e.n, sets, reps, lo, hi, rest:e.rest, inc:e.inc, bw:e.bw||0, hint:s.w<=2?e.start:'', sub:e.sub};
    });
    return {id:idx, w:s.w, date:s.d, type:s.t, phase:ph, exs};
  });
}

function weekOf(d){                       // календарная неделя программы для даты
  if (d < W1) return 0;
  return Math.min(99, Math.floor((d - W1)/864e5/7) + 1);
}
function planWeight(d){                   // плановая траектория на день
  const w = weekOf(d); if (w > WEEKS()) return TARGETS[WEEKS()];
  if (w === 0 && !PROF.legacyWeek0) return TARGETS[0];
  const ws = w===0 ? new Date(2026,7,19) : new Date(W1.getTime()+ (w-1)*7*864e5);
  const we = w===0 ? new Date(2026,7,23) : new Date(ws.getTime()+6*864e5);
  const t0 = w===0 ? PROF.startWeight : TARGETS[w-1], t1 = TARGETS[w];
  const f = (Math.min(Math.max(d-ws,0), we-ws)/864e5 + 1)/((we-ws)/864e5 + 1);
  return t0 + (t1-t0)*f;
}
