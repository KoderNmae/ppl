<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#131312">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PPL">
<title>PPL трекер</title>
<style>
:root{
  --bg:#131312; --surface:#1c1c1b; --card:#232322; --card2:#2a2a28; --border:#34342f;
  --text:#f2f2ef; --text2:#b6b5ac; --muted:#8a8a85;
  --accent:#3987e5; --accent-dim:#1c5cab;
  --push:#d95926; --pull:#3987e5; --legs:#199e70;
  --good:#1baf7a; --warn:#eda100; --bad:#e66767;
  --r:14px; --tap:48px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  height:100%; overscroll-behavior-y:none}
#app{display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto}
header{padding:calc(10px + env(safe-area-inset-top)) 16px 8px; flex:none}
header h1{font-size:18px; margin:0; font-weight:700}
header .sub{color:var(--text2); font-size:13px; margin-top:2px}
main{flex:1; overflow-y:auto; padding:4px 14px 20px; -webkit-overflow-scrolling:touch}
nav{flex:none; display:flex; border-top:1px solid var(--border); background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1; background:none; border:none; color:var(--muted); font:inherit;
  font-size:10.5px; padding:7px 0 6px; min-height:var(--tap); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px}
nav button svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round}
nav button.on{color:var(--accent)}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--r);
  padding:14px; margin:10px 0}
.card h3{margin:0 0 8px; font-size:14px; color:var(--text2); font-weight:600;
  text-transform:uppercase; letter-spacing:.4px}
.row{display:flex; align-items:center; gap:10px}
.row .grow{flex:1}
.big{font-size:26px; font-weight:700}
.small{font-size:13px; color:var(--text2)}
.tiny{font-size:12px; color:var(--muted)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--accent); color:#fff; border:none; border-radius:12px;
  font:inherit; font-weight:600; font-size:15px; padding:0 18px; min-height:var(--tap); cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2); color:var(--text); border:1px solid var(--border)}
.btn.ghost{background:none; color:var(--accent); border:none; min-height:40px}
.btn.danger{background:none; border:1px solid var(--bad); color:var(--bad)}
.btn.full{width:100%}
.btn.sm{min-height:38px; font-size:14px; padding:0 12px; border-radius:10px}
.btn:disabled{opacity:.45}
input[type=number],input[type=text],select{background:var(--card2); border:1px solid var(--border);
  color:var(--text); font:inherit; font-size:17px; border-radius:10px; padding:10px 12px;
  min-height:var(--tap); width:100%}
input:focus,select:focus{outline:2px solid var(--accent-dim)}
.badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:700}
.b-push{background:rgba(217,89,38,.16); color:#f08a5c}
.b-pull{background:rgba(57,135,229,.16); color:#6da7ec}
.b-legs{background:rgba(25,158,112,.16); color:#3fc796}
.b-rest{background:rgba(138,138,133,.16); color:var(--text2)}
.b-deload{background:rgba(237,161,0,.16); color:#f2b53d}
.chip{display:inline-flex; align-items:center; justify-content:center; min-width:64px;
  min-height:44px; padding:4px 10px; border-radius:11px; background:var(--card2);
  border:1.5px dashed var(--border); color:var(--muted); font-size:14.5px; font-weight:600; cursor:pointer}
.chip.done{border-style:solid; border-color:var(--accent-dim); background:rgba(57,135,229,.13); color:var(--text)}
.chip.add{min-width:44px; border-style:solid}
.exname{font-weight:700; font-size:15.5px}
.exmeta{font-size:12.5px; color:var(--text2); margin-top:1px}
.exhint{font-size:12.5px; color:var(--warn); margin-top:3px}
.exhist{font-size:12px; color:var(--muted); margin-top:3px}
.sets{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px}
.exdone .exname{color:var(--muted)}
.divider{height:1px; background:var(--border); margin:11px -14px}
.bar{height:9px; border-radius:6px; background:var(--card2); overflow:hidden; margin-top:5px}
.bar i{display:block; height:100%; border-radius:6px; background:var(--accent); transition:width .3s}
.bar i.over{background:var(--warn)}
.bar i.good{background:var(--good)}
.kv{display:flex; justify-content:space-between; font-size:13.5px; color:var(--text2); margin-top:2px}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{color:var(--muted); font-weight:600; text-align:left; padding:6px 4px; border-bottom:1px solid var(--border)}
td{padding:7px 4px; border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.num{text-align:right; font-variant-numeric:tabular-nums}
.c-good{color:var(--good)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-mut{color:var(--muted)}
.seg{display:flex; background:var(--card2); border-radius:11px; padding:3px; gap:3px; margin:8px 0}
.seg button{flex:1; border:none; background:none; color:var(--text2); font:inherit; font-size:13.5px;
  font-weight:600; padding:8px 4px; border-radius:9px; cursor:pointer; min-height:40px}
.seg button.on{background:var(--accent-dim); color:#fff}
.mods{display:flex; flex-wrap:wrap; gap:8px}
.mod{background:var(--card2); border:1px solid var(--border); border-radius:11px; padding:8px 11px;
  font-size:13.5px; cursor:pointer; min-height:44px; display:flex; flex-direction:column; justify-content:center}
.mod b{font-size:13.5px; font-weight:600}
.mod span{font-size:11.5px; color:var(--muted)}
.loglist .row{padding:8px 0; border-bottom:1px solid var(--border)}
.loglist .row:last-child{border-bottom:none}
.x{background:none; border:none; color:var(--muted); font-size:20px; min-width:44px; min-height:44px; cursor:pointer}
.insight{border-left:3px solid var(--accent); padding:10px 12px; background:var(--card);
  border-radius:0 12px 12px 0; margin:9px 0}
.insight.good{border-color:var(--good)} .insight.warn{border-color:var(--warn)} .insight.bad{border-color:var(--bad)}
.insight b{font-size:14.5px}
.insight p{margin:4px 0 0; font-size:13.5px; color:var(--text2)}
.insight .btn{margin-top:8px}
#timerbar{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(64px + env(safe-area-inset-bottom));
  width:min(92%,520px); background:var(--card2); border:1px solid var(--accent-dim); border-radius:14px;
  padding:10px 14px; display:none; align-items:center; gap:12px; z-index:60; box-shadow:0 6px 24px rgba(0,0,0,.5)}
#timerbar.show{display:flex}
#timerbar .t{font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; min-width:70px}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(130px + env(safe-area-inset-bottom));
  background:var(--card2); border:1px solid var(--border); color:var(--text); padding:10px 18px;
  border-radius:12px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:70;
  max-width:90%; text-align:center}
#toast.show{opacity:1}
.modal-wrap{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:80;
  align-items:flex-end; justify-content:center}
.modal-wrap.show{display:flex}
.modal{background:var(--surface); border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  width:100%; max-width:560px; max-height:86dvh; overflow-y:auto}
.modal h2{margin:0 0 4px; font-size:17px}
.stepper{display:flex; align-items:center; gap:8px; margin:10px 0}
.stepper button{background:var(--card2); border:1px solid var(--border); color:var(--text);
  font-size:20px; font-weight:700; border-radius:11px; min-width:54px; min-height:52px; cursor:pointer}
.stepper input{text-align:center; font-size:22px; font-weight:700; min-height:52px}
.stepper .lbl{width:64px; flex:none; font-size:13px; color:var(--text2)}
.rpe{display:flex; gap:6px; margin-top:8px}
.rpe button{flex:1; min-height:42px; border-radius:10px; border:1px solid var(--border);
  background:var(--card2); color:var(--text2); font:inherit; font-weight:700; cursor:pointer}
.rpe button.on{background:var(--accent-dim); border-color:var(--accent); color:#fff}
.swapbtn{background:var(--card2); border:1px solid var(--border); color:var(--text2);
  border-radius:11px; min-width:46px; min-height:46px; font-size:19px; cursor:pointer; flex:none}
.varrow{display:flex; flex-direction:column; gap:1px; width:100%; text-align:left;
  background:var(--card2); border:1.5px solid var(--border); border-radius:12px;
  color:var(--text); font:inherit; padding:11px 13px; margin:6px 0; min-height:52px; cursor:pointer}
.varrow span{font-size:12px; color:var(--muted)}
.varrow.on{border-color:var(--accent); background:rgba(57,135,229,.12)}
input[type=date]{background:var(--card2); border:1px solid var(--border); color:var(--text);
  font:inherit; font-size:17px; border-radius:10px; padding:10px 12px; min-height:var(--tap); width:100%;
  color-scheme:dark}
.qbtn{background:var(--card2); border:1px solid var(--border); color:var(--accent);
  border-radius:11px; min-width:46px; min-height:46px; font-size:17px; font-weight:700; cursor:pointer; flex:none}
.animbox{background:#101010; border:1px solid var(--border); border-radius:14px; margin:10px 0 4px; overflow:hidden}
.animbox.photo{position:relative; background:#0c0c0c}
.tphoto{width:100%; display:block; transition:opacity .45s ease}
.tphoto.over{position:absolute; left:0; top:0}
.ptag{position:absolute; left:10px; bottom:10px; background:rgba(0,0,0,.62); color:#fff;
  font-size:12px; padding:4px 10px; border-radius:8px; pointer-events:none}
.tech-steps{margin:6px 0 0; padding-left:22px}
.tech-steps li{margin:7px 0; font-size:14.5px; color:var(--text)}
.tech-err{display:flex; gap:9px; margin:8px 0; font-size:14px; color:var(--text2)}
.tech-err b{color:var(--bad); flex:none; font-size:14px}
.tech-note{background:rgba(57,135,229,.1); border:1px solid rgba(57,135,229,.35); color:#9cc3f2;
  border-radius:10px; padding:8px 11px; font-size:13px; margin-top:8px}
.hero{display:flex; gap:10px; margin:10px 0}
.tile{flex:1; background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:12px}
.tile .v{font-size:21px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums}
.tile .l{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px}
.tile .d{font-size:12px; margin-top:1px}
svg.chart{width:100%; display:block; touch-action:pan-y}
.legend{display:flex; gap:14px; font-size:12.5px; color:var(--text2); margin-top:6px}
.legend i{display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px}
.week-note{font-size:12px; color:var(--muted); margin-top:8px}
.section-t{font-size:15px; font-weight:700; margin:18px 2px 4px}
.plan-table td:first-child{color:var(--text2)}
a{color:var(--accent)}
.wlab{font-size:12.5px; color:var(--text2); margin:10px 2px 5px}
.storage-warn{background:rgba(237,161,0,.12); border:1px solid rgba(237,161,0,.4); color:#f2b53d;
  border-radius:12px; padding:10px 12px; font-size:13px; margin:10px 0; display:none}
.fade-list > *{animation:fin .18s ease}
@keyframes fin{from{opacity:.4; transform:translateY(3px)} to{opacity:1; transform:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="hd-title">PPL</h1>
    <div class="sub" id="hd-sub"></div>
  </header>
  <main id="view"></main>
  <nav id="tabs"></nav>
</div>
<div id="timerbar">
  <div class="t" id="timer-t">0:00</div>
  <div class="grow small" id="timer-l">отдых</div>
  <button class="btn sec sm" id="timer-plus">+30 c</button>
  <button class="btn sec sm" id="timer-x">Стоп</button>
</div>
<div id="toast"></div>
<div class="modal-wrap" id="modal-wrap"><div class="modal" id="modal"></div></div>
<script>
"use strict";
/* ============ 1. ПРОГРАММА (данные) ============ */
/* Профиль: у Егора — исходная программа (миграция), у новых — анкета первого запуска */
const EGOR = {
  name:'Егор', sex:'m', age:31, height:180, startWeight:127,
  w1:'2026-08-24', legacyWeek0:true, weeks:12,
  startsText:{bench:'50 кг', leg:'120 кг', thrust:'90–100 кг'},
  targets:{0:127.0,1:125.1,2:124.1,3:123.1,4:122.2,5:121.3,6:120.5,7:119.9,8:119.0,9:118.2,10:117.5,11:116.7,12:116.0},
  checkpoints:[
    {week:4,  wmin:121.7, wmax:123.2, txt:'жим 60–65×8 · ногами 160–170 · мост 120–130'},
    {week:8,  wmin:118.4, wmax:120.2, txt:'жим 70×6–8 · ногами 200×8 · мост 150×8'},
    {week:12, wmin:115.5, wmax:118.0, txt:'жим 75–80×5–8 · ногами 230–250 · мост 170–180'},
  ],
};
let PROF = null;
let W1 = null, PROG_END = null, TARGETS = null, CHECKPOINTS = null, SESSIONS = null;
const WEEKS = () => (PROF && PROF.weeks) || 12;
const deloadWeeks = () => { const n = WEEKS(); return n>=16 ? [7,13] : n>=10 ? [7] : []; };
const STEP_GOAL = w => w<=2 ? 7000 : (w <= (WEEKS()>=16?9:WEEKS()>=10?7:4) ? 8500 : 10000);
/* Расчёт плана по анкете: Миффлин—Сан-Жеор + правила программы */
function calcPlan(p){
  const bmr = 10*p.startWeight + 6.25*p.height - 5*p.age + (p.sex==='m'?5:-161);
  const bmi = p.startWeight/Math.pow(p.height/100,2);
  const defPct = bmi>=30?0.22 : bmi>=25?0.18 : 0.15;
  const kcal = Math.max(p.sex==='m'?1800:1500, Math.round(bmr*1.45*(1-defPct)/50)*50);
  const prot = Math.min(200, Math.max(110, Math.round(p.startWeight*1.4/5)*5));
  const rate = bmi>=30?0.0075 : bmi>=25?0.0055 : 0.004;
  const weeks = p.weeks || 12;
  const targets = {0: Math.round(p.startWeight*10)/10};
  for (let w=1; w<=weeks; w++){
    const prev = targets[w-1];
    targets[w] = Math.round((prev - prev*rate*(w===1?2:1))*10)/10;
  }
  return {kcal, prot, targets, maint: Math.round(bmr*1.45/50)*50};
}
function checkpointsFor(p){
  if (p.checkpoints) return p.checkpoints;
  const b = p.starts && p.starts.bench;
  const st = w => b
    ? 'жим ≈'+(Math.round(b*(w<=4?1:w<=8?1.04:w<=12?1.1:1.15)/2.5)*2.5)+' кг · остальные веса растут в том же темпе'
    : 'рабочие веса заметно выше стартовых';
  const weeks = p.weeks || 12;
  const pts = []; for (let w=4; w<=weeks; w+=4) pts.push(w);
  return pts.map(w => ({
    week:w,
    wmin: Math.round((p.targets[w]-0.6)*10)/10,
    wmax: Math.round((p.targets[w]+(w===weeks?2:1.2))*10)/10,
    txt: st(w),
  }));
}
function buildProgram(){
  W1 = fromKey(PROF.w1);
  PROG_END = new Date(W1.getTime() + (WEEKS()*7-1)*864e5);
  TARGETS = PROF.targets;
  CHECKPOINTS = checkpointsFor(PROF).map(c => ({...c, date: key(new Date(W1.getTime() + (c.week*7-1)*864e5))}));
  const stx = PROF.startsText || {};
  EXDB.Push[0].start = stx.bench || 'подбор';
  EXDB.Pull[0].start = stx.pull || 'подбор';
  EXDB.Legs[0].start = stx.leg || 'подбор';
  EXDB.Legs[1].start = stx.thrust || 'подбор';
  SESSIONS = buildSessions();
}
// упражнения: p0/p1/p2 = [подходы, "повторы", низ, верх диапазона]
const EXDB = {
 Push:[
  {n:'Жим штанги лёжа', p0:[2,'8–10',8,10], p1:[4,'5–8',5,8], p2:[4,'5–8 · топ-сет',5,8], rest:170, inc:2.5, start:'50 кг', sub:'Жим в Смите'},
  {n:'Жим гантелей на наклонной 30°', p0:[2,'10–12',10,12], p1:[3,'8–12',8,12], p2:[3,'8–12',8,12], rest:120, inc:2, start:'14–16 кг', sub:'Жим в тренажёре на наклонной'},
  {n:'Жим гантелей сидя', p0:[2,'10–12',10,12], p1:[3,'8–12',8,12], p2:[3,'8–12',8,12], rest:120, inc:2, start:'12–14 кг', sub:'Жим в тренажёре'},
  {n:'Разведения гантелей в стороны', p0:[2,'12–15',12,15], p1:[3,'12–15',12,15], p2:[4,'12–15',12,15], rest:80, inc:2, start:'8 кг', sub:'Махи в кроссовере'},
  {n:'Разгибания на блоке (канат)', p0:[2,'12–15',12,15], p1:[3,'10–15',10,15], p2:[3,'10–15',10,15], rest:90, inc:5, start:'подбор', sub:'Французский жим с гантелью'},
  {n:'Брусья / гравитрон', p2:[2,'8–12',8,12], rest:120, inc:5, start:'подбор', sub:'Отжимания от пола'},
 ],
 Pull:[
  {n:'Тяга верхнего блока к груди', p0:[2,'10–12',10,12], p1:[4,'8–12',8,12], p2:[4,'8–12 · топ-сет',8,12], rest:150, inc:5, start:'подбор', sub:'Подтягивания в гравитроне'},
  {n:'Тяга горизонтального блока', p0:[2,'10–12',10,12], p1:[3,'8–12',8,12], p2:[3,'8–12',8,12], rest:120, inc:5, start:'подбор', sub:'Тяга штанги в наклоне (с нед. 8)'},
  {n:'Тяга гантели одной рукой', p0:[2,'10–12',10,12], p1:[3,'8–12',8,12], p2:[3,'8–12',8,12], rest:100, inc:2, start:'22–24 кг', sub:'Рычажная тяга в тренажёре'},
  {n:'Тяга каната к лицу (face pull)', p0:[2,'15',13,15], p1:[3,'12–15',12,15], p2:[3,'12–15',12,15], rest:80, inc:2.5, start:'лёгкий', sub:'Обратные разведения'},
  {n:'Сгибания на бицепс (штанга/EZ)', p0:[2,'10–12',10,12], p1:[3,'8–12',8,12], p2:[3,'8–12',8,12], rest:90, inc:2.5, start:'20 кг', sub:'Сгибания с гантелями'},
  {n:'«Молотки» с гантелями', p1:[2,'10–12',10,12], p2:[2,'10–12',10,12], rest:90, inc:2, start:'10–12 кг', sub:'Сгибания на блоке'},
 ],
 Legs:[
  {n:'Жим ногами', p0:[2,'10–12',10,12], p1:[4,'8–12',8,12], p2:[4,'8–12 · топ-сет',8,12], rest:170, inc:10, start:'120 кг', sub:'Гакк-машина'},
  {n:'Ягодичный мост со штангой', p0:[2,'10',9,11], p1:[3,'8–12',8,12], p2:[3,'8–12',8,12], rest:140, inc:5, start:'90–100 кг', sub:'Мост в тренажёре / Смите'},
  {n:'Румынская тяга со штангой', p1:[3,'8–10',8,10], p2:[3,'8–10',8,10], rest:140, inc:2.5, start:'40 кг', sub:'Румынская тяга с гантелями'},
  {n:'Сгибания ног лёжа', p0:[2,'12–15',12,15], p1:[3,'10–15',10,15], p2:[3,'10–15',10,15], rest:90, inc:5, start:'подбор', sub:'Сгибания сидя'},
  {n:'Разгибания ног', p0:[2,'12–15',12,15], p1:[3,'12–15',12,15], p2:[3,'12–15',12,15], rest:90, inc:5, start:'подбор', sub:'Гоблет-присед 3×10–12'},
  {n:'Икры стоя в тренажёре', p0:[2,'12–15',12,15], p1:[3,'12–15',12,15], p2:[3,'12–15',12,15], rest:75, inc:5, start:'подбор', sub:'Икры в жиме ногами'},
  {n:'Скручивания на верхнем блоке', p0:[2,'12–15',12,15], p1:[3,'12–15',12,15], p2:[3,'12–15',12,15], rest:75, inc:2.5, start:'подбор', sub:'Планка 3×40–60 сек'},

/* ================= ФОТО-ДЕМОНСТРАЦИЯ ТЕХНИКИ ================= */
let photoInt = null;
function playPhoto(){
  const b = document.getElementById('tp1'), tag = document.getElementById('ptag');
  if (!b) return;
  let flip = false;
  photoInt = setInterval(() => {
    if (!b.isConnected){ stopAnim(); return; }
    flip = !flip;
    b.style.opacity = flip ? 1 : 0;
    if (tag) tag.textContent = flip ? 'конечное положение' : 'исходное положение';
  }, 1500);
}
function stopAnim(){ if (photoInt){ clearInterval(photoInt); photoInt = null; } }

function phaseOf(w){
  if (w<=2) return 'p0';
  if (deloadWeeks().includes(w)) return 'deload';
  return w <= (WEEKS()>=10?6:5) ? 'p1' : 'p2';
}
const PHASE_NAME = {p0:'Возвращение', p1:'Разгон', deload:'Разгрузка', p2:'Новая территория'};
// тренировки: очередь по порядку (пропустил — делаешь следующую, даты — ориентир)
function buildSessions(){
  const list = [];
  if (PROF.legacyWeek0){
    list.push({w:0, d:new Date(2026,7,18), t:'Push'},
              {w:0, d:new Date(2026,7,20), t:'Pull'},
              {w:0, d:new Date(2026,7,22), t:'Legs'});
  }
  const rot = ['Push','Pull','Legs'];
  let i = 0;
  for (let w = 0; w < WEEKS(); w++)
    for (const dow of [0,1,3,5]) {
      const d = new Date(W1); d.setDate(d.getDate() + w*7 + dow);
      list.push({w:w+1, d, t:rot[i++ % 3]});
    }
  return list.map((s, idx) => {
    const ph = phaseOf(s.w);
    const base = ph==='deload' ? 'p1' : ph;
    const exs = EXDB[s.t].map((e,ei)=>({...e, ei})).filter(e => e[base]).map(e => {
      const [sets, reps, lo, hi] = e[base];
      return ph==='deload'
        ? {ei:e.ei, n:e.n, sets:2, reps:reps.split(' ·')[0]+' · RPE≤6', lo, hi, rest:e.rest, inc:e.inc, hint:'−30% от рабочего', sub:e.sub, deload:true}
        : {ei:e.ei, n:e.n, sets, reps, lo, hi, rest:e.rest, inc:e.inc, hint:s.w<=2?e.start:'', sub:e.sub};
    });
    return {id:idx, w:s.w, date:s.d, type:s.t, phase:ph, exs};
  });
}

function weekOf(d){                       // календарная неделя программы для даты
  if (d < W1) return 0;
  return Math.min(99, Math.floor((d - W1)/864e5/7) + 1);
}
function planWeight(d){                   // плановая траектория на день
  const w = weekOf(d); if (w > WEEKS()) return TARGETS[WEEKS()];
  if (w === 0 && !PROF.legacyWeek0) return TARGETS[0];
  const ws = w===0 ? new Date(2026,7,19) : new Date(W1.getTime()+ (w-1)*7*864e5);
  const we = w===0 ? new Date(2026,7,23) : new Date(ws.getTime()+6*864e5);
  const t0 = w===0 ? PROF.startWeight : TARGETS[w-1], t1 = TARGETS[w];
  const f = (Math.min(Math.max(d-ws,0), we-ws)/864e5 + 1)/((we-ws)/864e5 + 1);
  return t0 + (t1-t0)*f;
}

/* текущий вариант упражнения: 0 = оригинал, 1+ = аналог из ALTS */
function variantOf(sid, ei){
  const s = SESSIONS[sid];
  const perSess = DB.sessions[sid] && DB.sessions[sid].swapEx ? DB.sessions[sid].swapEx[ei] : undefined;
  const idx = perSess != null ? perSess : (DB.swaps[s.type+':'+ei] != null ? DB.swaps[s.type+':'+ei] : 0);
  if (idx === 0){ const e = EXDB[s.type][ei]; return {idx:0, n:e.n, inc:e.inc}; }
  const alt = ALTS[s.type][ei].a[idx-1];
  return alt ? {idx, n:alt.n, inc:alt.inc} : {idx:0, n:EXDB[s.type][ei].n, inc:EXDB[s.type][ei].inc};
}
function weeklyAvg(map, w){       // среднее значения map по календарной неделе w
  let sum = 0, n = 0;
  for (const k in map){ const v = +map[k]; if (!isFinite(v)) continue;
    if (weekOf(fromKey(k)) === w){ sum += v; n++; } }
  return n ? sum/n : null;
}
function lastWeight(){
  const ks = Object.keys(DB.weights).filter(k=>isFinite(+DB.weights[k])).sort();
  return ks.length ? {k:ks[ks.length-1], v:+DB.weights[ks[ks.length-1]]} : null;
}
function avg7(map, endD){         // среднее за 7 дней до endD включительно
  let s=0, n=0;
  for (let i=0;i<7;i++){ const d=new Date(endD.getTime()-i*864e5); const v=+map[key(d)];
    if (isFinite(v) && map[key(d)]!==undefined && map[key(d)]!==null && map[key(d)]!==''){ s+=v; n++; } }
  return n? s/n : null;
}

function foodTotals(k){
  const t = {p:0,f:0,c:0,kcal:0};
  for (const it of foodDay(k).items){ t.p+=it.p*it.q; t.f+=it.f*it.q; t.c+=it.c*it.q; t.kcal+=it.kcal*it.q; }
  return t;
}
/* последняя история по упражнению И его варианту: [{date, sets:[{w,r}], deload}] */
function exHistory(type, ei, limit, vIdx){
  const want = vIdx == null ? 0 : vIdx;
  const out = [];
  for (let i = SESSIONS.length-1; i >= 0; i--){
    const s = SESSIONS[i]; if (s.type !== type) continue;
    const st = DB.sessions[s.id]; if (!st || !st.done) continue;
    const used = (st.vars && st.vars[ei] != null) ? st.vars[ei] : 0;
    if (used !== want) continue;
    const sets = (st.sets && st.sets[ei] || []).filter(x=>x && x.w!=null);
    if (sets.length) out.push({date:st.done, sets, deload:s.phase==='deload'});
    if (out.length >= (limit||3)) break;
  }
  return out;
}
/* подсказка веса: последний вес этого варианта + правило двойной прогрессии */
function exSuggest(sess, ex){
  const v = variantOf(sess.id, ex.ei);
  const hist = exHistory(sess.type, ex.ei, 2, v.idx).filter(h=>!h.deload);
  if (!hist.length){
    if (v.idx !== 0) return {txt:'новый вариант — подбор: верх диапазона = RPE 7', w:null};
    return {txt: ex.hint ? 'старт: '+ex.hint : 'подбор веса: верх диапазона = RPE 7', w:null};
  }
  const last = hist[0];
  const w = Math.max(...last.sets.map(s=>s.w));
  const allTop = last.sets.every(s => s.r >= ex.hi);
  if (ex.deload) return {txt:'разгрузка: '+r1(w*0.7)+' кг (−30%)', w:r1(w*0.7)};
  if (allTop) return {txt:'все подходы по '+ex.hi+' — добавляй: '+r1(w+v.inc)+' кг', w:r1(w+v.inc), up:true};
  return {txt:'прошлый раз: '+last.sets.map(s=>s.w+'×'+s.r).join(' · '), w};
}

  if (done.length){
    const last3 = done.slice(-3).reverse();
    h += `<div class="section-t">Выполнено (${done.length})</div>`;

let timerEnd = null, timerTick = null;
function startTimer(sec, label){
  timerEnd = Date.now() + sec*1000;
  $('#timer-l').textContent = label || 'отдых';
  $('#timerbar').classList.add('show');
  clearInterval(timerTick);
  timerTick = setInterval(tickTimer, 250); tickTimer();
}
function tickTimer(){
  const left = Math.ceil((timerEnd - Date.now())/1000);
  if (left <= 0){
    $('#timer-t').textContent = '0:00'; stopTimer(); beep();
    toast('Отдых окончен — следующий подход'); return;
  }
  $('#timer-t').textContent = Math.floor(left/60)+':'+pad(left%60);
}
function stopTimer(){ clearInterval(timerTick); $('#timerbar').classList.remove('show'); }
$('#timer-x').onclick = stopTimer;
$('#timer-plus').onclick = () => { timerEnd += 30000; tickTimer(); };
function beep(){
  try{ if (navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){}
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,.22,.44].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.24, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.18);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.2);
    });
  }catch(e){}
}

    if (dl != null){

      <td class="num" onclick="askWaist(${w})" style="cursor:pointer">${DB.waist[w]!=null?DB.waist[w]+'':'<span class=c-mut>+</span>'}</td></tr>`;
  }
  h += `<div class="card"><h3>По неделям</h3><table>

      <span class="badge ${st.cls}">${st.txt}</span></div></div>`;
  }).join('');
  $('#view').innerHTML = `<div class="fade-list">${h}</div>`;

function cpStatus(cp){
  if (today() < fromKey(cp.date)) return {txt:'впереди', cls:'b-rest'};
  const avg = weeklyAvg(DB.weights, cp.week);
  if (avg == null) return {txt:'нет данных', cls:'b-rest'};
  if (avg <= cp.wmax && avg >= cp.wmin - 1.5) return {txt:'в графике', cls:'b-legs'};
  if (avg > cp.wmax) return {txt:'+'+(avg-cp.wmax).toFixed(1)+' кг', cls:'b-deload'};
  return {txt:'опережаешь', cls:'b-pull'};
}

/* SVG-график */
let chartCtx = null;
function weightChart(){
  const d0full = PROF.legacyWeek0 ? new Date(2026,7,19) : new Date(Math.min(W1, today()));
  const dEnd = new Date(Math.max(PROG_END, today()));
  let d0 = d0full;
  if (chartMode==='4w'){ d0 = new Date(today().getTime()-27*864e5); if (d0<d0full) d0 = d0full; }
  const days = Math.round((dEnd-d0)/864e5)+1;
  const W = 520, H = 230, L = 38, R = 8, T = 12, B = 24;
  const pw = W-L-R, ph = H-T-B;
  const xs = i => L + pw*i/(days-1);
  const pts = [], plan = [];
  let vmin = 1e9, vmax = -1e9;
  for (let i=0;i<days;i++){
    const dd = new Date(d0.getTime()+i*864e5);
    const pv = planWeight(dd); plan.push(pv);
    vmin = Math.min(vmin,pv); vmax = Math.max(vmax,pv);
    const v = DB.weights[key(dd)];
    if (v!=null && v!=='' && isFinite(+v)){ pts.push({i, v:+v, d:dd}); vmin=Math.min(vmin,+v); vmax=Math.max(vmax,+v); }
  }
  vmin = Math.floor(vmin-0.6); vmax = Math.ceil(vmax+0.6);
  const ys = v => T + ph*(1-(v-vmin)/(vmax-vmin));
  let g = '';
  const step = (vmax-vmin)<=6 ? 1 : ((vmax-vmin)<=12 ? 2 : 3);
  for (let v=vmin; v<=vmax; v+=step)
    g += `<line x1="${L}" y1="${ys(v)}" x2="${W-R}" y2="${ys(v)}" stroke="#2b2b29" stroke-width="1"/>
          <text x="${L-5}" y="${ys(v)+4}" fill="#8a8a85" font-size="10.5" text-anchor="end">${v}</text>`;
  const nx = Math.min(5, days);
  for (let j=0;j<nx;j++){
    const i = Math.round(j*(days-1)/(nx-1));
    const dd = new Date(d0.getTime()+i*864e5);
    g += `<text x="${xs(i)}" y="${H-7}" fill="#8a8a85" font-size="10.5" text-anchor="middle">${fmtD(dd)}</text>`;
  }
  const planPath = plan.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join('');
  const factPath = pts.map((p,j)=>(j?'L':'M')+xs(p.i).toFixed(1)+' '+ys(p.v).toFixed(1)).join('');
  const dots = pts.length<=45 ? pts.map(p=>`<circle cx="${xs(p.i).toFixed(1)}" cy="${ys(p.v).toFixed(1)}" r="3" fill="#3987e5" stroke="#131312" stroke-width="1.5"/>`).join('') : '';
  chartCtx = {d0, days, xs, L, W, R, H, T, ph, pts, plan, vmin, vmax};
  return `<svg class="chart" id="wchart" viewBox="0 0 ${W} ${H}">
    ${g}
    <path d="${planPath}" fill="none" stroke="#8a8a85" stroke-width="2" stroke-dasharray="6 5"/>
    ${factPath?`<path d="${factPath}" fill="none" stroke="#3987e5" stroke-width="2.4"/>`:''}
    ${dots}
    <line id="wc-cross" x1="0" y1="${T}" x2="0" y2="${H-B}" stroke="#f2f2ef" stroke-width="1" opacity="0"/>
  </svg>`;
}
function setupChartTip(){
  const svg = document.getElementById('wchart');
  if (!svg || !chartCtx) return;
  const cross = document.getElementById('wc-cross');
  const tip = document.getElementById('chart-tip');
  const on = ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.touches?ev.touches[0].clientX:ev.clientX) - r.left;
    const rel = Math.max(0, Math.min(1, (x/r.width*chartCtx.W - chartCtx.L)/(chartCtx.W-chartCtx.L-chartCtx.R)));
    const i = Math.round(rel*(chartCtx.days-1));
    const dd = new Date(chartCtx.d0.getTime()+i*864e5);
    const fv = DB.weights[key(dd)];
    cross.setAttribute('x1', chartCtx.xs(i)); cross.setAttribute('x2', chartCtx.xs(i));
    cross.setAttribute('opacity','.35');
    tip.textContent = fmtD(dd)+': '+(fv!=null&&fv!==''?(+fv).toFixed(1)+' кг · ':'')+'ориентир '+chartCtx.plan[i].toFixed(1);
  };
  svg.addEventListener('pointermove', on);
  svg.addEventListener('pointerdown', on);
  svg.addEventListener('pointerleave', ()=>{ cross.setAttribute('opacity','0'); tip.textContent=''; });
}

/* ============ 11. АНАЛИТИКА / РЕКОМЕНДАЦИИ ============ */
function insights(){
  const out = [];
  const d = today(), w = weekOf(d), lw = lastWeight();
  const push = (lvl,t,p,act) => out.push({lvl,t,p,act});
  // 0. старт
  const nWeights = Object.keys(DB.weights).length;
  const nDone = SESSIONS.filter(s=>DB.sessions[s.id]?.done).length;
  if (nWeights<=1 && !nDone){
    push('info','Начни с двух привычек','Утром — вес (5 секунд), в зале — отмечай подходы. Через 2 недели аналитика начнёт давать советы по калориям и весам на штанге.');
  }
  // 1. дисциплина взвешиваний
  let wl7=0; for (let i=0;i<7;i++){ if (DB.weights[key(new Date(d.getTime()-i*864e5))]!=null) wl7++; }
  if (nWeights>2 && wl7<4) push('warn','Мало взвешиваний: '+wl7+' из 7 дней','Среднее за неделю — главный прибор программы. Без 4–5 точек оно врёт, и корректировки калорий будут наугад.');
  // 2. темп по неделям (правила 7.7)
  if (w>=2){
    const a1 = weeklyAvg(DB.weights,w-1), a2 = weeklyAvg(DB.weights,w-2);
    if (a1!=null && a2!=null){
      const dl = a1-a2;
      if (dl<=-0.5 && dl>=-1.6) push('good','Темп идеальный: '+dl.toFixed(2)+' кг за неделю','Ничего не меняй. Калории '+DB.kcalTarget+', белок '+DB.protTarget+' г — работает.');
      else if (dl>-0.5){
        const a0 = w>=3 ? weeklyAvg(DB.weights,w-3) : null;
        const twoSlow = a0!=null && (a2-a0)>-0.5;
        if (twoSlow) push('warn','Вес стоит две недели ('+dl.toFixed(2)+' кг)','Сначала честность подсчёта: масло, соусы, кусочничество, выходные. Если всё честно — правило 7.7: минус 150 ккал или +1500 шагов.',
          {label:'Применить −150 ккал', fn:'adjustKcal(-150, "плато 2 недели")'});
        else push('info','Неделя медленнее плана: '+dl.toFixed(2)+' кг','Одна медленная неделя — шум (вода, соль, стул). Ничего не делай, жди ещё неделю.');
      }
      else if (dl<-1.6 && w>3) push('warn','Слишком быстро: '+dl.toFixed(2)+' кг за неделю','Мышцы дороже скорости. Добавь еды — иначе сила поедет вниз.',
        {label:'Применить +150 ккал', fn:'adjustKcal(150, "слишком быстрый темп")'});
    }
  }
  // 3. рубеж −6–7 кг
  if (lw){
    const lost = PROF.startWeight - lw.v;
    const mile = Math.max(3.5, Math.round(PROF.startWeight*0.051*10)/10);
    const stage = Math.floor(lost/mile);
    const applied = (DB.kcalLog||[]).filter(x=>x.reason&&x.reason.startsWith('рубеж')).length;
    if (stage > applied && stage>0)
      push('info','Рубеж: сброшено уже '+lost.toFixed(1)+' кг','Тело стало легче и тратит меньше. По программе — минус 100 ккал от текущей нормы.',
        {label:'Применить −100 ккал', fn:'adjustKcal(-100, "рубеж '+r1(stage*mile)+' кг")'});
  }
  // 4. отклонение от траектории
  const a7 = avg7(DB.weights, d);
  if (a7!=null && nWeights>6){
    const diff = a7 - planWeight(d);
    if (diff > 1.5) push('warn','Выше траектории на '+diff.toFixed(1)+' кг','Не приговор: траектория — ориентир, а не судья. Проверь подсчёт и шаги; если 2 недели без движения — сработает правило −150 ккал.');
    else if (diff < -1.5) push('info','Опережаешь план на '+(-diff).toFixed(1)+' кг','Если сила в жимах держится — окей. Если поехала вниз, добавь 150 ккал: цель — рекомпозиция, а не сушка.');
  }
  // 5. белок
  const days7 = []; for (let i=0;i<7;i++){ const kk = key(new Date(d.getTime()-i*864e5)); if (DB.food[kk] && DB.food[kk].items.length) days7.push(foodTotals(kk).p); }
  if (days7.length>=3){
    const ap = days7.reduce((a,b)=>a+b,0)/days7.length;
    if (ap < 155) push('warn','Белка мало: в среднем '+Math.round(ap)+' г/день','На дефиците это цена мышц. Добавь 1 белковый модуль в день: творог 250 г или протеин — плюс 30–40 г.');
    else if (ap >= 165) push('good','Белок в норме: '+Math.round(ap)+' г/день','Главный защитник мышц на дефиците работает.');
  }
  // 6. шаги
  const as7 = avg7(DB.steps, d);
  const goal = STEP_GOAL(Math.min(w,WEEKS()));
  if (as7!=null && as7 < goal*0.8) push('info','Шаги проседают: '+Math.round(as7).toLocaleString('ru-RU')+' в день','Цель '+goal.toLocaleString('ru-RU')+'. Самый дешёвый способ добрать — 25–30 минут прогулки вечером или пешком часть дороги.');
  // 7. прогрессия ключевых упражнений
  [['Push',0,'Жим лёжа'],['Legs',0,'Жим ногами'],['Legs',1,'Ягодичный мост']].forEach(([tp,ei,nm])=>{
    const vIdx = DB.swaps[tp+':'+ei] != null ? DB.swaps[tp+':'+ei] : 0;
    const vInc = vIdx===0 ? EXDB[tp][ei].inc : ALTS[tp][ei].a[vIdx-1].inc;
    if (vIdx !== 0) nm = ALTS[tp][ei].a[vIdx-1].n;
    const hist = exHistory(tp, ei, 3, vIdx).filter(h=>!h.deload);
    if (hist.length>=1){
      const ex = EXDB[tp][ei];
      const hi = (ex.p1||ex.p2)[3];
      const last = hist[0], lastW = Math.max(...last.sets.map(s=>s.w));
      if (last.sets.length>1 && last.sets.every(s=>s.r>=hi))
        push('good',nm+': пора добавить вес','Все подходы на верхней границе. Следующая тренировка: '+r1(lastW+vInc)+' кг.');
      else if (hist.length>=3){
        const ws = hist.map(h=>Math.max(...h.sets.map(s=>s.w)));
        if (ws[0]===ws[1] && ws[1]===ws[2])
          push('info',nm+': три тренировки на '+ws[0]+' кг','Если повторы тоже не растут — сними 10% и разгонись заново за 2 недели, либо возьми замену из программы. Застой на дефиците — норма, но не месяц.');
      }
    }
  });
  // 8. разгрузка впереди
  const ns = nextSession();
  if (ns && ns.phase==='deload' ) push('info','Следующая тренировка — разгрузочная','−30% веса, по 2 подхода, RPE ≤ 6. Не «потерянная неделя», а причина, почему недели 8–12 пойдут вверх.');
  // 9. свободные приёмы
  let freeThisWeek = 0;
  for (const kk in DB.freeMeals){ if (weekOf(fromKey(kk))===w) freeThisWeek++; }
  if (freeThisWeek>1) push('warn','Свободных приёмов на неделе: '+freeThisWeek,'По плану — один. Второй превращает дефицит недели в ноль. Не наказывай себя — просто вернись к обычным приёмам.');
  // 10. чек-поинт
  for (const cp of CHECKPOINTS){
    const cd = fromKey(cp.date);
    if (d >= cd && d - cd < 7*864e5){
      const st = cpStatus(cp);
      push(st.cls==='b-legs'?'good':'info','Чек-поинт недели '+cp.week+': '+st.txt,'Ориентир был '+cp.wmin+'–'+cp.wmax+' кг. '+(st.cls==='b-legs'?'Программа работает — продолжаем без изменений.':'Загляни в «Вес» и в правила корректировки — и напиши мне в чат, разберём.'));
    }
  }
  // 11. резервная копия
  const entries = nWeights + nDone + Object.keys(DB.food).length;
  const days = DB.lastExport ? (d - fromKey(DB.lastExport))/864e5 : 999;
  if (entries > 12 && days > 10)
    push('info','Сделай резервную копию','Данные живут в браузере этого устройства. Экспорт в файл — 2 касания в «Ещё → Данные», раз в неделю достаточно.');
  const ord = {bad:0, warn:1, good:2, info:3};
  return out.sort((a,b)=>ord[a.lvl]-ord[b.lvl]);
}
function insightHTML(i){
  return `<div class="insight ${i.lvl}"><b>${i.t}</b><p>${i.p}</p>

}

};

    const file = f.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const obj = JSON.parse(rd.result);
        if (!obj.weights || !obj.sessions) throw 0;
        DB = Object.assign(defaultDB(), obj); save(); toast('Данные восстановлены'); setTimeout(()=>location.reload(), 600);
      }catch(e){ toast('Файл не похож на резервную копию'); }
    };
    rd.readAsText(file);
  };
  f.click();
};

/* ============ 14. АНКЕТА ПЕРВОГО ЗАПУСКА ============ */
let wzSex = 'm', wzWeeks = 12;
window.wzSetSex = function(s){ wzSex = s; document.querySelectorAll('#wz-sex button').forEach(b=>b.classList.toggle('on', b.dataset.s===s)); };
window.wzSetWeeks = function(n){ wzWeeks = n; document.querySelectorAll('#wz-weeks button').forEach(b=>b.classList.toggle('on', +b.dataset.w===n)); };
function wizard(){
  header('PPL трекер', 'настройка программы под тебя · ~1 минута');
  $('#tabs').innerHTML = '';
  $('#view').innerHTML = `<div class="fade-list">
    <div class="card"><h3>Кто тренируется</h3>
      <div class="wlab">Имя</div><input type="text" id="wz-name" placeholder="Как к тебе обращаться">
      <div class="wlab">Пол</div><div class="seg" id="wz-sex">
        <button data-s="m" class="on" onclick="wzSetSex('m')">Мужской</button>
        <button data-s="f" onclick="wzSetSex('f')">Женский</button></div>
      <div class="row" style="gap:8px">
        <div class="grow"><div class="wlab">Возраст</div><input type="number" id="wz-age" inputmode="numeric" placeholder="30"></div>
        <div class="grow"><div class="wlab">Рост, см</div><input type="number" id="wz-h" inputmode="numeric" placeholder="180"></div>
        <div class="grow"><div class="wlab">Вес, кг</div><input type="number" id="wz-w" step="0.1" inputmode="decimal" placeholder="90"></div>
      </div></div>
    <div class="card"><h3>Срок программы</h3>
      <div class="seg" id="wz-weeks">
        <button data-w="8" onclick="wzSetWeeks(8)">8 недель</button>
        <button data-w="12" class="on" onclick="wzSetWeeks(12)">12 недель</button>
        <button data-w="16" onclick="wzSetWeeks(16)">16 недель</button></div>
      <div class="tiny">8 — быстрый цикл без разгрузки · 12 — классика с разгрузкой на 7-й неделе · 16 — длинный, разгрузки на 7-й и 13-й. Фазы, чек-поинты и траектория веса подстроятся под срок.</div></div>
    <div class="card"><h3>Якорные упражнения — по желанию</h3>
      <div class="tiny" style="margin-bottom:6px">Это не тест и не стандарт — просто первые упражнения каждого тренировочного дня. Если помнишь вес, с которым делаешь ~8–10 повторов, впиши: приложение поставит стартовые ~70% от него. Не помнишь — оставь пустым: все веса подберутся по ощущениям на первой неделе (правило «верх диапазона = 3 повтора в запасе» будет прямо в тренировке).</div>
      <div class="row" style="gap:8px">
        <div class="grow"><div class="wlab">Жим лёжа</div><input type="number" id="wz-b" inputmode="numeric" placeholder="—"></div>
        <div class="grow"><div class="wlab">Тяга блока</div><input type="number" id="wz-p" inputmode="numeric" placeholder="—"></div>
      </div>
      <div class="row" style="gap:8px">
        <div class="grow"><div class="wlab">Жим ногами</div><input type="number" id="wz-l" inputmode="numeric" placeholder="—"></div>
        <div class="grow"><div class="wlab">Ягодичный мост</div><input type="number" id="wz-t" inputmode="numeric" placeholder="—"></div>
      </div></div>
    <button class="btn full" onclick="wizardCalc()">Рассчитать программу</button>
    <button class="btn ghost full" onclick="impData()" style="margin-top:6px">У меня есть резервная копия — восстановить</button>
    <div class="tiny" style="margin:10px 2px">Программа: Push/Pull/Legs, 4 тренировки в неделю. Все данные остаются в браузере этого устройства. Приложение не заменяет врача: при хронических состояниях покажи план специалисту.</div>
  </div>`;
}
window.wizardCalc = function(){
  const name = ($('#wz-name').value||'').trim() || 'Атлет';
  const age = parseInt($('#wz-age').value), h = parseInt($('#wz-h').value), w = parseFloat($('#wz-w').value);
  if (!isFinite(age)||age<14||age>90) return toast('Проверь возраст (14–90)');
  if (!isFinite(h)||h<130||h>230) return toast('Проверь рост (130–230 см)');
  if (!isFinite(w)||w<40||w>300) return toast('Проверь вес (40–300 кг)');
  const num = id => { const v = parseFloat($(id).value); return isFinite(v)&&v>0 ? v : null; };
  const starts = {bench:num('#wz-b'), pull:num('#wz-p'), leg:num('#wz-l'), thrust:num('#wz-t')};
  const p = {name, sex:wzSex, age, height:h, startWeight:Math.round(w*10)/10, starts, weeks:wzWeeks};
  const c = calcPlan(p);
  const t = today(); const dow = (t.getDay()+6)%7;
  const monday = new Date(t.getTime() + ((7-dow)%7)*864e5);
  const finish = new Date(monday.getTime() + (wzWeeks*7-1)*864e5);
  window._wzP = p; window._wzC = c; window._wzW1 = key(monday);
  openModal(`<h2>Твоя программа готова</h2>
    <div class="kv" style="margin-top:10px"><span>Поддержка (расход)</span><b>≈${c.maint} ккал</b></div>
    <div class="kv"><span>Цель на день</span><b>${c.kcal} ккал · белок ${c.prot} г</b></div>
    <div class="kv"><span>Траектория ${wzWeeks} недель</span><b>${p.startWeight} → ~${c.targets[wzWeeks]} кг</b></div>
    <div class="kv"><span>Старт → финиш</span><b>${fmtD(monday)} (Пн) → ${fmtD(finish)}</b></div>
    <div class="kv"><span>Тренировок</span><b>${wzWeeks*4} · Push/Pull/Legs</b></div>
    <div class="kv"><span>Стартовые веса</span><b>${starts.bench?('жим '+(Math.round(starts.bench*0.7/2.5)*2.5)+' кг'):'подбор на 1-й неделе'}</b></div>
    <div class="tiny" style="margin-top:8px">Начинаем с ~70% рабочих весов — первые 2 недели лёгкие, это план, а не осторожничание. Калории можно будет менять корректировками.</div>
    <div class="row" style="gap:8px; margin-top:12px">
      <button class="btn sec grow" onclick="closeModal()">Изменить</button>
      <button class="btn grow" onclick="wizardGo()">Начать</button></div>`);
};
window.wizardGo = function(){
  const p = window._wzP, c = window._wzC;
  const stx = {};
  if (p.starts.bench) stx.bench = (Math.round(p.starts.bench*0.7/2.5)*2.5)+' кг';
  if (p.starts.pull) stx.pull = (Math.round(p.starts.pull*0.7/5)*5)+' кг';
  if (p.starts.leg) stx.leg = (Math.round(p.starts.leg*0.6/10)*10)+' кг';
  if (p.starts.thrust) stx.thrust = (Math.round(p.starts.thrust*0.65/5)*5)+' кг';
  PROF = { name:p.name, sex:p.sex, age:p.age, height:p.height, startWeight:p.startWeight,
    w1:window._wzW1, legacyWeek0:false, weeks:p.weeks, starts:p.starts,
    startsText: Object.keys(stx).length?stx:null, targets:c.targets };
  DB.profile = PROF; DB.kcalTarget = c.kcal; DB.protTarget = c.prot;
  DB.weights[key(today())] = p.startWeight;
  save(); closeModal(); buildProgram(); tab='home'; render();
  toast('Программа готова. Старт — '+fmtD(W1)+', а вес уже записан.');
};
/* ============ 15. ЗАГРУЗКА ============ */
(function boot(){
  if (!DB.profile){
    const hasData = (Object.keys(DB.weights||{}).length + Object.keys(DB.sessions||{}).length + Object.keys(DB.food||{}).length) > 0;
    if (hasData){ DB.profile = EGOR; save(); }   // миграция существующего пользователя
  }
  if (DB.profile){ PROF = DB.profile; buildProgram(); render(); }
  else wizard();
})();
/*@JS@*/
</script>
</body>
</html>
