/* ============ 5. ПОМОЩНИКИ ДАННЫХ ============ */
function nextSession(){ return SESSIONS.find(s => !DB.sessions[s.id]?.done && !DB.skips[s.id]) || null; }
function sessionState(id){ return DB.sessions[id] || null; }
function sessDate(s){ return DB.dateOv[s.id] ? fromKey(DB.dateOv[s.id]) : s.date; }
/* текущий вариант упражнения: 0 = оригинал, 1+ = аналог из ALTS */
function variantOf(sid, ei){
  const s = SESSIONS[sid];
  const perSess = DB.sessions[sid] && DB.sessions[sid].swapEx ? DB.sessions[sid].swapEx[ei] : undefined;
  const val = perSess != null ? perSess : (DB.swaps[s.type+':'+ei] != null ? DB.swaps[s.type+':'+ei] : 0);
  if (val === 0 && perSess == null && (PROF.variety||'stable') === 'alt' && ei !== 0 && s.w % 2 === 0){
    const a0 = ALTS[s.type][ei] && ALTS[s.type][ei].a[0];
    if (a0) return {idx:1, n:a0.n, inc:a0.inc||0, bw:a0.bw||0};
  }
  if (val && typeof val === 'object')
    return {idx:'x:'+val.n, n:val.n, inc:val.inc||2.5, bw:val.bw||0, cat:1};
  const idx = val;
  if (idx === 0){ const e = EXDB[s.type][ei]; return {idx:0, n:e.n, inc:e.inc||0, bw:e.bw||0}; }
  const alt = ALTS[s.type][ei].a[idx-1];
  return alt ? {idx, n:alt.n, inc:alt.inc||0, bw:alt.bw||0}
             : {idx:0, n:EXDB[s.type][ei].n, inc:EXDB[s.type][ei].inc||0, bw:EXDB[s.type][ei].bw||0};
}
/* глобальный вариант слота: число (аналог) или объект (каталог) */
function swapMeta(t, ei){
  const raw = DB.swaps[t+':'+ei];
  const base = EXDB[t][ei];
  if (raw && typeof raw === 'object')
    return {vIdx:'x:'+raw.n, ex:{n:raw.n, inc:raw.inc||2.5, bw:raw.bw||0}, base, cat:1};
  const vIdx = raw != null ? raw : 0;
  const ex = vIdx===0 ? base : ((ALTS[t][ei] && ALTS[t][ei].a[vIdx-1]) || base);
  return {vIdx, ex, base};
}
function weeklyAvg(map, w){       // среднее значения map по календарной неделе w
  let sum = 0, n = 0;
  for (const k in map){ const v = +map[k]; if (!isFinite(v)) continue;
    if (weekOf(fromKey(k)) === w){ sum += v; n++; } }
  return n ? sum/n : null;
}
function lastWeight(){
  const ks = Object.keys(DB.weights).filter(k=>isFinite(+DB.weights[k])).sort();
  return ks.length ? {k:ks[ks.length-1], v:+DB.weights[ks[ks.length-1]]} : null;
}
function avg7(map, endD){         // среднее за 7 дней до endD включительно
  let s=0, n=0;
  for (let i=0;i<7;i++){ const d=new Date(endD.getTime()-i*864e5); const v=+map[key(d)];
    if (isFinite(v) && map[key(d)]!==undefined && map[key(d)]!==null && map[key(d)]!==''){ s+=v; n++; } }
  return n? s/n : null;
}
function foodDay(k){ return DB.food[k] || {items:[]}; }
function foodTotals(k){
  const t = {p:0,f:0,c:0,kcal:0};
  for (const it of foodDay(k).items){ t.p+=it.p*it.q; t.f+=it.f*it.q; t.c+=it.c*it.q; t.kcal+=it.kcal*it.q; }
  return t;
}
/* последняя история по упражнению И его варианту: [{date, sets:[{w,r}], deload}] */
function exHistory(type, ei, limit, vIdx){
  const want = vIdx == null ? 0 : vIdx;
  const out = [];
  for (let i = SESSIONS.length-1; i >= 0; i--){
    const s = SESSIONS[i]; if (s.type !== type) continue;
    const st = DB.sessions[s.id]; if (!st || !st.done) continue;
    const used = (st.vars && st.vars[ei] != null) ? st.vars[ei] : 0;
    if (used !== want) continue;
    const sets = (st.sets && st.sets[ei] || []).filter(x=>x && (x.w!=null || x.r!=null));
    if (sets.length) out.push({date:st.done, sets, deload:s.phase==='deload'});
    if (out.length >= (limit||3)) break;
  }
  return out;
}
/* подсказка веса: последний вес этого варианта + правило двойной прогрессии */
function exSuggest(sess, ex){
  const v = variantOf(sess.id, ex.ei);
  const hist = exHistory(sess.type, ex.ei, 2, v.idx).filter(h=>!h.deload);
  if (!hist.length){
    if (v.idx !== 0) return {txt:'новый вариант — подбор: верх диапазона = RPE 7', w:null};
    return {txt: ex.hint ? 'старт: '+ex.hint : 'подбор веса: верх диапазона = RPE 7', w:null};
  }
  const last = hist[0];
  if (v.bw){
    const allTopB = last.sets.every(s => s.r >= ex.hi);
    if (ex.deload) return {txt:'разгрузка: −30–40% повторов, RPE ≤6', w:null};
    if (allTopB) return {txt:'все подходы на верхней границе — усложни вариант (⇄) или добавь повторы', w:null, up:true};
    return {txt:'прошлый раз: '+last.sets.map(s=>s.r).join(' · ')+' повт', w:null};
  }
  const w = Math.max(...last.sets.map(s=>s.w||0));
  const allTop = last.sets.every(s => s.r >= ex.hi);
  if (ex.deload) return {txt:'разгрузка: '+r1(w*0.7)+' кг (−30%)', w:r1(w*0.7)};
  if (allTop) return {txt:'все подходы по '+ex.hi+' — добавляй: '+r1(w+v.inc)+' кг', w:r1(w+v.inc), up:true};
  return {txt:'прошлый раз: '+last.sets.map(s=>s.w+'×'+s.r).join(' · '), w};
}
/* — тренер: совет под шкалой RPE из истории и текущих подходов — */
function coachRPE(sess, ex, st){
  const v = variantOf(sess.id, ex.ei);
  const cur = (st.sets[ex.ei]||[]).filter(Boolean);
  const curRPE = st.rpe[ex.ei];
  const hist = exHistory(sess.type, ex.ei, 2, v.idx).filter(h=>!h.deload);
  const msg = (txt) => `<div class="coach">${ic('bulb',17)}<span>${txt}</span></div>`;
  // сегодня уже что-то сделано и оценено
  if (cur.length >= ex.sets && curRPE){
    if (curRPE <= 7 && !v.bw) return msg(`RPE ${curRPE} — запас большой. <b>В следующий раз: +${v.inc||2.5} кг</b>. Я подскажу в карточке.`);
    if (curRPE <= 7 && v.bw) return msg(`RPE ${curRPE} — легко. <b>Добавь 1-2 повтора</b> или усложни вариант (⇄).`);
    if (curRPE >= 9){
      const anyFail = cur.some(x=>x.fail);
      return msg(`RPE ${curRPE}${anyFail?' с отказом':''} — на пределе. <b>Держи этот вес</b>, пока не сделаешь все подходы на RPE ≤ 8.`);
    }
    return msg(`RPE ${curRPE} — рабочая зона. Так и держи: прибавка придёт, когда станет ≤ 7.`);
  }
  // прошлые сессии: два раза подряд легко → можно смелее
  if (hist.length >= 2){
    const [a, b] = hist;
    const easy = h => h.sets.length && h.sets.every(x=>x.r >= ex.hi);
    if (easy(a) && easy(b) && !v.bw)
      return msg(`Две сессии подряд все подходы на верхней границе. <b>Сегодня смело +${v.inc||2.5} кг</b> — и можно добавить 1 подход.`);
  }
  if (hist.length){
    const last = hist[0];
    const failed = last.sets.some(x=>x.fail);
    if (failed) return msg(`В прошлый раз был отказ. Сегодня <b>первый подход на −5%</b>, дальше по самочувствию.`);
    const short = last.sets.length && last.sets.some(x=>x.r < ex.lo);
    if (short && !v.bw) return msg(`В прошлый раз не добрал повторы (${last.sets.map(x=>x.r).join('·')}). <b>Держи тот же вес</b> — цель добить все подходы до ${ex.lo}+.`);
  }
  return '';
}

function trainList(){
  const skippedList = SESSIONS.filter(s=>DB.skips[s.id] && !DB.sessions[s.id]?.done);
  header('Тренировки', SESSIONS.length+' тренировок за '+WEEKS()+' недель · очередь важнее дат');
  const next = nextSession();
  let h = '';
  let shown = 0;
  const done = SESSIONS.filter(s=>DB.sessions[s.id]?.done);
  if (done.length){
    const last3 = done.slice(-3).reverse();
    h += `<div class="section-t">Выполнено (${done.length})</div>`;
    h += last3.map(s=>{
      const st = DB.sessions[s.id];
      return sessRow(s,'✓ '+fmtD(fromKey(st.done))+(st.dur?' · '+durTxt(st.dur):''));
    }).join('');
  }
  h += `<div class="section-t">Дальше</div>`;
  const left = SESSIONS.filter(x=>!DB.sessions[x.id]?.done && !DB.skips[x.id]).length;
  for (const s of SESSIONS){
    if (DB.sessions[s.id]?.done || DB.skips[s.id]) continue;
    const mark = s===next ? 'следующая' : 'план '+fmtD(sessDate(s));
    h += sessRow(s, mark, s===next);
    if (++shown >= 8) { h += `<div class="tiny" style="text-align:center;margin:8px">… и ещё ${left - shown}</div>`; break; }
  }
  if (skippedList.length){
    h += `<div class="section-t">Пропущенные (${skippedList.length})</div>`;
    h += skippedList.map(s=>sessRow(s, 'пропущена', false, true)).join('');
  }
  $('#view').innerHTML = `<div class="fade-list">${h}</div>`;
}
function sessRow(s, mark, hot, dim){
  return `<div class="card" style="${hot?'border-color:var(--accent-dim);':''}${dim?'opacity:.55;':''}" onclick="trainSelected=${s.id};render()">
    <div class="row"><span class="badge ${badgeCls(s.type)}${s.phase==='deload'?' b-deload':''}">${typeLabel(s.type)}${s.phase==='deload'?' · разгр.':''}</span>
    <div class="grow small">неделя ${s.w} · ${s.exs.length} упр.</div>
    <div class="tiny">${mark}</div></div></div>`;
}
window.setRPE = function(sid, ei, v){

};
window.scrollToEx = function(ei){

};
/* — секундомер тренировки — */
function sessDurTxt(t0, end){
  const m = Math.max(0, Math.floor(((end||Date.now()) - t0)/60000));
  const sN = Math.floor(((end||Date.now()) - t0)/1000)%60;
  return m >= 60 ? Math.floor(m/60)+'ч '+pad(m%60)+'м' : m+':'+pad(sN);
}
function durTxt(mins){ return mins >= 60 ? Math.floor(mins/60)+' ч '+pad(mins%60)+' мин' : mins+' мин'; }
setInterval(() => {

}, 1000);

      const rr = Math.max(...h.sets.map(x=>x.r||0));
      pts.push({d:h.date, top:rr, e1:rr, bw:true});
    }
  }
  let chart, recs = '';
  if (pts.length >= 2) chart = exChart(pts.map(p=>p.top), pts.map(p=>p.d), pts[0].bw);
  else if (pts.length === 1) chart = `<div class="small" style="margin:10px 0">Одна тренировка в истории — график появится после второй.</div>`;
  else chart = `<div class="small" style="margin:10px 0">Пока нет завершённых тренировок с этим упражнением — запиши подходы и заверши тренировку.</div>`;
  if (pts.length){
    if (pts[0].bw){
      const bestR = Math.max(...pts.map(p=>p.top));
      recs = `<div class="section-t">Рекорды</div>
        <div class="small">Макс повторов за подход: <b>${bestR}</b> · ${fmtD(fromKey(pts.find(p=>p.top===bestR).d))}</div>`;
    } else {
      const bestW = Math.max(...pts.map(p=>p.top));
      const bestE = Math.max(...pts.map(p=>p.e1));
      recs = `<div class="section-t">Рекорды</div>
        <div class="small">Макс вес в подходе: <b>${bestW} кг</b> · ${fmtD(fromKey(pts.find(p=>p.top===bestW).d))}</div>
        <div class="small">Расчётный 1ПМ (Эпли): <b>${r1(bestE)} кг</b> · ${fmtD(fromKey(pts.find(p=>p.e1===bestE).d))}</div>`;
    }
  }
  const prevBest = (DB.cycles && DB.cycles.length) ? ((DB.cycles[DB.cycles.length-1].best||{})[v.n] || null) : null;
  openModal(`<h2>${esc(v.n)}</h2><div class="small">прогресс · тренировок в истории: ${pts.length}</div>
    ${chart}${recs}${prevBest?`<div class="small" style="margin-top:4px">Прошлый цикл: макс <b>${prevBest} кг</b></div>`:''}
    <div class="section-t">Заметка к упражнению</div>
    <input type="text" value="${esc(DB.exNotes[noteKey]||'')}" placeholder="настройки тренажёра, хват, нюансы…"
      onchange="(DB.exNotes=DB.exNotes||{})['${noteKey}']=this.value;save()">
    <button class="btn full" style="margin-top:12px" onclick="closeModal()">Понятно</button>`);
};
function exChart(vals, dates, bw){
  const W=300, H=112, p=16;
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const span = (mx - mn) || 1;
  const X = i => p + (W-2*p) * (vals.length===1 ? .5 : i/(vals.length-1));
  const Y = v => H - p - (H-2*p) * ((v-mn)/span);
  const line = vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const dots = vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.2" fill="#0b93a4"/>`).join('');
  return `<div class="card" style="padding:12px 8px 6px;margin:10px 0"><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
    <polyline points="${line}" fill="none" stroke="#0b93a4" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${(X(vals.indexOf(mx))+ (vals.indexOf(mx)>vals.length/2 ? -8 : 8)).toFixed(1)}" y="${(Y(mx)<24?Y(mx)+16:Y(mx)-8).toFixed(1)}" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0b93a4">${mx}${bw?'':' кг'}</text>
    <text x="${p}" y="${H-3}" font-size="9" fill="#7a9aa0">${fmtD(fromKey(dates[0]))}</text>
    <text x="${W-p}" y="${H-3}" font-size="9" text-anchor="end" fill="#7a9aa0">${fmtD(fromKey(dates[dates.length-1]))}</text>
  </svg><div class="tiny" style="text-align:center;margin-top:2px">${bw?'макс повторы за подход':'лучший вес подхода'} по тренировкам</div></div>`;
}

function achStats(){
  let done = 0, sets = 0, ton = 0;
  for (const s of SESSIONS){
    const st = DB.sessions[s.id];
    if (!st) continue;
    if (st.done) done++;
    for (const ei in (st.sets||{})){
      const arr = (st.sets[ei]||[]).filter(Boolean);
      sets += arr.length;
      ton += arr.reduce((a,x)=>a+(x.w||0)*x.r,0);
    }
  }
  const lw = lastWeight();
  return { done, sets, ton, total: SESSIONS.length, streak: streakCount(),
    loss: lw ? Math.max(0, (PROF.startWeight||0) - lw.v) : 0,
    meas: Object.keys(DB.meas||{}).length, photos: Object.keys(DB.photos||{}).length };
}

/* --- кольца, конфетти, карта недели, восстановление, шеринг-карточка --- */
let _ringN = 0;
function ring(val, goal, o){
  o = o || {};
  const size = o.size || 128, sw = o.sw || 11;
  const r = (size - sw) / 2, c = size / 2;
  const L = 2 * Math.PI * r;
  const p = goal > 0 ? Math.min(1, Math.max(0, val / goal)) : 0;
  const over = goal > 0 && val > goal * 1.04;
  const id = 'rg' + (++_ringN);
  const center = o.center != null ? o.center : Math.abs(Math.round(goal - val));
  const sub = o.sub || (over ? 'перебор' : 'осталось');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;flex:none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${over ? '#eda100' : '#0aa2b4'}"/>
      <stop offset="1" stop-color="${over ? '#e07020' : '#14bd8e'}"/></linearGradient></defs>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--ringtrack)" stroke-width="${sw}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="${(L * (1 - p)).toFixed(1)}" transform="rotate(-90 ${c} ${c})"
      style="transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)"/>
    <text x="${c}" y="${c - 2}" text-anchor="middle" font-size="${Math.round(size * .22)}" font-weight="800" fill="var(--text)" style="font-variant-numeric:tabular-nums">${center}</text>
    <text x="${c}" y="${c + size * .13}" text-anchor="middle" font-size="${Math.round(size * .085)}" font-weight="700" fill="var(--muted)">${sub}</text>
  </svg>`;
}
function confetti(){
  const colors = ['#0aa2b4','#14bd8e','#f0b13d','#e97e45','#4f96e8'];
  const h = document.createElement('div');
  h.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';
  for (let i = 0; i < 28; i++){
    const p = document.createElement('i');
    const sz = 6 + Math.random() * 7;
    p.style.cssText = `position:absolute;top:-14px;left:${(Math.random()*100).toFixed(1)}%;width:${sz.toFixed(0)}px;height:${(sz*0.62).toFixed(0)}px;background:${colors[i % colors.length]};border-radius:2px;transform:rotate(${(Math.random()*360)|0}deg);animation:cfall ${(1+Math.random()*0.9).toFixed(2)}s ${(Math.random()*0.35).toFixed(2)}s cubic-bezier(.2,.6,.4,1) forwards;opacity:0`;
    h.appendChild(p);
  }
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 2800);
}
function weekMuscleData(){
  const now = today(), from = new Date(now); from.setDate(from.getDate() - 6);
  const vol = {}, lastT = {};
  for (const s of SESSIONS){
    const st = DB.sessions[s.id];
    if (!st || !st.done) continue;
    const dd = fromKey(st.done);
    if (dd > now) continue;
    const counted = {};
    for (const ei in (st.sets || {})){
      const n = (st.sets[ei] || []).filter(Boolean).length;
      if (!n) continue;
      let nm; try { nm = variantOf(s.id, +ei).n; } catch(e){ continue; }
      const mtags = musFor(nm);
      if (!mtags) continue;
      const tags = mtags.flatMap(t => MZ_ALIAS[t] || [t]);
      for (const tg of tags){
        if (dd >= from) vol[tg] = (vol[tg] || 0) + n;
        if (!lastT[tg] || st.done > lastT[tg]) lastT[tg] = st.done;
      }
    }
  }
  return {vol, lastT};
}
function bodyMapWeekCard(){
  const {vol, lastT} = weekMuscleData();
  const anyVol = Object.keys(vol).length;
  const op = n => n >= 10 ? 1 : n >= 5 ? .68 : n >= 1 ? .4 : 0;
  const side = nm => {
    let z = '';
    for (const id in MZONES[nm]){
      const o = op(vol[id] || 0);
      z += `<path d="${MZONES[nm][id]}" class="mz${o ? ' on' : ''}"${o && o < 1 ? ` style="opacity:${o}"` : ''}/>`;
    }
    return `<div class="mm-side"><svg viewBox="0 0 90 196">${MBODY}${z}</svg><div class="tiny" style="text-align:center;margin-top:2px">${nm === 'front' ? 'спереди' : 'сзади'}</div></div>`;
  };
  let h = `<div class="card"><h3>Карта недели</h3>
    <div class="mm-wrap">${side('front')}${side('back')}</div>
    <div class="tiny" style="text-align:center;margin-top:6px">насыщенность = подходы за 7 дней: <span style="opacity:.4">1–4</span> · <span style="opacity:.7">5–9</span> · 10+</div>`;
  if (!anyVol) h += `<div class="small" style="margin-top:8px">Пока пусто — завершай тренировки, и карта раскрасится.</div>`;
  // восстановление
  const legTags = {quad:1, ham:1, glute:1, calf:1, erectors:1};
  const rows = [];
  const nowK = key(today());
  for (const tg in lastT){
    const days = Math.round((fromKey(nowK) - fromKey(lastT[tg])) / 864e5);
    if (days > 3) continue;
    const need = legTags[tg] ? 2 : 1.5;
    const ready = days >= need;
    const pct = Math.min(100, Math.round(days / need * 100));
    rows.push({tg, days, ready, pct});
  }
  if (rows.length){
    rows.sort((a,b) => a.pct - b.pct);
    h += `<div class="section-t" style="margin:14px 0 4px">Восстановление</div>` +
      rows.slice(0, 6).map(r => `<div class="minibar"><div class="kv"><span>${MUS_RU[r.tg] || r.tg}</span><span class="${r.ready ? 'c-good' : 'c-mut'}">${r.ready ? 'готова ✓' : (r.days === 0 ? 'тренирована сегодня' : 'восстанавливается')}</span></div>
        <div class="bar"><i class="${r.ready ? 'good' : ''}" style="width:${Math.max(8, r.pct)}%"></i></div></div>`).join('') +
      `<div class="tiny" style="margin-top:8px">Мелкие группы ~36 ч, ноги и спина ~48 ч. Остальные мышцы отдохнули и готовы.</div>`;
  }

let timerEnd = null, timerTick = null, timerTotal = 0;
function startTimer(sec, label){
  timerEnd = Date.now() + sec*1000;
  timerTotal = sec*1000;
  $('#timer-l').textContent = label || 'отдых';
  $('#timerbar').classList.add('show');
  clearInterval(timerTick);
  timerTick = setInterval(tickTimer, 250); tickTimer();
}
function tickTimer(){
  const left = Math.ceil((timerEnd - Date.now())/1000);
  if (left <= 0){
    $('#timer-t').textContent = '0:00'; stopTimer(); closeRestFull(); beep();
    toast('Отдых окончен — следующий подход'); return;
  }
  const txt = Math.floor(left/60)+':'+pad(left%60);
  $('#timer-t').textContent = txt;
  const fill = $('#timer-fill');
  if (fill && timerTotal) fill.style.width = Math.max(0, (timerEnd-Date.now())/timerTotal*100)+'%';
  const ft = $('#rest-full-t');
  if (ft && $('#rest-full').classList.contains('show')){
    ft.textContent = txt;
    const arc = $('#rest-arc');
    if (arc && timerTotal) arc.style.strokeDashoffset = (552.9 * (1 - Math.max(0,(timerEnd-Date.now())/timerTotal))).toFixed(1);
  }
}
function stopTimer(){ clearInterval(timerTick); $('#timerbar').classList.remove('show'); }
window.openRestFull = function(){
  if (timerEnd == null || timerEnd - Date.now() <= 0) return;
  $('#rest-full-l').textContent = $('#timer-l').textContent;
  $('#rest-full').classList.add('show'); tickTimer();
};
window.closeRestFull = function(){ $('#rest-full').classList.remove('show'); };
window.nudgeTimer = function(ds){
  if (timerEnd == null) return;
  timerEnd = Math.max(Date.now() + 1000, timerEnd + ds*1000);
  timerTotal = Math.max(timerTotal + ds*1000, timerEnd - Date.now());
  tickTimer();
};
$('#timer-x').onclick = stopTimer;
$('#timer-plus').onclick = () => { nudgeTimer(30); };
function beep(){
  try{ if (navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){}
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,.22,.44].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.24, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.18);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.2);
    });
  }catch(e){}
}

/* ---- якоря силы: авто (по данным) или вручную ---- */
function anchorsOf(){
  const res = {};
  for (const t of TYPES()){
    const man = PROF.anchors;
    if (man && man.mode==='manual' && man[t]!=null && EXDB[t][man[t]]){ res[t] = man[t]; continue; }
    let best = 0, bestN = 1;
    EXDB[t].forEach((e, ei) => {
      let n = 0;
      for (const s of SESSIONS){
        if (s.type!==t) continue;
        const st = DB.sessions[s.id];
        if (st && st.done && (st.sets[ei]||[]).filter(Boolean).length) n++;
      }
      if (n > bestN){ best = ei; bestN = n; }
    });
    res[t] = best;
  }
  return res;
}
function anchorInfo(t, ei){
  const sm = swapMeta(t, ei);
  const vIdx = sm.vIdx, base = sm.base, alt = sm.ex;
  const bw = alt.bw || (vIdx===0 && base.bw);
  const hist = exHistory(t, ei, 999, vIdx).filter(x=>!x.deload);
  if (!hist.length) return {name:alt.n, txt:'ещё нет записей', delta:null, bw};
  const val = x => bw ? Math.max(...x.sets.map(s=>s.r||0)) : Math.max(...x.sets.map(s=>s.w||0));
  const first = val(hist[hist.length-1]), lastV = val(hist[0]);
  const unit = bw ? 'повт' : 'кг';
  const d = first>0 ? Math.round((lastV-first)/first*100) : 0;
  return {name:alt.n, bw, delta:d,
    txt: first===lastV ? lastV+' '+unit : first+' → '+lastV+' '+unit+(d ? ' ('+(d>0?'+':'')+d+'%)' : '')};
}

let chartCtx = null;
function CC(){ return (DB.theme==='dark')
  ? {grid:'#22333a', axis:'#78908f', plan:'#78908f', dot:'#0a1215', line:'#2ec6d1'}
  : {grid:'#d8e6e7', axis:'#7d989e', plan:'#93aab0', dot:'#ffffff', line:'#0b93a4'}; }
function weightChart(){
  const d0full = PROF.legacyWeek0 ? new Date(2026,7,19) : new Date(Math.min(W1, today()));
  const dEnd = new Date(Math.max(PROG_END, today()));
  let d0 = d0full;
  if (chartMode==='4w'){ d0 = new Date(today().getTime()-27*864e5); if (d0<d0full) d0 = d0full; }
  const days = Math.round((dEnd-d0)/864e5)+1;
  const W = 520, H = 230, L = 38, R = 8, T = 12, B = 24;
  const pw = W-L-R, ph = H-T-B;
  const xs = i => L + pw*i/(days-1);
  const pts = [], plan = [];
  let vmin = 1e9, vmax = -1e9;
  for (let i=0;i<days;i++){
    const dd = new Date(d0.getTime()+i*864e5);
    const pv = planWeight(dd); plan.push(pv);
    vmin = Math.min(vmin,pv); vmax = Math.max(vmax,pv);
    const v = DB.weights[key(dd)];
    if (v!=null && v!=='' && isFinite(+v)){ pts.push({i, v:+v, d:dd}); vmin=Math.min(vmin,+v); vmax=Math.max(vmax,+v); }
  }
  vmin = Math.floor(vmin-0.6); vmax = Math.ceil(vmax+0.6);
  const ys = v => T + ph*(1-(v-vmin)/(vmax-vmin));
  let g = '';
  const step = (vmax-vmin)<=6 ? 1 : ((vmax-vmin)<=12 ? 2 : 3);
  for (let v=vmin; v<=vmax; v+=step)
    g += `<line x1="${L}" y1="${ys(v)}" x2="${W-R}" y2="${ys(v)}" stroke="${CC().grid}" stroke-width="1"/>
          <text x="${L-5}" y="${ys(v)+4}" fill="${CC().axis}" font-size="10.5" text-anchor="end">${v}</text>`;
  const nx = Math.min(5, days);
  for (let j=0;j<nx;j++){
    const i = Math.round(j*(days-1)/(nx-1));
    const dd = new Date(d0.getTime()+i*864e5);
    g += `<text x="${xs(i)}" y="${H-7}" fill="${CC().axis}" font-size="10.5" text-anchor="middle">${fmtD(dd)}</text>`;
  }
  const planPath = plan.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join('');
  const factPath = pts.map((p,j)=>(j?'L':'M')+xs(p.i).toFixed(1)+' '+ys(p.v).toFixed(1)).join('');
  const areaPath = pts.length>1
    ? factPath+`L${xs(pts[pts.length-1].i).toFixed(1)} ${H-B}L${xs(pts[0].i).toFixed(1)} ${H-B}Z` : '';
  const dots = pts.length<=45 ? pts.map(p=>`<circle cx="${xs(p.i).toFixed(1)}" cy="${ys(p.v).toFixed(1)}" r="3" fill="${CC().line}" stroke="${CC().dot}" stroke-width="1.5"/>`).join('') : '';
  const lastP = pts.length ? pts[pts.length-1] : null;
  const pulse = lastP ? `<circle class="cpulse" cx="${xs(lastP.i).toFixed(1)}" cy="${ys(lastP.v).toFixed(1)}" r="5" fill="none" stroke="${CC().line}" stroke-width="2"/>
    <circle cx="${xs(lastP.i).toFixed(1)}" cy="${ys(lastP.v).toFixed(1)}" r="4" fill="${CC().line}" stroke="${CC().dot}" stroke-width="1.5"/>` : '';
  chartCtx = {d0, days, xs, L, W, R, H, T, ph, pts, plan, vmin, vmax};
  return `<svg class="chart" id="wchart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${CC().line}" stop-opacity=".26"/>
      <stop offset="1" stop-color="${CC().line}" stop-opacity="0"/>
    </linearGradient></defs>
    ${g}
    ${areaPath?`<path d="${areaPath}" fill="url(#wgrad)"/>`:''}
    <path d="${planPath}" fill="none" stroke="${CC().plan}" stroke-width="2" stroke-dasharray="6 5"/>
    ${factPath?`<path d="${factPath}" fill="none" stroke="${CC().line}" stroke-width="2.4"/>`:''}
    ${dots}
    ${pulse}
    <line id="wc-cross" x1="0" y1="${T}" x2="0" y2="${H-B}" stroke="#f2f2ef" stroke-width="1" opacity="0"/>
  </svg>`;
}
function setupChartTip(){
  const svg = document.getElementById('wchart');
  if (!svg || !chartCtx) return;
  const cross = document.getElementById('wc-cross');
  const tip = document.getElementById('chart-tip');
  const on = ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.touches?ev.touches[0].clientX:ev.clientX) - r.left;
    const rel = Math.max(0, Math.min(1, (x/r.width*chartCtx.W - chartCtx.L)/(chartCtx.W-chartCtx.L-chartCtx.R)));
    const i = Math.round(rel*(chartCtx.days-1));
    const dd = new Date(chartCtx.d0.getTime()+i*864e5);
    const fv = DB.weights[key(dd)];
    cross.setAttribute('x1', chartCtx.xs(i)); cross.setAttribute('x2', chartCtx.xs(i));
    cross.setAttribute('opacity','.35');
    tip.textContent = fmtD(dd)+': '+(fv!=null&&fv!==''?(+fv).toFixed(1)+' кг · ':'')+'ориентир '+chartCtx.plan[i].toFixed(1);
  };
  svg.addEventListener('pointermove', on);
  svg.addEventListener('pointerdown', on);
  svg.addEventListener('pointerleave', ()=>{ cross.setAttribute('opacity','0'); tip.textContent=''; });
}

  if (!qs.length) return true;

/* ---- приёмы дня ---- */
const MEAL_DEF = [
 {id:'b',  n:'Завтрак', w:[6,10.5],   share:1.0},
 {id:'s1', n:'Перекус', w:[10.5,12.5],share:0.4, opt:1},
 {id:'l',  n:'Обед',    w:[12.5,15.5],share:1.15},
 {id:'s2', n:'Перекус', w:[15.5,18],  share:0.4, opt:1},
 {id:'d',  n:'Ужин',    w:[18,21.5],  share:1.0},
 {id:'s3', n:'Поздний перекус', w:[21.5,23.5], share:0.35, opt:1},
];
function activeMeals(k){
  const day = DB.food[k] || {};
  return MEAL_DEF.filter(m => !m.opt || (day.snacks && day.snacks[m.id]) || (day.items||[]).some(x=>x.meal===m.id));
}
function mealTargets(k){
  const act = activeMeals(k);
  const S = act.reduce((a,m)=>a+m.share, 0);
  const out = {};
  act.forEach(m => out[m.id] = {kcal: Math.round(DB.kcalTarget*m.share/S/10)*10, prot: Math.round(DB.protTarget*m.share/S/5)*5});
  return out;
}
function mealItems(k, mid){
  return (DB.food[k]?.items||[]).map((x,i)=>({x,i})).filter(o=>o.x.meal===mid);
}
function mealEaten(k, mid){
  return mealItems(k,mid).reduce((a,o)=>({kcal:a.kcal+o.x.kcal*o.x.q, p:a.p+o.x.p*o.x.q}), {kcal:0,p:0});
}
window.addSnack = function(mid){
  if (!DB.food[foodDate]) DB.food[foodDate] = {items:[]};
  DB.food[foodDate].snacks = DB.food[foodDate].snacks || {};
  DB.food[foodDate].snacks[mid] = 1;
  save(); render();
};
/* ---- фокус дня: чего не хватает ---- */
function dayFocus(k){
  const t = foodTotals(k);
  const needP = DB.protTarget - t.p, needK = DB.kcalTarget - t.kcal;
  const fr = fatRange();
  if (needK <= 100) return {mode:'done', txt:'Калории дня набраны — дальше только вода/овощи, если голод.'};
  if (needP > 25 && needP*4/Math.max(needK,1) > 0.38)
    return {mode:'protein', txt:'Фокус — белок: осталось '+Math.round(needP)+' г. Выбирай курицу, творог, рыбу, яйца, тунца.'};
  if (t.f > fr[1])
    return {mode:'lowfat', txt:'Жиры уже набраны ('+Math.round(t.f)+' г) — дальше постное: белая рыба, творог, овощи, крупы.'};
  if (t.c > (DB.kcalTarget - DB.protTarget*4 - fr[0]*9)/4)
    return {mode:'lowcarb', txt:'Углеводы дня почти выбраны — следующий приём: белок + овощи, без гарнира.'};
  return {mode:'balance', txt:'Идёшь ровно: белок + гарнир + овощи в каждый приём.'};
}
function nextMealInfo(k){
  const now = new Date(); const hr = now.getHours() + now.getMinutes()/60;
  const tg = mealTargets(k);
  for (const m of activeMeals(k)){
    if (hr > m.w[1]) continue;
    const e = mealEaten(k, m.id);
    if (e.kcal >= (tg[m.id]?.kcal||0)*0.6) continue;
    const left = Math.max(0, Math.round(((tg[m.id]?.kcal||0) - e.kcal)/10)*10);
    const when = hr < m.w[0] ? 'с '+String(Math.floor(m.w[0])).padStart(2,'0')+':'+(m.w[0]%1?'30':'00') : 'сейчас';
    return {m, txt: m.n+' — '+when+' · ~'+left+' ккал, белка ~'+Math.max(0, (tg[m.id]?.prot||0)-Math.round(e.p))+' г'};
  }
  return null;
}
/* ---- кладовка и рецепты ---- */
function pantryOn(id){ return !!(DB.pantry && DB.pantry[id]) && !excluded(id); }
function ingHave(spec){ return pantryOn(spec[0]) || (spec[3]||[]).some(pantryOn); }
function ingResolve(spec){
  if (pantryOn(spec[0])) return spec[0];
  const alt = (spec[3]||[]).find(pantryOn); if (alt) return alt;
  if (!excluded(spec[0])) return spec[0];
  return (spec[3]||[]).find(x=>!excluded(x)) || spec[0];
}
function recipeCalc(r, q){
  const t = {kcal:0,p:0,f:0,c:0};
  for (const s of r.ing){
    if (s[2] && !ingHave(s)) continue;              // опциональный и нет — пропуск
    const ing = ING_BY[ingResolve(s)];
    const g = s[1]*q/100;
    t.kcal += ing[3]*g; t.p += ing[4]*g; t.f += ing[5]*g; t.c += ing[6]*g;
  }
  return t;
}
function recipesFor(mid){
  const key = mid[0]==='s' ? 's' : mid;
  const focus = dayFocus(foodDate).mode;
  const tg = mealTargets(foodDate)[mid] || {kcal:500};
  const eaten = mealEaten(foodDate, mid);
  const targetK = Math.max(250, tg.kcal - eaten.kcal);
  const out = [];
  for (const r of recipesAllowed()){
    if (!(r.m.includes(key) || (key==='s' && r.m.includes('b')))) continue;
    if (!r.ing.every(s => s[2] || ingHave(s))) continue;
    const base = recipeCalc(r, 1);
    let q = Math.round(Math.min(1.5, Math.max(0.5, targetK/Math.max(base.kcal,1)))*4)/4;
    const t = recipeCalc(r, q);
    const optAll = r.ing.filter(s=>s[2]).length;
    const optHave = r.ing.filter(s=>s[2] && ingHave(s)).length;
    let score = 1 + (optAll ? optHave/optAll : 0.5);
    if (focus==='protein') score += (t.p*4/Math.max(t.kcal,1))*3;
    if (focus==='lowcarb') score -= (t.c*4/Math.max(t.kcal,1))*2;
    if (focus==='lowfat') score -= (t.f*9/Math.max(t.kcal,1))*2;
    if (r.boost==='p' && focus==='protein') score += .6;
    if (r.gen) score -= .25;
    if (r.my) score += .7;
    out.push({r, q, t, score});
  }
  return out.sort((a,b)=>b.score-a.score);
}

window.rcList = function(mid, q){
  q = (q||'').trim().toLowerCase();
  const key = mid[0]==='s' ? 's' : mid;
  let list, note = '';
  if (!q){
    list = recipesFor(mid).slice(0, 12).map(o => ({...o, miss: []}));
    note = list.length ? `показаны лучшие ${list.length} — ищи по названию среди всех ${recipesAllowed().length}` : '';
  } else {
    const tg = mealTargets(foodDate)[mid] || {kcal:500};
    list = recipesAllowed()
      .filter(r => (r.m.includes(key) || (key==='s' && r.m.includes('b'))) && r.n.toLowerCase().includes(q))
      .slice(0, 15)
      .map(r => {
        const base = recipeCalc(r, 1);
        const qq = Math.round(Math.min(1.5, Math.max(0.5, Math.max(250, tg.kcal)/Math.max(base.kcal,1)))*4)/4;
        return {r, q:qq, t:recipeCalc(r, qq), miss: r.ing.filter(s=>!s[2] && !ingHave(s)).map(s=>ING_BY[s[0]][1])};
      });
  }
  $('#rc-list').innerHTML = (note?`<div class="tiny" style="margin:6px 2px">${note}</div>`:'') +
    (list.length ? list.map((o,ix) => {
      const ingTxt = o.r.ing.map(s => {
        if (s[2] && !ingHave(s)) return null;
        const ing = ING_BY[ingResolve(s)];
        const g = Math.round(s[1]*o.q);
        const un = ing[7] ? Math.max(1, Math.round(g/ing[7]))+' шт' : g+' г';
        return esc(ing[1])+' '+un;
      }).filter(Boolean).join(' · ');
      return `<div class="card" style="margin:10px 0">
        <b style="font-size:15px">${recEmo(o.r)} ${o.r.my?'★ ':''}${esc(o.r.n)}</b>
        <div class="tiny" style="margin-top:2px">${o.r.t} мин · ${Math.round(o.t.kcal)} ккал · Б${Math.round(o.t.p)} Ж${Math.round(o.t.f)} У${Math.round(o.t.c)}${o.q!==1?' · порция ×'+o.q:''}</div>
        <div class="tiny" style="margin-top:6px">${ingTxt}</div>
        ${o.miss.length?`<div class="tiny c-warn" style="margin-top:4px">не хватает: ${o.miss.map(esc).join(', ')}</div>`:''}
        <div id="rc-steps-${ix}" style="display:none" class="small">${o.r.s.map((st,i)=>`<div class="tiny" style="margin-top:5px">${i+1}. ${esc(st)}</div>`).join('')}</div>
        <div class="row" style="gap:8px;margin-top:9px">
          <button class="btn sec sm grow" onclick="const e=document.getElementById('rc-steps-${ix}');e.style.display=e.style.display==='none'?'':'none'">Готовка</button>
          <button class="btn sec sm grow" onclick="tweakDlg('${o.r.id}',${o.q},'${mid}')">Настроить</button></div>
        <div class="row" style="gap:8px;margin-top:8px">
          <button class="btn sec sm grow" onclick="shopAdd('${o.r.id}',${o.q})">В покупки</button>
          <button class="btn sm grow" onclick="eatRecipe('${o.r.id}',${o.q},'${mid}')">В дневник</button></div></div>`;
    }).join('') : `<div class="card small">${q?'Ничего не нашлось по запросу.':'Из отмеченных продуктов ничего не собрать. Добавь базовые вещи: яйца, крупу, овощи, что-то белковое.'}</div>`);
};
window.eatRecipe = function(rid, q, mid){
  const r = findRecipe(rid); if (!r) return;
  const t = recipeCalc(r, q);
  if (!DB.food[foodDate]) DB.food[foodDate] = {items:[]};
  DB.food[foodDate].items.push({n:r.n, p:Math.round(t.p), f:Math.round(t.f), c:Math.round(t.c), kcal:Math.round(t.kcal), q:1, meal:mid, recipe:1});
  noteUse(r.ing.map(s=>[ingResolve(s), s[1]]), q);
  save(); closeModal(); render(); toast(r.n+' — в дневнике: '+((MEAL_DEF.find(m=>m.id===mid)||{}).n||'приём').toLowerCase());
};

/* онлайн-поиск по названию: Open Food Facts */
const _offSearch = {};
window.psNet = async function(q){
  const box = $('#ps-net'); if (!box) return;
  const tok = (window._psNetTok = (window._psNetTok||0) + 1);
  const render = list => {
    if (tok !== window._psNetTok) return;
    const b = $('#ps-net'); if (!b) return;
    window._psNetQ = q;
    b.innerHTML = list.length
      ? `<div class="tiny" style="margin:10px 2px 2px">Из интернета · Open Food Facts</div>` + list.map((x,i) =>
        `<button class="varrow" style="margin:6px 0;flex-direction:row;align-items:center;gap:10px" onclick="psNetPick(${i})">
          ${x.img?`<img src="${x.img}" style="width:34px;height:34px;object-fit:cover;border-radius:9px;flex:none;background:var(--card2)" loading="lazy" onerror="this.style.display='none'">`:`<span style="font-size:22px;flex:none">🛒</span>`}
          <span class="grow" style="text-align:left"><b style="font-size:14px">${esc(x.n)}</b>
          <span style="display:block">${x.kcal} ккал · Б${x.p} на 100 г${x.unitG?' · порция '+x.unitG+' г':''}</span></span></button>`).join('')
      : `<div class="tiny" style="margin:10px 2px">В интернете по «${esc(q)}» не нашлось — попробуй иначе или добавь по штрихкоду.</div>`;
  };
  if (_offSearch[q]){ render(_offSearch[q]); return; }
  box.innerHTML = '<div class="tiny" style="margin:10px 2px">ищу в интернете…</div>';
  try {
    const r = await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=8&sort_by=unique_scans_n&fields=code,product_name,product_name_ru,brands,nutriments,serving_quantity,image_front_small_url');
    if (tok !== window._psNetTok) return;
    const j = await r.json();
    const list = (j.products||[]).map(pr => {
      const nu = pr.nutriments || {};
      const servG = parseFloat(pr.serving_quantity) || 0;
      const n4 = bcNutr(nu, servG);
      const name = pr.product_name_ru || pr.product_name || '';
      if (!name || !pr.code) return null;
      if (!n4.kcal && !n4.p && !n4.f && !n4.c) return null;
      return {id:'off'+pr.code, n: name + (pr.brands ? ' · '+pr.brands.split(',')[0].trim() : ''), cat:'ready',
        kcal:n4.kcal, p:n4.p, f:n4.f, c:n4.c, unitG: Math.round(servG)||0, img: pr.image_front_small_url||''};
    }).filter(Boolean).slice(0,6);
    _offSearch[q] = list;
    render(list);
  } catch(e){
    if (tok !== window._psNetTok) return;
    const b = $('#ps-net');
    if (b) b.innerHTML = '<div class="tiny" style="margin:10px 2px">Интернет-поиск сейчас недоступен — работаю по своей базе.</div>';
  }
};

function bcHit(code){
  code = String(code||'').replace(/\D/g,'');
  if (!code || code.length < 8) return;
  const now = Date.now();
  if (window._bcLast === code && now - (window._bcLastT||0) < 4000) return;
  window._bcLast = code; window._bcLastT = now;
  try { if (navigator.vibrate) navigator.vibrate(80); } catch(e){}
  if ($('#bc-in')) $('#bc-in').value = code;
  bcStop();
  bcLookup(code);
}
window.bcTorch = async function(){
  try {
    window._bcTorchOn = !window._bcTorchOn;
    await window._bcTrack.applyConstraints({advanced:[{torch: window._bcTorchOn}]});
  } catch(e){ toast('Фонарик не поддерживается на этом устройстве'); }
};
async function bcLoadZXing(){
  if (window.ZXing || window._bcZxTried) return;
  window._bcZxTried = 1;
  await new Promise(res => {
    const sc = document.createElement('script');
    sc.src = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';
    sc.onload = res; sc.onerror = res;
    document.head.appendChild(sc);
    setTimeout(res, 7000);
  });
}
window.bcFromPhoto = async function(inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  const out = $('#bc-out'); if (out) out.innerHTML = '<div class="small" style="margin-top:8px">Распознаю фото…</div>';
  try {
    const bmp = await createImageBitmap(f);
    let code = null;
    if ('BarcodeDetector' in window){
      try {
        const det = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
        const codes = await det.detect(bmp);
        if (codes.length) code = codes[0].rawValue;
      } catch(e){}
    }
    if (!code){
      await bcLoadZXing();
      if (window.ZXing){
        const cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height;
        cv.getContext('2d').drawImage(bmp, 0, 0);
        try {
          const reader = new window.ZXing.BrowserMultiFormatReader();
          const res = await reader.decodeFromImageUrl(cv.toDataURL('image/jpeg', .92));
          if (res) code = res.getText();
        } catch(e){}
      }
    }
    if (code) bcHit(code);
    else if (out) out.innerHTML = '<div class="insight warn" style="margin-top:8px"><p style="margin:0">Не разглядел штрихкод. Сними ближе, ровнее и при свете — или введи цифры.</p></div>';
  } catch(e){
    if (out) out.innerHTML = '<div class="insight warn" style="margin-top:8px"><p style="margin:0">Не смог обработать фото — введи цифры вручную.</p></div>';
  }
};
/* КБЖУ из OFF: сначала на 100 г, иначе пересчёт из порции */
function bcNutr(nu, servG){
  const per100 = k => nu[k+'_100g'];
  const perServ = k => (servG > 0 && nu[k+'_serving'] != null) ? nu[k+'_serving']*100/servG : null;
  const pick = k => { const v = per100(k); return (v != null && v !== '') ? +v : perServ(k); };
  let kcal = pick('energy-kcal');
  if (kcal == null){ const kj = pick('energy'); kcal = kj != null ? kj/4.184 : null; }
  return {kcal: kcal != null ? Math.round(kcal) : 0,
          p: r1(pick('proteins')||0), f: r1(pick('fat')||0), c: r1(pick('carbohydrates')||0)};
}
function bcFail(msg){
  const out = $('#bc-out'); if (!out) return;
  out.innerHTML = `<div class="insight warn" style="margin-top:8px"><p style="margin:0">${msg}</p></div>
    <button class="btn sec full sm" style="margin-top:8px" onclick="closeModal();foodCustom(window._bcMeal||null)">Внести вручную (КБЖУ с упаковки)</button>`;
}
window.bcLookup = async function(code){
  code = String(code || ($('#bc-in') ? $('#bc-in').value : '')).replace(/\D/g,'');
  if (!code || code.length < 8) return toast('Введи 8–13 цифр штрихкода');
  const out = $('#bc-out'); if (!out) return;
  // уже сканировал раньше — берём из своих, без сети
  const cached = (DB.myProds||[]).find(m => m.id === 'off'+code);
  if (cached){ window._bcFound = cached;
    out.innerHTML = `<div class="card" style="margin-top:10px"><div class="row" style="gap:10px">
      ${cached.img?`<img src="${cached.img}" style="width:52px;height:52px;object-fit:cover;border-radius:12px;flex:none;background:var(--card2)" onerror="this.style.display='none'">`:''}

      <button class="btn full sm" style="margin-top:10px" onclick="bcSave()">Взвесить и в дневник</button></div>`;
    return; }
  const tok = (window._bcTok = (window._bcTok||0) + 1);   // защита от гонки двух запросов
  out.innerHTML = '<div class="small" style="margin-top:8px">Ищу товар…</div>';
  let r = null, lastErr = null;
  for (let att = 0; att < 3; att++){
    try {
      r = await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,product_name_ru,brands,nutriments,serving_quantity,quantity,image_front_small_url');
      lastErr = null;
      if (r.ok || r.status === 404) break;                 // 429/5xx — подождать и повторить
    } catch(e){ lastErr = e; }
    if (tok !== window._bcTok) return;
    if (att < 2) await new Promise(res => setTimeout(res, 900*(att+1)));
  }
  if (tok !== window._bcTok) return;
  if (lastErr || !r){ bcFail('Нет сети. Штрихкод работает онлайн — а пока можно внести вручную.'); return; }
  let j = null;
  try { j = await r.json(); } catch(e){ j = null; }
  if (tok !== window._bcTok) return;
  if (r.status === 404 || !j || !j.product){
    bcFail('Этого штрихкода нет в базе Open Food Facts (туда попадает не всё, особенно локальные марки).'); return;
  }
  if (!r.ok){ bcFail('База отвечает с перебоями (код '+r.status+'). Подожди полминуты и нажми «Найти» ещё раз.'); return; }
  const pr = j.product, nu = pr.nutriments || {};
  const name = pr.product_name_ru || pr.product_name || ('Товар '+code);
  const servG = parseFloat(pr.serving_quantity) || 0;
  const n4 = bcNutr(nu, servG);
  if (!n4.kcal && !n4.p && !n4.f && !n4.c){
    bcFail('Товар найден («'+esc(name)+'»), но КБЖУ в базе не заполнены.'); return;
  }
  window._bcFound = {id:'off'+code, n: name + (pr.brands ? ' · '+pr.brands.split(',')[0].trim() : ''), cat:'ready',
    kcal:n4.kcal, p:n4.p, f:n4.f, c:n4.c, unitG: Math.round(servG)||0, img: pr.image_front_small_url||''};
  out.innerHTML = `<div class="card" style="margin-top:10px"><div class="row" style="gap:10px">
    ${window._bcFound.img?`<img src="${window._bcFound.img}" style="width:52px;height:52px;object-fit:cover;border-radius:12px;flex:none;background:var(--card2)" onerror="this.style.display='none'">`:''}
    <div class="grow"><b>${esc(window._bcFound.n)}</b>
    <div class="tiny" style="margin-top:2px">${n4.kcal} ккал · Б${n4.p} · Ж${n4.f} · У${n4.c} — на 100 г${servG?' · порция '+Math.round(servG)+' г':''}</div></div></div>
    <button class="btn full sm" style="margin-top:10px" onclick="bcSave()">Сохранить и взвесить</button></div>`;
};

const GNAME = {rice:'Рис', buckwheat:'Гречка', pasta:'Паста', potato:'Картофель'};
function genRecipes(){
  const out = [];
  let n = 0;
  const add = (name, m, t, ing, s, boost) => out.push({id:'g'+(++n), n:name, m, t, ing, s, boost, gen:1});
  /* 1) гарнир × белок × овощ — сковорода одним махом */
  const grains = [['rice',65],['buckwheat',70],['pasta',70],['potato',300]];
  const prots  = [['chicken',180],['turkey',180],['beef',150],['pork',150],['chthigh',170],['cod',250],['salmon',150],['shrimp',150],['tofu',200]];
  const vegs   = [['broccoli',180],['frozenveg',180],['pepper',150],['zucchini',200],['mushroom',130],['cabbage',180]];
  for (const [g,gg] of grains) for (const [p,pg] of prots) for (const [v,vg] of vegs){
    const fish = (p==='cod'||p==='salmon'||p==='shrimp');
    add(`${GNAME[g]} с ${INSTR[p]} и ${INSTR[v]}`, ['l','d'], g==='potato'?30:22,
      [[g,gg],[p,pg],[v,vg],['oil',8],['onion',40,1],['soy',10,1]],
      [ g==='potato' ? 'Картофель дольками обжарь/отвари 12–15 минут до мягкости.' : `${GNAME[g]} отвари по инструкции.`,
        `${ING_BY[p][1]} нарежь и обжарь на масле ${fish?'4–6':'6–8'} минут${p==='tofu'?', раскрошив вилкой':''}.`,
        `Добавь ${INSTR[v]} (и лук), жарь ещё 4–5 минут под крышкой.`,
        'Соедини с гарниром, посоли, специи по вкусу.' ]);
  }
  /* 2) омлеты и яичницы с наполнителями */
  const fills = ['tomato','mushroom','pepper','spinach','cheese','ham','bacon','beans','onion'];
  const fillG = {tomato:110, mushroom:100, pepper:110, spinach:50, cheese:30, ham:60, bacon:35, beans:120, onion:50};
  for (let i=0;i<fills.length;i++){
    add(`Омлет с ${INSTR[fills[i]]}`, ['b'], 10,
      [['egg',165],['milk',50],[fills[i],fillG[fills[i]]],['oil',6]],
      ['Взбей яйца с молоком и солью.', `${ING_BY[fills[i]][1]} — на разогретую сковороду на 2–3 минуты.`, 'Залей яйцами, крышка, 5–6 минут на среднем огне.']);
    for (let j=i+1;j<fills.length;j++){
      add(`Яичница с ${INSTR[fills[i]]} и ${INSTR[fills[j]]}`, ['b','d'], 10,
        [['egg',165],[fills[i],Math.round(fillG[fills[i]]*0.7)],[fills[j],Math.round(fillG[fills[j]]*0.7)],['oil',6]],
        [`${ING_BY[fills[i]][1]} и ${ING_BY[fills[j]][1].toLowerCase()} обжарь 3–4 минуты.`, 'Разбей яйца сверху, крышка, до готовности белка.', 'Соль, перец, зелень.']);

  /* 3) салаты: белок × база */
  const sprots = [['chicken',150],['tuna',120],['egg',165],['feta',60],['chickpea',180],['beans',180],['shrimp',150],['ham',80]];
  const bases = [
    ['tomato','cucumber','salad'],
    ['tomato','pepper','onion'],
    ['cucumber','cabbage','carrot'],
  ];
  const baseG = {tomato:110, cucumber:100, salad:40, pepper:110, onion:30, cabbage:120, carrot:60};
  for (const [p,pg] of sprots) for (let bi=0; bi<bases.length; bi++){
    const b = bases[bi];
    add(`Салат с ${INSTR[p]} (${b.map(x=>ING_BY[x][1].toLowerCase().split(' ')[0]).join(', ')})`, ['l','d','s'], p==='chicken'||p==='shrimp'?15:8,
      [[p,pg], ...b.map(x=>[x,baseG[x]]), ['oil',10]],

  }
  /* 4) каши */
  const kashas = [['oats',60,7],['buckwheat',60,15],['rice',60,20]];
  const tops = [['banana',120],['apple',180],['berries',100],['nuts',20]];
  for (const [k,kg,kt] of kashas) for (const [tp,tg] of tops){
    add(`${GNAME[k]||'Овсянка'} на молоке с ${INSTR[tp]}`, ['b'], kt,
      [[k,kg],['milk',200],[tp,tg],['honey',10,1],['butter',5,1]],

  }
  /* 5) супы */
  const soupP = [['chicken',150],['chthigh',150],['beef',150],['cod',200],['beans',200]];
  for (const [p,pg] of soupP){
    add(`Суп с ${INSTR[p]} и овощами`, ['l'], 35,
      [[p,pg],['potato',200],['carrot',75],['onion',60],['frozenveg',100,1,['peas','cabbage']]],
      [ p==='beans'?'Овощи в 1,2 л кипятка на 12 минут.':`${ING_BY[p][1]} в 1,2–1,5 л воды — 15 минут после закипания.`,
        'Картофель, морковь, лук — ещё 12 минут.', p==='beans'?'Фасоль и овощную смесь — 5 минут, соль, специи.':'Овощная смесь — 5 минут, соль, лавровый лист.' ]);
    add(`Суп-пюре с ${INSTR[p]}`, ['l','d'], 35,
      [[p,pg],['potato',250],['carrot',75],['onion',60],['milk',100,1],['butter',5,1]],
      ['Всё отвари до мягкости 20–25 минут.', 'Пробей блендером, добавь молоко.', 'Прогрей 2 минуты, соль-перец.']);
  }
  /* 6) тосты и врапы */
  const wrapF = [['chicken',120],['tuna',100],['ham',70],['egg',110],['tvorog',120],['salmon',100]];
  for (const [f,fg] of wrapF){

  /* 7) рагу и тушёное */
  const stewP = [['beef',150],['pork',150],['chicken',170],['turkey',170]];
  const stewV = [['zucchini',200,'frozenveg'],['cabbage',250,'pepper'],['potato',250,'carrot']];
  for (const [p,pg] of stewP) for (const [v,vg,v2] of stewV){
    add(`Рагу: ${ING_BY[p][1].toLowerCase()} с ${INSTR[v]}`, ['l','d'], 35,
      [[p,pg],[v,vg],[v2,80,1],['onion',60],['tompaste',25,1,['tomato']],['oil',8]],

  for (const [f,fg] of smB){

  }
  return out;
}

    t.kcal += ing[3]*g; t.p += ing[4]*g; t.f += ing[5]*g; t.c += ing[6]*g;
  }

}

function excluded(id){ return !!(DB.exclude && DB.exclude[id]); }
function allowRecipe(r){
  return r.ing.every(s => s[2] || [s[0], ...(s[3]||[])].some(x => !excluded(x)));
}
function recipesAllowed(){ return allRecipes().filter(allowRecipe); }
/* ---- меню недели ---- */
function weekDays(){
  const out = [];
  for (let i = 0; i < 7; i++){
    const d = new Date(today().getTime() + i*864e5);
    out.push({k: key(d), d, label: DAY_N[(d.getDay()+6)%7]});
  }
  return out;
}
function wmGet(k, mid){ return DB.weekMenu && DB.weekMenu[k] && DB.weekMenu[k][mid] || null; }
function wmSet(k, mid, val){
  DB.weekMenu = DB.weekMenu || {};
  DB.weekMenu[k] = DB.weekMenu[k] || {};
  if (val) DB.weekMenu[k][mid] = val; else delete DB.weekMenu[k][mid];
  save();
}
function mainProt(r){
  for (const s of r.ing){ if (!s[2] && ING_BY[s[0]][2] === 'prot') return s[0]; }
  return null;
}
const WM_SHARE = {b:0.30, l:0.36, d:0.34};
function wmTargetKcal(mid){ return Math.round(DB.kcalTarget * (WM_SHARE[mid]||0.33) / 10) * 10; }
function wmScale(r, mid){
  const base = recipeCalc(r, 1);
  return Math.round(Math.min(1.5, Math.max(0.5, wmTargetKcal(mid)/Math.max(base.kcal,1)))*4)/4;
}

window.wmList = function(q){
  q = (q||'').trim().toLowerCase();
  const {k, mid} = window._wmCtx;
  const keyM = mid;
  let cands = recipesAllowed().filter(r => r.m.includes(keyM) || (keyM==='b' && r.m.includes('s')));
  if (q) cands = cands.filter(r => r.n.toLowerCase().includes(q));
  cands = cands.map(r => {
    const avail = r.ing.every(s => s[2] || ingHave(s));
    const q2 = wmScale(r, mid);

    let score = (avail?2:0) + (r.my?1.2:0) + (r.gen?0:0.5) + t.p*4/Math.max(t.kcal,1);
    return {r, q:q2, t, avail, score};
  }).sort((a,b)=>b.score-a.score).slice(0, q?15:12);
  $('#wm-list').innerHTML = cands.map(o => {

window.weekAuto = function(){
  const days = weekDays();
  const used = {};
  let lastProt = null;
  for (let di = 0; di < days.length; di++){
    for (const mid of ['b','l','d']){
      const cands = recipesAllowed()
        .filter(r => r.m.includes(mid))
        .map((r, i) => {
          const q = wmScale(r, mid);
          const t = recipeCalc(r, q);
          const mp = mainProt(r);
          let score = t.p*4/Math.max(t.kcal,1)*3 + (r.gen?0:0.8) + (r.my?1:0);
          score -= (used[r.id]||0) * 2.2;
          if (mp && mp === lastProt) score -= 1.4;
          if (r.ing.every(s => s[2] || ingHave(s))) score += 0.5;
          score += ((i*7 + di*13 + mid.charCodeAt(0)) % 10) / 22;   // детерминированное разнообразие
          return {r, q, score, mp};
        })
        .sort((a,b)=>b.score-a.score);
      if (!cands.length) continue;
      const c = cands[0];
      wmSet(days[di].k, mid, {rid:c.r.id, q:c.q});
      used[c.r.id] = (used[c.r.id]||0) + 1;
      lastProt = c.mp || lastProt;
    }
  }
  toast('Неделя собрана — правь любой слот');
  weekMenuDlg();
};
window.weekToShop = function(){

/* ============ 11. АНАЛИТИКА / РЕКОМЕНДАЦИИ ============ */
function insights(){
  const out = [];
  const d = today(), w = weekOf(d), lw = lastWeight();
  const push = (lvl,t,p,act) => out.push({lvl,t,p,act});
  // 0. старт
  const nWeights = Object.keys(DB.weights).length;
  const nDone = SESSIONS.filter(s=>DB.sessions[s.id]?.done).length;
  if (nWeights<=1 && !nDone){
    push('info','Начни с двух привычек','Утром — вес (5 секунд), в зале — отмечай подходы. Через 2 недели аналитика начнёт давать советы по калориям и весам на штанге.');
  }
  // 1. дисциплина взвешиваний
  let wl7=0; for (let i=0;i<7;i++){ if (DB.weights[key(new Date(d.getTime()-i*864e5))]!=null) wl7++; }
  if (nWeights>2 && wl7<4) push('warn','Мало взвешиваний: '+wl7+' из 7 дней','Среднее за неделю — главный прибор программы. Без 4–5 точек оно врёт, и корректировки калорий будут наугад.');
  // 2. темп по неделям (правила 7.7)

      const dl = a1-a2;

      else if (dl>-0.5){
        const a0 = w>=3 ? weeklyAvg(DB.weights,w-3) : null;
        const twoSlow = a0!=null && (a2-a0)>-0.5;
        if (twoSlow) push('warn','Вес стоит две недели ('+dl.toFixed(2)+' кг)','Сначала честность подсчёта: масло, соусы, кусочничество, выходные. Если всё честно — правило 7.7: минус 150 ккал или +1500 шагов.',
          {label:'Применить −150 ккал', fn:'adjustKcal(-150, "плато 2 недели")'});
        else push('info','Неделя медленнее плана: '+dl.toFixed(2)+' кг','Одна медленная неделя — шум (вода, соль, стул). Ничего не делай, жди ещё неделю.');
      }
      else if (dl<-1.6 && w>3) push('warn','Слишком быстро: '+dl.toFixed(2)+' кг за неделю','Мышцы дороже скорости. Добавь еды — иначе сила поедет вниз.',
        {label:'Применить +150 ккал', fn:'adjustKcal(150, "слишком быстрый темп")'});
    }
  }

  if (lw){
    const lost = PROF.startWeight - lw.v;

    const stage = Math.floor(lost/mile);

    if (stage > applied && stage>0)
      push('info','Рубеж: сброшено уже '+lost.toFixed(1)+' кг','Тело стало легче и тратит меньше. По программе — минус 100 ккал от текущей нормы.',
        {label:'Применить −100 ккал', fn:'adjustKcal(-100, "рубеж '+r1(stage*mile)+' кг")'});

    if (diff > 1.5) push('warn','Выше траектории на '+diff.toFixed(1)+' кг','Не приговор: траектория — ориентир, а не судья. Проверь подсчёт и шаги; если 2 недели без движения — сработает правило −150 ккал.');
    else if (diff < -1.5) push('info','Опережаешь план на '+(-diff).toFixed(1)+' кг','Если сила в жимах держится — окей. Если поехала вниз, добавь 150 ккал: цель — рекомпозиция, а не сушка.');
  }
  // 4б. цель веса: успеваем к сроку?

    const gd = fromKey(PROF.goal.date), gw = PROF.goal.w;
    const daysLeft = Math.round((gd - d)/864e5);
    const a7g = avg7(DB.weights, d);
    if (a7g != null && daysLeft <= 0){
      if (a7g <= gw + 0.3) push('good','Цель достигнута: '+gw+' кг','Срок вышел — вес взят. Реши, что дальше: удержание или новая цель.', {label:'Новая цель', fn:'goalDlg()'});
      else push('info','Срок цели вышел','Сейчас в среднем '+a7g.toFixed(1)+' кг при цели '+gw+'. Не повод бросать — поставь новый срок по фактическому темпу.', {label:'Обновить цель', fn:'goalDlg()'});
    } else if (a7g != null && daysLeft > 0){
      const needRate = (a7g - gw)/(daysLeft/7);
      const prev14 = avg7(DB.weights, new Date(d.getTime()-14*864e5));
      if (prev14 != null && needRate > 0){
        const factRate = (prev14 - a7g)/2;
        if (factRate < needRate - 0.15)
          push('warn','До цели '+gw+' кг нужно −'+needRate.toFixed(2)+' кг/нед','Фактический темп −'+factRate.toFixed(2)+'. Либо чуть строже с едой и шагами, либо подвинь дату — календарь не начальник.', {label:'Пересмотреть цель', fn:'goalDlg()'});
        else if (factRate > needRate + 0.35)
          push('good','Идёшь быстрее плана к цели '+gw+' кг','К '+fmtD(gd)+' успеваешь с запасом. Следи, чтобы сила в базовых держалась.');
        else
          push('good','Цель '+gw+' кг к '+fmtD(gd)+' — по плану','Темп −'+factRate.toFixed(2)+' кг/нед при нужных −'+needRate.toFixed(2)+'. Так держать.');
      }

  if (days7.length>=3){
    const ap = days7.reduce((a,b)=>a+b,0)/days7.length;
    if (ap < 155) push('warn','Белка мало: в среднем '+Math.round(ap)+' г/день','На дефиците это цена мышц. Добавь 1 белковый модуль в день: творог 250 г или протеин — плюс 30–40 г.');
    else if (ap >= 165) push('good','Белок в норме: '+Math.round(ap)+' г/день','Главный защитник мышц на дефиците работает.');
  }
  // 6. шаги

  const goal = STEP_GOAL(Math.min(w,WEEKS()));
  if (as7!=null && as7 < goal*0.8) push('info','Шаги проседают: '+Math.round(as7).toLocaleString('ru-RU')+' в день','Цель '+goal.toLocaleString('ru-RU')+'. Самый дешёвый способ добрать — 25–30 минут прогулки вечером или пешком часть дороги.');
  // 7. прогрессия якорных упражнений
  {
    const anc = anchorsOf();
    TYPES().forEach(tp => {
      const ei = anc[tp];
      const sm = swapMeta(tp, ei);
      const vIdx = sm.vIdx, base = sm.base, alt = sm.ex;
      const nm = alt.n, isBw = alt.bw || (vIdx===0 && base.bw), vInc = alt.inc || 2.5;
      const hist = exHistory(tp, ei, 3, vIdx).filter(h=>!h.deload);
      if (!hist.length) return;
      const hi = (base.p1||base.p2||base.p0)[3];
      const last = hist[0];
      if (isBw){
        if (last.sets.length>1 && last.sets.every(s=>s.r>=hi))
          push('good', nm+': пора усложнять','Все подходы на верхней границе. Добавь повторы сверх диапазона или перейди на более сложный вариант (кнопка ⇄ в тренировке).');
        return;
      }
      const lastW = Math.max(...last.sets.map(s=>s.w||0));
      if (last.sets.length>1 && last.sets.every(s=>s.r>=hi))
        push('good', nm+': пора добавить вес','Все подходы на верхней границе. Следующая тренировка: '+r1(lastW+vInc)+' кг.');
      else if (hist.length>=3){
        const ws = hist.map(h=>Math.max(...h.sets.map(s=>s.w||0)));
        if (ws[0]===ws[1] && ws[1]===ws[2])
          push('info', nm+': три тренировки на '+ws[0]+' кг','Если повторы тоже не растут — сними 10% и разгонись заново за 2 недели, либо возьми замену из программы. Застой на дефиците — норма, но не месяц.');
      }
    });
  }
  // 7б. ротация приевшихся упражнений
  {
    const anc = anchorsOf();
    for (const tp of TYPES()){
      const ei = anc[tp];
      const sm = swapMeta(tp, ei);
      const hist = exHistory(tp, ei, 8, sm.vIdx);
      const alt = [sm.base, ...(ALTS[tp][ei] ? ALTS[tp][ei].a : [])].filter(o=>o.n!==sm.ex.n)[0];
      if (hist.length >= 6 && alt){
        const nm = sm.ex.n;
        push('info', nm+': '+hist.length+' тренировок подряд', 'Однообразие — враг дисциплины. Можно освежить: замени на «'+alt.n+'» (кнопка ⇄ в тренировке) — история по каждому варианту хранится отдельно, вернёшься в любой момент.');
        break;
      }
    }
  }
  // 8. разгрузка впереди
  const ns = nextSession();
  if (ns && ns.phase==='deload' ) push('info','Следующая тренировка — разгрузочная','−30% веса, по 2 подхода, RPE ≤ 6. Не «потерянная неделя», а причина, почему недели 8–12 пойдут вверх.');

  for (const kk in DB.freeMeals){ if (weekOf(fromKey(kk))===w) freeThisWeek++; }

    const cd = fromKey(cp.date);
    if (d >= cd && d - cd < 7*864e5){
      const st = cpStatus(cp);
      push(st.cls==='b-legs'?'good':'info','Чек-поинт недели '+cp.week+': '+st.txt,'Ориентир был '+cp.wmin+'–'+cp.wmax+' кг. '+(st.cls==='b-legs'?'Программа работает — продолжаем без изменений.':'Загляни в «Вес» и в правила корректировки — и напиши мне в чат, разберём.'));

/* ============ 11а. ГЕЙМИФИКАЦИЯ · ПРОГНОЗЫ · ДАЙДЖЕСТ ============ */
const LVL_TITLES = ['Новичок','В ритме','Дисциплина','Работяга','Атлет','Зверь','Машина','Титан','Легенда зала','Бессмертный'];
function xpCalc(){
  if (typeof DB === 'undefined' || !DB || !DB.sessions) return 0;
  let xp = 0;
  const doneSess = Object.values(DB.sessions).filter(s=>s && s.done);
  xp += doneSess.length * 50;
  xp += doneSess.reduce((a,s)=>a + Object.values(s.sets||{}).flat().filter(Boolean).length, 0) * 2;
  xp += Object.keys(DB.weights||{}).length * 3;
  xp += Object.keys(DB.meas||{}).length * 8;
  xp += Object.keys(DB.photos||{}).length * 12;
  const foodDays = Object.keys(DB.food||{}).filter(k => (DB.food[k].items||[]).length >= 2).length;
  xp += foodDays * 6;
  xp += (DB.cycles||[]).length * 300;
  const stk = (typeof streakCount==='function') ? streakCount() : 0;
  xp += Math.min(stk, 30) * 15;
  return Math.round(xp);
}
function levelInfo(){
  const xp = xpCalc();
  const lvl = Math.min(LVL_TITLES.length, Math.floor(Math.sqrt(xp/120)) + 1);
  const base = 120 * Math.pow(lvl-1, 2), next = 120 * Math.pow(lvl, 2);
  const pct = lvl >= LVL_TITLES.length ? 100 : Math.round((xp - base) / (next - base) * 100);
  return { xp, lvl, title: LVL_TITLES[lvl-1], pct: Math.max(0, Math.min(100, pct)), next };
}

function isoWeekKey(d){
  const dt = new Date(d); dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate() + 3 - (dt.getDay()+6)%7);
  const w1 = new Date(dt.getFullYear(),0,4);

function weekQuests(){
  const d = today();

  const keys = []; for (let i=0;i<7;i++){ const x = new Date(mon); x.setDate(mon.getDate()+i); keys.push(key(x)); }
  const doneSess = Object.entries(DB.sessions).filter(([id,s])=>s && s.done && keys.includes(s.done));
  const planN = Math.min(3, (PROF.days||3));
  const protDays = keys.filter(k => { const t = foodTotals(k); return t.p >= DB.protTarget * 0.95; }).length;
  const weighDays = keys.filter(k => DB.weights[k] != null).length;
  const waterDays = keys.filter(k => ((DB.water||{})[k]||0) >= waterGoal()).length;
  const seed = parseInt(isoWeekKey(d).replace(/\D/g,''),10) || 1;
  const pool = [
    {t:`Закрыть ${planN} тренировки`, cur: doneSess.length, max: planN},
    {t:'Белок в цель 4 дня', cur: protDays, max: 4},
    {t:'Взвеситься 3 раза', cur: weighDays, max: 3},
    {t:'Вода в норме 4 дня', cur: waterDays, max: 4},

function linTrend(pairs){ // [[dayIndex, value]] -> {k, b} per day
  const n = pairs.length; if (n < 2) return null;
  const sx = pairs.reduce((a,p)=>a+p[0],0), sy = pairs.reduce((a,p)=>a+p[1],0);
  const sxx = pairs.reduce((a,p)=>a+p[0]*p[0],0), sxy = pairs.reduce((a,p)=>a+p[0]*p[1],0);
  const den = n*sxx - sx*sx; if (!den) return null;
  const k = (n*sxy - sx*sy)/den;
  return {k, b:(sy - k*sx)/n};
}
function forecastWeight(){
  const ks = Object.keys(DB.weights||{}).sort().slice(-30);

  const t0 = fromKey(ks[0]).getTime();
  const pairs = ks.map(k => [ (fromKey(k).getTime()-t0)/864e5, +DB.weights[k] ]).filter(p=>isFinite(p[1]));
  const tr = linTrend(pairs); if (!tr) return null;
  const perWeek = tr.k * 7;
  const nowD = (today().getTime()-t0)/864e5;
  const cur = tr.k*nowD + tr.b;
  const in4w = cur + perWeek*4;
  const tgts = PROF.targets || {};
  const goal = Math.min(...Object.values(tgts).filter(isFinite));
  let eta = null;
  if (isFinite(goal) && perWeek < -0.05 && cur > goal){
    const weeks = (cur - goal) / (-perWeek);
    if (weeks < 200){ const d = new Date(today().getTime() + weeks*7*864e5); eta = {goal, date: d, weeks: Math.round(weeks)}; }
  }

}
function forecastAnchors(){

    const name = (variantOf(SESSIONS.find(s=>s.type===t)?.id ?? 0, ei) || EXDB[t][ei]).n || EXDB[t][ei].n;
    const hist = exHistory(t, ei, 12, 0).reverse();
    if (hist.length < 3) continue;
    const t0 = fromKey(hist[0].date).getTime();
    const pairs = hist.map(h => {
      let best = 0; h.sets.forEach(x => { if (x.w!=null) best = Math.max(best, x.w*(1+x.r/30)); });
      return [ (fromKey(h.date).getTime()-t0)/864e5, best ];
    }).filter(p=>p[1]>0);
    if (pairs.length < 3) continue;
    const tr = linTrend(pairs); if (!tr || tr.k <= 0.001) continue;
    const nowD = (today().getTime()-t0)/864e5;
    const cur = tr.k*nowD + tr.b;
    const mile = Math.ceil((cur+1)/10)*10;
    const days = (mile - cur)/tr.k;
    if (days < 0 || days > 400) continue;
    out.push({ name, cur: Math.round(cur), mile, date: new Date(today().getTime()+days*864e5) });
  }

function goalMath(){
  const gw = parseFloat($('#goal-w').value);
  const gdv = $('#goal-d').value;
  const lw = lastWeight() ? lastWeight().v : PROF.startWeight;
  if (!isFinite(gw) || gw < 40 || gw > 250 || !gdv) return null;
  const gd = fromKey(gdv);
  const weeks = Math.max(1, (gd - today())/864e5/7);
  const total = lw - gw;                                  // >0 — похудение
  const rateKg = total/weeks;
  const pct = rateKg/lw*100;
  const maint = calcPlan({...PROF, startWeight: lw}).maint;
  const floor = PROF.sex==='m' ? 1800 : 1500;
  const kcal = Math.round((maint - rateKg*7700/7)/50)*50;
  const bmi = lw/Math.pow(PROF.height/100,2);
  const maxPct = bmi>=32 ? 1.0 : bmi>=27 ? 0.85 : 0.7;    // потолок здорового темпа, %/нед
  const maxByKcal = (maint - floor)*7/7700;
  const maxRate = Math.min(lw*maxPct/100, maxByKcal);
  const needWeeks = total > 0 ? Math.ceil(total/Math.max(maxRate, 0.1)) : 0;
  const realDate = new Date(today().getTime() + needWeeks*7*864e5);
  return {gw, gd, lw, weeks, total, rateKg, pct, kcal, floor, maint, maxPct, needWeeks, realDate};
}
window.goalVerdict = function(){
  const el = $('#goal-verdict'); if (!el) return;
  const m = goalMath();
  if (!m){ el.innerHTML = ''; return; }
  let cls = 'insight good', txt = '';
  const setDate = `<button class="btn sm" style="margin-top:8px" onclick="document.getElementById('goal-d').value='${key(m.realDate)}';goalVerdict()">Поставить ${fmtD(m.realDate)}</button>`;
  if (m.total <= 0.01 && m.total >= -0.01){
    cls = 'insight'; txt = '<b>Это твой текущий вес</b><p>Удержание — тоже цель, но без дедлайна. Для похудения или набора поставь другой вес.</p>';
  } else if (m.total < 0){
    const gpct = -m.pct;
    if (gpct > 0.4){ cls = 'insight warn'; txt = `<b>Слишком быстрый набор: +${(-m.rateKg).toFixed(2)} кг/нед</b><p>Сверх +0.35%/нед — в основном жир. Чистый набор мышц медленный: сдвинь дату подальше или уменьши целевой вес.</p>`; }
    else txt = `<b>Аккуратный набор: +${(-m.rateKg).toFixed(2)} кг/нед</b><p>Ориентир ~${m.kcal} ккал/день, белок держим высоким. Вес пойдёт вверх медленно — это правильно.</p>`;
  } else if (m.kcal < m.floor || m.pct > m.maxPct*1.4){
    cls = 'insight bad';
    txt = `<b>Нереалистично без вреда</b><p>Нужно −${m.rateKg.toFixed(1)} кг/нед (${m.pct.toFixed(1)}% веса). Это меньше ${m.floor} ккал/день: потеря мышц, срывы, откат. Реально успеть к <b>${fmtD(m.realDate)}</b>.</p>${setDate}`;
  } else if (m.pct > m.maxPct){
    cls = 'insight warn';
    txt = `<b>Агрессивный темп: −${m.rateKg.toFixed(1)} кг/нед</b><p>${m.pct.toFixed(1)}%/нед — на грани: голодно, тяжело психологически, мышцы под угрозой. Комфортно — к <b>${fmtD(m.realDate)}</b>.</p>${setDate}`;
  } else {
    txt = `<b>Реально: −${m.rateKg.toFixed(1)} кг/нед (${m.pct.toFixed(1)}%)</b><p>~${Math.max(m.kcal, m.floor)} ккал/день · белок ${DB.protTarget} г · проверка по средней за неделю. Дожмём.</p>`;
  }
  el.innerHTML = `<div class="${cls}">${txt}</div>`;
};

function retarget(startW, goalW, weeksTo){
  const cw = Math.max(0, weekOf(today()));
  const t = {...PROF.targets};
  const step = (startW - goalW)/Math.max(1, weeksTo);
  const clampF = startW >= goalW ? Math.max : Math.min;
  for (let w = cw+1; w <= WEEKS(); w++)
    t[w] = Math.round(clampF(goalW, startW - step*(w-cw))*10)/10;
  PROF.targets = t;
}
window.goalSave = function(){
  const m = goalMath();
  if (!m) return toast('Проверь вес и дату');
  PROF.goal = {w: m.gw, date: key(m.gd), set: key(today())};
  const nk = m.total > 0 ? Math.max(m.floor, Math.min(m.kcal, m.maint)) : Math.min(m.kcal, m.maint + 400);
  if (nk !== DB.kcalTarget){
    (DB.kcalLog = DB.kcalLog||[]).push({d: key(today()), delta: nk - DB.kcalTarget, reason: 'цель веса'});
    DB.kcalTarget = nk;
  }
  retarget(avg7(DB.weights, today()) || m.lw, m.gw, m.weeks);
  DB.profile = PROF; save(); buildProgram();
  closeModal(); render(); toast('Цель: '+m.gw+' кг к '+fmtD(m.gd)+' · '+DB.kcalTarget+' ккал/день');
};
window.goalClear = function(){
  delete PROF.goal;
  const lw = lastWeight() ? lastWeight().v : PROF.startWeight;
  const c = calcPlan({...PROF, startWeight: lw});
  if (c.kcal !== DB.kcalTarget){
    (DB.kcalLog = DB.kcalLog||[]).push({d: key(today()), delta: c.kcal - DB.kcalTarget, reason: 'цель снята'});
    DB.kcalTarget = c.kcal;
  }
  const cw = Math.max(0, weekOf(today()));
  const bmi = lw/Math.pow(PROF.height/100,2);
  const rate = bmi>=30 ? 0.0075 : bmi>=25 ? 0.0055 : 0.004;

const MEAL_SPLIT = [['Завтрак',0.25],['Обед',0.30],['Перекус',0.20],['Ужин',0.25]];
function fatRange(){ return PROF.sex==='f' ? [55,75] : [70,90]; }
function genDayPlan(){
  const kcal = DB.kcalTarget, prot = DB.protTarget;
  const F = (cat,i,q) => { const m = FOOD[cat][i]; return {cat, i, q:q||1, n:m[0], p:m[2]*(q||1), f:m[3]*(q||1), c:m[4]*(q||1), kcal:m[5]*(q||1)}; };
  const meals = [
    {name:'Завтрак', items:[F('Углеводы',4), F('Белок',5), F('Овощи и фрукты',1)]},
    {name:'Обед',    items:[F('Углеводы',0), F('Белок',0), F('Овощи и фрукты',0), F('Жиры',0)]},
    {name:'Перекус', items:[F('Белок',3), F('Овощи и фрукты',2), F('Жиры',1)]},
    {name:'Ужин',    items:[F('Углеводы',1), F('Белок',1), F('Овощи и фрукты',0), F('Жиры',0)]},
  ];
  const tot = () => meals.flatMap(m=>m.items).reduce((a,x)=>({p:a.p+x.p, kcal:a.kcal+x.kcal}), {p:0,kcal:0});
  let t = tot(), guard = 0;
  while (t.p < prot - 15 && guard++ < 4){ meals[3].items.push(F('Белок',5)); t = tot(); }
  guard = 0;
  while (t.p > prot + 25 && guard++ < 4){
    for (const m of [meals[2], meals[3], meals[0]]){
      const ix = m.items.findIndex(x=>x.cat==='Белок');
      if (ix >= 0){ m.items.splice(ix,1); break; }
    }
    t = tot();
  }
  guard = 0;
  while (t.kcal < kcal - 160 && guard++ < 5){
    meals[t.kcal < kcal - 380 ? 1 : 0].items.push(t.kcal < kcal - 300 ? F('Углеводы',5) : F('Овощи и фрукты',1));
    t = tot();
  }
  guard = 0;
  while (t.kcal > kcal + 160 && guard++ < 5){
    const m = meals.find(mm => mm.items.some(x=>x.cat==='Жиры')) || meals[1];
    const ix = m.items.findIndex(x=>x.cat==='Жиры' || x.cat==='Овощи и фрукты');
    if (ix<0) break; m.items.splice(ix,1); t = tot();
  }
  return {meals, tot:t};
}

  if (wzDays.length !== wzDaysNeed()) return toast('Выбери ровно '+wzDaysNeed()+' дня тренировок');
  const p = {name, sex:wzSex, age, height:h, startWeight:Math.round(w*10)/10, starts, weeks:wzWeeks,
    place:wzPlace, equip:{...wzEq}, split:wzSplit, days:[...wzDays], inj:{...wzInj}, activity:wzAct, level:wzLvl};
  const c = calcPlan(p);
  const t = today(); const dow = (t.getDay()+6)%7;
  const monday = new Date(t.getTime() + ((7-dow)%7)*864e5);
  const finish = new Date(monday.getTime() + (wzWeeks*7-1)*864e5);
  window._wzP = p; window._wzC = c; window._wzW1 = key(monday);
  openModal(`<h2>Твоя программа готова</h2>
    <div class="kv" style="margin-top:10px"><span>Поддержка (расход)</span><b>≈${c.maint} ккал</b></div>
    <div class="kv"><span>Цель на день</span><b>${c.kcal} ккал · белок ${c.prot} г</b></div>
    <div class="kv"><span>Траектория ${wzWeeks} недель</span><b>${p.startWeight} → ~${c.targets[wzWeeks]} кг</b></div>
    <div class="kv"><span>Старт → финиш</span><b>${fmtD(monday)} (Пн) → ${fmtD(finish)}</b></div>
    <div class="kv"><span>Дни</span><b>${wzDays.map(d=>DAY_N[d]).join(' · ')}</b></div>
    <div class="kv"><span>Формат</span><b>${wzPlace==='home' ? 'Дом · '+(['db','band','bar'].filter(k=>wzEq[k]).map(k=>({db:'гантели',band:'резинка',bar:'турник'})[k]).join(', ')||'вес тела') : 'Зал'} · ${wzSplit==='fb'?'Фулбади A/B':'Push/Pull/Legs'}</b></div>
    <div class="kv"><span>Тренировок</span><b>${wzWeeks*(wzSplit==='fb'?3:4)} за ${wzWeeks} недель</b></div>
    <div class="kv"><span>Стартовые веса</span><b>${starts.bench?('жим '+(Math.round(starts.bench*0.7/2.5)*2.5)+' кг'):(starts.hbench?('жим гантелей '+(Math.round(starts.hbench*0.7/2)*2)+' кг'):'подбор на 1-й неделе')}</b></div>
    <div class="tiny" style="margin-top:8px">Начинаем с ~70% рабочих весов — первые 2 недели лёгкие, это план, а не осторожничание. Калории можно будет менять корректировками.</div>
    <div class="row" style="gap:8px; margin-top:12px">
      <button class="btn sec grow" onclick="closeModal()">Изменить</button>
      <button class="btn grow" onclick="wizardGo()">Начать</button></div>`);
};
window.wizardGo = function(){
  const p = window._wzP, c = window._wzC;
  const stx = {};
  if (p.starts.bench) stx.bench = (Math.round(p.starts.bench*0.7/2.5)*2.5)+' кг';
  if (p.starts.pull) stx.pull = (Math.round(p.starts.pull*0.7/5)*5)+' кг';
  if (p.starts.leg) stx.leg = (Math.round(p.starts.leg*0.6/10)*10)+' кг';
  if (p.starts.thrust) stx.thrust = (Math.round(p.starts.thrust*0.65/5)*5)+' кг';
  if (p.starts.hbench) stx.hbench = (Math.round(p.starts.hbench*0.7/2)*2)+' кг';
  if (p.starts.hrow) stx.hrow = (Math.round(p.starts.hrow*0.7/2)*2)+' кг';
  PROF = { name:p.name, sex:p.sex, age:p.age, height:p.height, startWeight:p.startWeight,
    w1:window._wzW1, legacyWeek0:false, weeks:p.weeks, starts:p.starts,
    place:p.place, equip:p.equip, split:p.split,
    days:p.days, inj:p.inj, activity:p.activity, level:p.level||'some',
    startsText: Object.keys(stx).length?stx:null, targets:c.targets };
  DB.profile = PROF; DB.kcalTarget = c.kcal; DB.protTarget = c.prot;
  DB.weights[key(today())] = p.startWeight;
  save(); closeModal(); buildProgram(); tab='home'; render();
  toast('Программа готова. Старт — '+fmtD(W1)+', а вес уже записан.');
};
/* ============ 15. ЗАГРУЗКА ============ */
const THEME_UNLOCK = {neon:4, gold:7};
function themeAllowed(t){ return !THEME_UNLOCK[t] || levelInfo().lvl >= THEME_UNLOCK[t]; }
function applyTheme(){
  let t = DB.theme || 'light';
  if (THEME_UNLOCK[t] && !themeAllowed(t)) t = 'dark';
  if (t === 'auto') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  const mt = document.querySelector('meta[name=theme-color]');
  const colors = {dark:'#0a1215', neon:'#0b0f14', gold:'#0f0d0a'};
  if (mt) mt.setAttribute('content', colors[t] || '#eef6f6');
}
window.setTheme = function(t){
  if (THEME_UNLOCK[t] && !themeAllowed(t)){
    return toast('🔒 Тема откроется на уровне '+THEME_UNLOCK[t]+' — сейчас '+levelInfo().lvl+'-й');
  }
  DB.theme = t; save(); applyTheme(); render();
  const names = {light:'Светлая тема', dark:'Тёмная тема', auto:'Тема как в системе', neon:'⚡ Тема «Неон»', gold:'👑 Тема «Золото»'};
  toast(names[t] || 'Тема применена');
};
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if ((DB.theme||'light') === 'auto'){ applyTheme(); render(); } }); } catch(e){}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window._instPrompt = e; });
(function boot(){
  applyTheme();
  if (!DB.profile){
    const hasData = (Object.keys(DB.weights||{}).length + Object.keys(DB.sessions||{}).length + Object.keys(DB.food||{}).length) > 0;
    if (hasData){ DB.profile = EGOR; save(); }   // миграция существующего пользователя
  }
  if (DB.profile){ PROF = DB.profile; buildProgram(); render(); }
  else wizard();
})();
/*@JS@*/
</script>
</body>
